function wantedUpdate(dt){if(!wanted)return;let t=driving&&currentCar?currentCar.position:player.position,n=999;police.forEach(p=>n=Math.min(n,D(t,p.car)));if(n>65)wantedTimer+=dt;else wantedTimer=0;if(wantedTimer>8){wanted--;wantedTimer=0;if(!wanted){clearPolice();msg('⭐ YOU ESCAPED')}}}function timeUpdate(dt){gameTime+=dt*.04;if(gameTime>=24)gameTime=0;let d=Math.max(0,Math.sin((gameTime-6)*Math.PI/12));sun.intensity=.3+d*1.7;H.intensity=.35+d*1.2;let h=Math.floor(gameTime),m=Math.floor((gameTime-h)*60);clock.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
/* SAVE */
function save(){localStorage.setItem('OPEN_CITY_V8_HUMAN',JSON.stringify({hp,money,wanted,wi,ammo:weapons.map(w=>w.ammo),mission,kills,x:player.position.x,z:player.position.z,gameTime}));msg('💾 SAVED')}function load(){let s=localStorage.getItem('OPEN_CITY_V8_HUMAN');if(!s)return msg('NO SAVE');let d=JSON.parse(s);hp=d.hp??100;money=d.money??500;wanted=d.wanted??0;wi=d.wi??0;(d.ammo||[]).forEach((a,i)=>weapons[i]&&(weapons[i].ammo=a));mission=d.mission??0;kills=d.kills??0;player.position.set(d.x??0,0,d.z??10);gameTime=d.gameTime??8;clearPolice();weaponUI();msg('💾 LOADED')}
/* INPUT */
const J=document.getElementById('joy'),ST=document.getElementById('stick');function setJ(x,y){let r=J.getBoundingClientRect(),dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,l=Math.hypot(dx,dy),mx=43;if(l>mx){dx=dx/l*mx;dy=dy/l*mx}joyX=dx/mx;joyY=dy/mx;ST.style.transform=`translate(${dx}px,${dy}px)`}function resetJ(){joyX=joyY=0;ST.style.transform='translate(0,0)'}J.onpointerdown=e=>{J.setPointerCapture(e.pointerId);setJ(e.clientX,e.clientY)};J.onpointermove=e=>setJ(e.clientX,e.clientY);J.onpointerup=resetJ;J.onpointercancel=resetJ;let looking=false,lx=0;look.onpointerdown=e=>{looking=true;lx=e.clientX;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(looking){camAngle-=(e.clientX-lx)*.008;lx=e.clientX}};look.onpointerup=()=>looking=false;look.onpointercancel=()=>looking=false;function hold(id,on,off){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();on()};b.onpointerup=off;b.onpointercancel=off}hold('fire',()=>{fireHeld=true;shoot()},()=>fireHeld=false);hold('run',()=>running=true,()=>running=false);hold('gas',()=>gas=true,()=>gas=false);hold('brake',()=>brake=true,()=>brake=false);jump.onpointerdown=()=>{if(!driving&&onGround){vy=5.5;onGround=false}};enter.onpointerdown=enter;use.onpointerdown=use;exit.onpointerdown=exit;repair.onpointerdown=use;save.onpointerdown=save;load.onpointerdown=load;weaponBtn.onpointerdown=()=>{wi=wi?0:(money>=1000?1:0);if(wi)money-=1000;weaponUI()};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')jump.onpointerdown();if(e.key.toLowerCase()==='e')driving?exit():enter();if(e.key.toLowerCase()==='f')shoot();if(e.key.toLowerCase()==='u')use();if(e.key==='1'){wi=0;weaponUI()}if(e.key==='2'){wi=1;weaponUI()}if(e.key.toLowerCase()==='p')save()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
/* UI/MAP */
function camera(){let t=driving&&currentCar?currentCar:player,d=driving?11:9,h=driving?5.5:5.3;C.position.set(t.position.x-Math.sin(camAngle)*d,t.position.y+h,t.position.z-Math.cos(camAngle)*d);C.lookAt(t.position.x,t.position.y+(driving?1.3:2),t.position.z)}const mp=document.getElementById('map'),ctx=mp.getContext('2d');function dot(x,z,c,s){let px=62.5+x/4,py=62.5+z/4;if(px<0||px>125||py<0||py>125)return;ctx.fillStyle=c;ctx.beginPath();ctx.arc(px,py,s,0,6.28);ctx.fill()}function mapDraw(){ctx.fillStyle='#152315';ctx.fillRect(0,0,125,125);ctx.fillStyle='#444';for(let p=-160;p<=160;p+=40){ctx.fillRect(62.5+p/4-2,0,4,125);ctx.fillRect(0,62.5+p/4-2,125,4)}dot(marker.position.x,marker.position.z,mission===4?'#0f5': '#08f',4);enemies.forEach(e=>dot(e.position.x,e.position.z,'#f33',2));police.forEach(p=>dot(p.car.position.x,p.car.position.z,'#fff',3));let t=driving&&currentCar?currentCar:player;dot(t.position.x,t.position.z,'#0ff',4)}function ui(){hp=Math.max(0,hp);document.getElementById('hp').textContent=Math.floor(hp);money=Math.floor(money);document.getElementById('money').textContent=money;wanted=document.getElementById('wanted').textContent=wanted;document.getElementById('police').textContent=police.length;document.getElementById('heli').textContent=0;document.getElementById('carhp').textContent=driving?Math.floor(currentCar.userData.health):'---';if(!driving)enter.style.display=nearCar()?'block':'none'}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clk.getDelta(),.05);if(fireHeld){fireTimer-=dt;if(fireTimer<=0){shoot();fireTimer=weapon().fireRate}}walk(dt);driveCar(dt);trafficUpdate(dt);people(dt);enemyUpdate(dt);policeUpdate(dt);wantedUpdate(dt);missionUpdate();timeUpdate(dt);if(hp<=0){hp=100;money=Math.max(0,money-200);wanted=0;clearPolice();if(driving)exit();player.position.set(0,0,10);msg('💀 YOU DIED -$200')}ui();weaponUI();camera();mapDraw();R.render(S,C)}weaponUI();loading.style.display='none';msg('WELCOME TO OPEN CITY V8');loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})}
</script></body></html>
