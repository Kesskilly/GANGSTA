<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V3</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#111;
 font-family:Arial,sans-serif;
 touch-action:none;
}
#game{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 z-index:1;
}
#loading{
 position:fixed;
 inset:0;
 z-index:20;
 background:#111;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 font-size:22px;
}
#loading small{margin-top:10px;color:#aaa}

#hud{
 position:fixed;
 top:10px;
 left:10px;
 z-index:10;
 color:white;
 text-shadow:2px 2px #000;
 font-weight:bold;
 pointer-events:none;
 line-height:1.5;
}
#mission{
 margin-top:5px;
 max-width:300px;
 color:#7dd3fc;
}
#weapon{
 color:#ffd166;
}
#wanted{
 color:#ff5555;
}
#health{
 color:#55ff88;
}

#help{
 position:fixed;
 top:10px;
 right:10px;
 z-index:10;
 color:white;
 text-shadow:2px 2px #000;
 text-align:right;
 font-size:12px;
 pointer-events:none;
}

#map{
 position:fixed;
 right:10px;
 bottom:10px;
 width:130px;
 height:130px;
 background:rgba(0,0,0,.65);
 border:2px solid white;
 border-radius:8px;
 z-index:10;
}

#cross{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:white;
 font-size:25px;
 z-index:9;
 pointer-events:none;
 text-shadow:0 0 5px #000;
}

#controls{
 position:fixed;
 inset:0;
 z-index:11;
 pointer-events:none;
}
#joy{
 position:absolute;
 left:20px;
 bottom:25px;
 width:125px;
 height:125px;
 border:2px solid rgba(255,255,255,.4);
 border-radius:50%;
 background:rgba(255,255,255,.08);
 pointer-events:auto;
}
#stick{
 position:absolute;
 width:55px;
 height:55px;
 left:33px;
 top:33px;
 border-radius:50%;
 background:rgba(255,255,255,.35);
}

.btn{
 position:absolute;
 width:62px;
 height:62px;
 border-radius:50%;
 border:2px solid rgba(255,255,255,.5);
 background:rgba(20,20,20,.6);
 color:white;
 font-weight:bold;
 pointer-events:auto;
 user-select:none;
 display:flex;
 align-items:center;
 justify-content:center;
}
#fire{right:25px;bottom:30px;background:rgba(180,30,30,.7)}
#jump{right:100px;bottom:105px}
#enter{right:25px;bottom:105px}
#swap{right:100px;bottom:30px}
#look{
 position:absolute;
 right:0;
 top:0;
 width:55%;
 height:65%;
 pointer-events:auto;
}
#gas{
 right:175px;
 bottom:30px;
 width:55px;
 height:55px;
}
#brake{
 right:175px;
 bottom:95px;
 width:55px;
 height:55px;
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="loading">
 OPEN CITY V3
 <small>Loading city...</small>
</div>

<canvas id="game"></canvas>

<div id="hud">
 <div>❤️ Health: <span id="health">100</span></div>
 <div>💰 $<span id="money">500</span></div>
 <div>🔫 <span id="weapon">PISTOL</span></div>
 <div>🔴 Wanted: <span id="wanted">0</span></div>
 <div id="mission">Mission: Reach the blue marker</div>
</div>

<div id="help">
 WASD / JOYSTICK<br>
 FIRE • JUMP • ENTER CAR<br>
 R = CHANGE WEAPON
</div>

<div id="cross">+</div>
<canvas id="map" width="130" height="130"></canvas>

<div id="controls">
 <div id="joy"><div id="stick"></div></div>
 <div id="look"></div>

 <div class="btn" id="fire">FIRE</div>
 <div class="btn" id="jump">JUMP</div>
 <div class="btn" id="enter">CAR</div>
 <div class="btn" id="swap">GUN</div>
 <div class="btn" id="gas">GAS</div>
 <div class="btn" id="brake">STOP</div>
</div>

<script>
const threeScript=document.createElement("script");
threeScript.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js";

threeScript.onload=()=>startGame();

threeScript.onerror=()=>{
 document.querySelector("#loading").innerHTML=
 "<b>Three.js could not load.</b><small>Check your internet connection and reload.</small>";
};

document.head.appendChild(threeScript);


/* =========================================================
   OPEN CITY V3
   ========================================================= */

function startGame(){

const T=THREE;

/* ---------- BASIC SETUP ---------- */

const canvas=document.getElementById("game");

const renderer=new T.WebGLRenderer({
 canvas:canvas,
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=false;

const scene=new T.Scene();
scene.background=new T.Color(0x87ceeb);
scene.fog=new T.Fog(0x87ceeb,80,260);

const camera=new T.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 400
);

camera.position.set(0,5,8);

const clock=new T.Clock();


/* ---------- LIGHT ---------- */

const hemi=new T.HemisphereLight(
 0xffffff,
 0x555555,
 1.4
);

scene.add(hemi);

const sun=new T.DirectionalLight(
 0xffffff,
 1
);

sun.position.set(50,100,30);
scene.add(sun);


/* ---------- MATERIALS ---------- */

const matGround=new T.MeshLambertMaterial({color:0x477447});
const matRoad=new T.MeshLambertMaterial({color:0x292929});
const matSide=new T.MeshLambertMaterial({color:0x777777});
const matWhite=new T.MeshLambertMaterial({color:0xffffff});
const matRed=new T.MeshLambertMaterial({color:0xcc2222});
const matBlue=new T.MeshLambertMaterial({color:0x2266cc});
const matYellow=new T.MeshLambertMaterial({color:0xffcc22});
const matSkin=new T.MeshLambertMaterial({color:0xd79b70});
const matBlack=new T.MeshLambertMaterial({color:0x181818});
const matPolice=new T.MeshLambertMaterial({color:0x1d3f91});
const matGreen=new T.MeshLambertMaterial({color:0x249447});


/* ---------- WORLD ---------- */

const ground=new T.Mesh(
 new T.PlaneGeometry(320,320),
 matGround
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);


/* ---------- ROADS ---------- */

function road(x,z,w,d){

 const r=new T.Mesh(
  new T.BoxGeometry(w,.12,d),
  matRoad
 );

 r.position.set(x,.06,z);
 scene.add(r);

 return r;
}

road(0,0,18,320);
road(0,0,320,18);
road(-75,0,12,320);
road(75,0,12,320);
road(0,-75,320,12);
road(0,75,320,12);


/* ---------- ROAD LINES ---------- */

function line(x,z,w,d){

 const m=new T.Mesh(
  new T.BoxGeometry(w,.03,d),
  matYellow
 );

 m.position.set(x,.13,z);
 scene.add(m);
}

for(let z=-145;z<=145;z+=12){
 line(0,z,.3,5);
}

for(let x=-145;x<=145;x+=12){
 line(x,0,5,.3);
}


/* ---------- BUILDINGS ---------- */

const buildings=[];

function building(x,z,w,d,h,c){

 const b=new T.Mesh(
  new T.BoxGeometry(w,h,d),
  new T.MeshLambertMaterial({color:c})
 );

 b.position.set(x,h/2,z);
 scene.add(b);
 buildings.push(b);

 /* roof */

 const roof=new T.Mesh(
  new T.BoxGeometry(w+.3,.35,d+.3),
  matBlack
 );

 roof.position.set(x,h+.18,z);
 scene.add(roof);
}


/* city blocks */

const colors=[
 0x777777,
 0x996655,
 0x557799,
 0x777755,
 0x995577,
 0x556666
];

for(let x=-140;x<=140;x+=35){

 for(let z=-140;z<=140;z+=35){

  if(
   Math.abs(x)<25 ||
   Math.abs(z)<25
  ) continue;

  const h=12+Math.random()*25;

  building(
   x+(Math.random()*8-4),
   z+(Math.random()*8-4),
   20,
   20,
   h,
   colors[Math.floor(Math.random()*colors.length)]
  );
 }
}


/* ---------- TREES ---------- */

function tree(x,z){

 const trunk=new T.Mesh(
  new T.CylinderGeometry(.35,.45,3,7),
  new T.MeshLambertMaterial({color:0x704522})
 );

 trunk.position.set(x,1.5,z);
 scene.add(trunk);

 const top=new T.Mesh(
  new T.SphereGeometry(2.3,8,6),
  new T.MeshLambertMaterial({color:0x20752e})
 );

 top.position.set(x,4,z);
 scene.add(top);
}

for(let i=0;i<70;i++){

 const x=(Math.random()-.5)*280;
 const z=(Math.random()-.5)*280;

 if(Math.abs(x)<15 || Math.abs(z)<15) continue;

 tree(x,z);
}


/* =========================================================
   HUMAN MODEL
   ========================================================= */

function human(color=0x2266cc){

 const g=new T.Group();

 const body=new T.Mesh(
  new T.BoxGeometry(1.1,1.5,.65),
  new T.MeshLambertMaterial({color})
 );

 body.position.y=2.15;
 g.add(body);

 const head=new T.Mesh(
  new T.SphereGeometry(.42,10,8),
  matSkin
 );

 head.position.y=3.35;
 g.add(head);

 const armL=new T.Mesh(
  new T.BoxGeometry(.28,1.35,.28),
  new T.MeshLambertMaterial({color})
 );

 const armR=armL.clone();

 armL.position.set(-.78,2.15,0);
 armR.position.set(.78,2.15,0);

 g.add(armL,armR);

 const legL=new T.Mesh(
  new T.BoxGeometry(.32,1.3,.35),
  matBlack
 );

 const legR=legL.clone();

 legL.position.set(-.3,.75,0);
 legR.position.set(.3,.75,0);

 g.add(legL,legR);

 g.userData.armL=armL;
 g.userData.armR=armR;
 g.userData.legL=legL;
 g.userData.legR=legR;

 return g;
}


/* =========================================================
   PLAYER
   ========================================================= */

const player=new T.Group();

const playerBody=human(0x2266dd);
player.add(playerBody);

player.position.set(0,0,12);
scene.add(player);

player.userData.health=100;
player.userData.speed=8;
player.userData.walkTime=0;
player.userData.inCar=false;
player.userData.car=null;
player.userData.money=500;


/* =========================================================
   PEDestrians
   ========================================================= */

const people=[];

for(let i=0;i<14;i++){

 const p=human(
  [0xcc4444,0x44aa55,0x8855cc,0xdd8844][i%4]
 );

 p.position.set(
  (Math.random()-.5)*180,
  0,
  (Math.random()-.5)*180
 );

 p.userData.dir=Math.random()*Math.PI*2;
 p.userData.walkTime=Math.random()*10;

 scene.add(p);
 people.push(p);
}


/* =========================================================
   CARS
   ========================================================= */

const cars=[];

function createCar(x,z,color=0xcc2222,police=false){

 const g=new T.Group();

 const base=new T.Mesh(
  new T.BoxGeometry(3.4,.9,6),
  new T.MeshLambertMaterial({
   color:police?0x202d8a:color
  })
 );

 base.position.y=1;
 g.add(base);

 const roof=new T.Mesh(
  new T.BoxGeometry(2.5,1,3),
  new T.MeshLambertMaterial({
   color:police?0x111d55:color
  })
 );

 roof.position.y=1.8;
 g.add(roof);

 const wheelMat=new T.MeshLambertMaterial({color:0x111111});

 for(const sx of[-1,1]){
  for(const sz of[-2,2]){

   const wheel=new T.Mesh(
    new T.CylinderGeometry(.55,.55,.35,10),
    wheelMat
   );

   wheel.rotation.z=Math.PI/2;
   wheel.position.set(
    sx*1.7,
    .55,
    sz
   );

   g.add(wheel);
  }
 }

 if(police){

  const light=new T.Mesh(
   new T.BoxGeometry(1.2,.25,.5),
   new T.MeshLambertMaterial({color:0xff2222})
  );

  light.position.y=2.45;
  g.add(light);
 }

 g.position.set(x,0,z);

 g.userData.speed=0;
 g.userData.health=100;
 g.userData.police=police;
 g.userData.traffic=false;

 scene.add(g);
 cars.push(g);

 return g;
}


/* parked cars */

const carColors=[
 0xcc2222,
 0x2266cc,
 0xeeeeee,
 0x22aa66,
 0xdd9922,
 0x993399
];

for(let i=0;i<8;i++){

 createCar(
  -8+(i%4)*5,
  -12-Math.floor(i/4)*7,
  carColors[i%carColors.length]
 );
}


/* traffic */

for(let i=0;i<12;i++){

 const c=createCar(
  Math.random()<.5?-75:75,
  (Math.random()-.5)*280,
  carColors[i%carColors.length]
 );

 c.rotation.y=Math.PI/2;
 c.userData.traffic=true;
 c.userData.speed=4+Math.random()*3;
}


/* =========================================================
   WEAPONS
   ========================================================= */

const weapons=[
 {
  name:"PISTOL",
  damage:25,
  range:55,
  cooldown:350
 },
 {
  name:"RIFLE",
  damage:40,
  range:90,
  cooldown:180
 }
];

let weaponIndex=0;
let lastShot=0;


/* =========================================================
   WANTED
   ========================================================= */

let wanted=0;

function addWanted(n=1){

 wanted=Math.min(5,wanted+n);

}


/* =========================================================
   HEALTH
   ========================================================= */

function damagePlayer(amount){

 if(player.userData.inCar){

  player.userData.car.userData.health-=amount*.35;

  if(player.userData.car.userData.health<=0){
   exitCar();
  }

  return;
 }

 player.userData.health-=amount;

 if(player.userData.health<=0){

  player.userData.health=100;
  player.position.set(0,0,12);
  wanted=0;
  player.userData.money=Math.max(
   0,
   player.userData.money-100
  );
 }
}


/* =========================================================
   SHOOTING
   ========================================================= */

const raycaster=new T.Raycaster();

function shoot(){

 const now=performance.now();
 const weapon=weapons[weaponIndex];

 if(now-lastShot<weapon.cooldown)return;

 lastShot=now;

 raycaster.setFromCamera(
  new T.Vector2(0,0),
  camera
 );

 const objects=[];

 for(const p of people) objects.push(p);

 for(const c of cars) objects.push(c);

 const hits=raycaster.intersectObjects(
  objects,
  true
 );

 if(hits.length){

  let obj=hits[0].object;

  while(obj.parent && !people.includes(obj) && !cars.includes(obj)){
   obj=obj.parent;
  }

  const person=people.find(p=>obj===p);

  if(person){

   person.userData.health=
    (person.userData.health||100)-weapon.damage;

   addWanted(1);

   if(person.userData.health<=0){

    scene.remove(person);

    const index=people.indexOf(person);

    if(index>=0) people.splice(index,1);

    player.userData.money+=50;
   }

  }

  const car=cars.find(c=>obj===c);

  if(car){

   car.userData.health-=weapon.damage;

   addWanted(1);

   if(car.userData.health<=0){

    scene.remove(car);

    const index=cars.indexOf(car);

    if(index>=0) cars.splice(index,1);
   }
  }
 }
}


/* =========================================================
   MISSIONS
   ========================================================= */

let mission=0;

const missionText=[
 "Mission 1: Reach the blue marker",
 "Mission 2: Steal a car",
 "Mission 3: Defeat 3 enemies",
 "Mission 4: Escape the police",
 "Mission complete! Free roam"
];

let kills=0;

const marker=new T.Mesh(
 new T.CylinderGeometry(3,3,.2,32),
 new T.MeshBasicMaterial({
  color:0x00aaff,
  transparent:true,
  opacity:.65
 })
);

marker.position.set(35,.15,-35);
scene.add(marker);

function distance(a,b){

 return a.position.distanceTo(b.position);

}

function updateMission(){

 if(mission===0){

  if(distance(player,marker)<6){

   mission=1;

   marker.position.set(-12,.15,-12);
  }
 }

 else if(mission===1){

  if(player.userData.inCar){

   mission=2;

   marker.position.set(45,.15,45);
  }
 }

 else if(mission===2){

  if(kills>=3){

   mission=3;

   marker.position.set(0,.15,0);
  }
 }

 else if(mission===3){

  if(wanted===0){

   mission=4;

   marker.visible=false;
  }
 }

 document.getElementById("mission").textContent=
 missionText[mission];
}


/* =========================================================
   CAR ENTRY
   ========================================================= */

function nearestCar(){

 let best=null;
 let bestD=8;

 for(const c of cars){

  if(c.userData.police)continue;

  const d=player.position.distanceTo(c.position);

  if(d<bestD){

   bestD=d;
   best=c;
  }
 }

 return best;
}

function enterCar(){

 if(player.userData.inCar){

  exitCar();
  return;
 }

 const c=nearestCar();

 if(!c)return;

 player.userData.inCar=true;
 player.userData.car=c;

 player.visible=false;

 c.userData.speed=0;

 addWanted(1);
}

function exitCar(){

 if(!player.userData.inCar)return;

 const c=player.userData.car;

 player.userData.inCar=false;
 player.userData.car=null;

 player.visible=true;

 player.position.copy(c.position);
 player.position.x+=3;
}


/* =========================================================
   POLICE
   ========================================================= */

let policeCars=[];

function spawnPolice(){

 if(policeCars.length>=wanted)return;

 const angle=Math.random()*Math.PI*2;

 const p=createCar(
  player.position.x+Math.cos(angle)*45,
  player.position.z+Math.sin(angle)*45,
  0x1111aa,
  true
 );

 policeCars.push(p);
}

function updatePolice(dt){

 if(wanted<=0){

  for(const p of policeCars){

   p.userData.speed=0;
  }

  return;
 }

 while(policeCars.length<wanted){

  spawnPolice();
 }

 for(let i=policeCars.length-1;i>=0;i--){

  const p=policeCars[i];

  if(!p.parent){

   policeCars.splice(i,1);
   continue;
  }

  const dx=player.position.x-p.position.x;
  const dz=player.position.z-p.position.z;

  const d=Math.hypot(dx,dz);

  if(d>1){

   const ang=Math.atan2(dx,dz);

   p.rotation.y=ang;

   p.position.x+=Math.sin(ang)*dt*(7+wanted);
   p.position.z+=Math.cos(ang)*dt*(7+wanted);
  }

  if(d<4){

   damagePlayer(12*dt);
  }
 }
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

const keys={};

addEventListener("keydown",e=>{

 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==="r"){
  switchWeapon();
 }

});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});


let joyX=0;
let joyY=0;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyActive=false;

function joyMove(x,y){

 const r=joy.getBoundingClientRect();

 let dx=x-(r.left+r.width/2);
 let dy=y-(r.top+r.height/2);

 const max=45;

 const len=Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;
 }

 stick.style.transform=
 `translate(${dx}px,${dy}px)`;

 joyX=dx/max;
 joyY=dy/max;
}

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 joyMove(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)joyMove(e.clientX,e.clientY);
});

joy.addEventListener("pointerup",()=>{
 joyActive=false;
 joyX=0;
 joyY=0;
 stick.style.transform="";
});

function switchWeapon(){

 weaponIndex++;

 if(weaponIndex>=weapons.length)
  weaponIndex=0;

 document.getElementById("weapon").textContent=
  weapons[weaponIndex].name;
}


/* =========================================================
   LOOK
   ========================================================= */

let lookActive=false;
let lastLookX=0;
let lastLookY=0;

const look=document.getElementById("look");

look.addEventListener("pointerdown",e=>{

 lookActive=true;
 lastLookX=e.clientX;
 lastLookY=e.clientY;

 look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",e=>{

 if(!lookActive)return;

 const dx=e.clientX-lastLookX;

 camera.rotation.y-=dx*.006;

 lastLookX=e.clientX;
 lastLookY=e.clientY;
});

look.addEventListener("pointerup",()=>{
 lookActive=false;
});


/* =========================================================
   BUTTONS
   ========================================================= */

let firing=false;
let gasHeld=false;
let brakeHeld=false;

const fire=document.getElementById("fire");

fire.addEventListener("pointerdown",()=>{
 firing=true;
});

fire.addEventListener("pointerup",()=>{
 firing=false;
});

fire.addEventListener("pointercancel",()=>{
 firing=false;
});

document.getElementById("jump").addEventListener(
 "pointerdown",
 ()=>jump()
);

document.getElementById("enter").addEventListener(
 "pointerdown",
 ()=>enterCar()
);

document.getElementById("swap").addEventListener(
 "pointerdown",
 ()=>switchWeapon()
);

document.getElementById("gas").addEventListener(
 "pointerdown",
 ()=>gasHeld=true
);

document.getElementById("gas").addEventListener(
 "pointerup",
 ()=>gasHeld=false
);

document.getElementById("brake").addEventListener(
 "pointerdown",
 ()=>brakeHeld=true
);

document.getElementById("brake").addEventListener(
 "pointerup",
 ()=>brakeHeld=false
);


/* =========================================================
   JUMP
   ========================================================= */

let verticalVelocity=0;
let onGround=true;

function jump(){

 if(!onGround)return;

 verticalVelocity=9;
 onGround=false;
}


/* =========================================================
   WALKING
   ========================================================= */

function animateHuman(g,amount,dt){

 if(!g)return;

 const swing=Math.sin(amount*10)*.55;

 g.userData.armL.rotation.x=swing;
 g.userData.armR.rotation.x=-swing;

 g.userData.legL.rotation.x=-swing;
 g.userData.legR.rotation.x=swing;
}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer(dt){

 if(player.userData.inCar){

  const c=player.userData.car;

  if(!c || !c.parent){

   player.userData.inCar=false;
   player.userData.car=null;
   player.visible=true;

  }else{

   let throttle=0;

   if(gasHeld || keys["w"])
    throttle=1;

   if(brakeHeld || keys["s"])
    throttle=-1;

   c.userData.speed+=throttle*dt*15;

   c.userData.speed*=.97;

   c.userData.speed=
    Math.max(-5,Math.min(18,c.userData.speed));

   if(Math.abs(c.userData.speed)>.1){

    c.position.x+=
     Math.sin(c.rotation.y)*c.userData.speed*dt;

    c.position.z+=
     Math.cos(c.rotation.y)*c.userData.speed*dt;
   }

   if(keys["a"])
    c.rotation.y+=dt*1.8;

   if(keys["d"])
    c.rotation.y-=dt*1.8;

   player.position.copy(c.position);

  }

  return;
 }


 let x=joyX;
 let y=joyY;

 if(keys["a"])x-=1;
 if(keys["d"])x+=1;
 if(keys["w"])y-=1;
 if(keys["s"])y+=1;

 const moving=Math.hypot(x,y)>0.1;

 if(moving){

  const speed=keys["shift"]?13:8;

  const angle=camera.rotation.y;

  player.position.x+=
   Math.sin(angle)*(-y)*speed*dt+
   Math.cos(angle)*x*speed*dt;

  player.position.z+=
   Math.cos(angle)*(-y)*speed*dt-
   Math.sin(angle)*x*speed*dt;

  player.userData.walkTime+=dt;

  animateHuman(
   playerBody,
   player.userData.walkTime,
   dt
  );
 }


 /* jump physics */

 verticalVelocity-=22*dt;

 player.position.y+=verticalVelocity*dt;

 if(player.position.y<=0){

  player.position.y=0;
  verticalVelocity=0;
  onGround=true;
 }
}


/* =========================================================
   PEDESTRIANS
   ========================================================= */

function updatePeople(dt){

 for(const p of people){

  p.userData.walkTime+=dt;

  const speed=1.2;

  p.position.x+=
   Math.sin(p.userData.dir)*speed*dt;

  p.position.z+=
   Math.cos(p.userData.dir)*speed*dt;

  animateHuman(
   p,
   p.userData.walkTime,
   dt
  );

  if(Math.abs(p.position.x)>150 ||
     Math.abs(p.position.z)>150){

   p.userData.dir+=Math.PI;
  }
 }
}


/* =========================================================
   TRAFFIC
   ========================================================= */

function updateTraffic(dt){

 for(const c of cars){

  if(!c.userData.traffic)continue;

  c.position.z+=c.userData.speed*dt;

  if(c.position.z>160)
   c.position.z=-160;
 }
}


/* =========================================================
   WANTED SYSTEM
   ========================================================= */

let wantedTimer=0;

function updateWanted(dt){

 if(wanted<=0)return;

 wantedTimer+=dt;

 if(wantedTimer>15){

  const nearPolice=policeCars.some(
   p=>p.parent &&
   p.position.distanceTo(player.position)<45
  );

  if(!nearPolice){

   wanted=Math.max(0,wanted-1);
   wantedTimer=0;
  }
 }
}


/* =========================================================
   TIME / DAY NIGHT
   ========================================================= */

let worldTime=12;

function updateDayNight(dt){

 worldTime+=dt*.15;

 if(worldTime>=24)
  worldTime=0;

 const daylight=
  Math.max(
   .15,
   Math.sin((worldTime-6)/24*Math.PI*2)*.5+.5
  );

 sun.intensity=.3+daylight*.9;
 hemi.intensity=.4+daylight;

 if(daylight<.35){

  scene.background.set(0x10182e);
  scene.fog.color.set(0x10182e);

 }else{

  scene.background.set(0x87ceeb);
  scene.fog.color.set(0x87ceeb);
 }
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

 let target;

 if(player.userData.inCar){

  target=player.userData.car.position.clone();
  target.y+=2.5;

 }else{

  target=player.position.clone();
  target.y+=2.5;
 }

 const angle=camera.rotation.y;

 const distance=player.userData.inCar?10:7;

 const desired=new T.Vector3(
  target.x-Math.sin(angle)*distance,
  target.y+2,
  target.z-Math.cos(angle)*distance
 );

 camera.position.lerp(desired,.12);

 camera.lookAt(target);
}


/* =========================================================
   MINIMAP
   ========================================================= */

const map=document.getElementById("map");
const ctx=map.getContext("2d");

function drawMap(){

 ctx.clearRect(0,0,130,130);

 ctx.fillStyle="#202020";
 ctx.fillRect(0,0,130,130);

 const scale=.32;

 function dot(x,z,color,size){

  const mx=65+x*scale;
  const mz=65+z*scale;

  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.arc(mx,mz,size,0,Math.PI*2);
  ctx.fill();
 }

 /* roads */

 ctx.fillStyle="#555";

 ctx.fillRect(59,0,12,130);
 ctx.fillRect(0,59,130,12);

 dot(
  player.position.x,
  player.position.z,
  "#00ff66",
  4
 );

 if(marker.visible){

  dot(
   marker.position.x,
   marker.position.z,
   "#00aaff",
   4
  );
 }

 for(const p of policeCars){

  if(p.parent){

   dot(
    p.position.x,
    p.position.z,
    "#ff2222",
    3
   );
  }
 }
}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

 document.getElementById("health").textContent=
  Math.max(0,Math.floor(player.userData.health));

 document.getElementById("money").textContent=
  Math.floor(player.userData.money);

 document.getElementById("wanted").textContent=
  wanted;

}


/* =========================================================
   FIRE LOOP
   ========================================================= */

function updateFire(){

 if(firing)
  shoot();
}


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight,false);
});


/* =========================================================
   START
   ========================================================= */

document.getElementById("loading").style.display="none";

renderer.render(scene,camera);


/* =========================================================
   MAIN LOOP
   ========================================================= */

function loop(){

 requestAnimationFrame(loop);

 const dt=Math.min(clock.getDelta(),.05);

 updatePlayer(dt);
 updatePeople(dt);
 updateTraffic(dt);
 updatePolice(dt);
 updateWanted(dt);
 updateDayNight(dt);
 updateMission();
 updateFire();
 updateCamera();
 updateHUD();
 drawMap();

 renderer.render(scene,camera);
}

loop();

} // startGame
</script>
