<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V7.1</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#79a9c8;font-family:Arial;touch-action:none
}
canvas{display:block}

#hud{
 position:fixed;top:8px;left:8px;color:#fff;
 text-shadow:2px 2px 3px #000;z-index:20;font-size:13px
}
#hud b{font-size:18px}

#map{
 position:fixed;right:8px;top:8px;width:120px;height:120px;
 border:2px solid #fff;border-radius:8px;z-index:20
}

#cross{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:#fff;font-size:24px;z-index:5
}

#joy{
 position:fixed;left:15px;bottom:15px;
 width:125px;height:125px;border:3px solid #ffffff88;
 border-radius:50%;background:#0004;z-index:30
}

#stick{
 position:absolute;left:33px;top:33px;
 width:52px;height:52px;border-radius:50%;background:#fff9
}

#look{
 position:fixed;right:0;top:0;width:58%;height:65%;z-index:10
}

#buttons,#drive{
 position:fixed;right:8px;bottom:10px;
 width:245px;display:flex;gap:6px;flex-wrap:wrap;z-index:40
}

#drive{display:none}

button{
 width:60px;height:60px;border:2px solid #fff9;
 border-radius:50%;background:#000b;color:#fff;
 font-weight:bold;font-size:10px
}

#fire{background:#a00000dd}
#enter{display:none;background:#087cdd}

#save,#load{
 position:fixed;left:8px;width:70px;height:35px;
 border-radius:8px;font-size:10px;z-index:50
}

#save{bottom:150px}
#load{bottom:108px}

#msg{
 position:fixed;left:50%;top:43%;
 transform:translate(-50%,-50%);
 color:#fff;font-size:23px;font-weight:bold;
 text-align:center;text-shadow:2px 2px 5px #000;
 z-index:60;display:none;white-space:nowrap
}
</style>
</head>

<body>

<div id="hud">
<b>OPEN CITY V7.1</b><br>
❤️ <span id="hp">100</span>
&nbsp; 🔫 <span id="ammo">30</span>
&nbsp; 💵 $<span id="money">1000</span><br>

⭐ <span id="wanted">0</span>
&nbsp; 🚓 <span id="police">0</span>
&nbsp; 🚁 <span id="heli">0</span><br>

🕐 <span id="clock">08:00</span>
&nbsp; 🔫 <span id="weapon">PISTOL</span><br>

📋 <span id="mission">Reach the blue marker</span>
</div>

<canvas id="map"></canvas>

<div id="cross">+</div>
<div id="msg"></div>

<button id="save">SAVE</button>
<button id="load">LOAD</button>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="look"></div>

<div id="buttons">
<button id="fire">FIRE</button>
<button id="jump">JUMP</button>
<button id="run">RUN</button>
<button id="shopBtn">SHOP</button>
<button id="use">USE</button>
<button id="enter">ENTER</button>
</div>

<div id="drive">
<button id="gas">GAS</button>
<button id="brake">BRAKE</button>
<button id="exit">EXIT</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
.1,
500
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.background=new THREE.Color(0x82b5d4);
scene.fog=new THREE.Fog(0x82b5d4,70,300);

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x405040,
  1.6
 )
);

const sun=new THREE.DirectionalLight(
 0xffffff,
 1.8
);

sun.position.set(80,120,50);
scene.add(sun);


function box(w,h,d,c,x,y,z,p=scene){

 let m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:c})
 );

 m.position.set(x,y,z);
 p.add(m);

 return m;
}


function d(a,b){
 return Math.hypot(
  a.position.x-b.position.x,
  a.position.z-b.position.z
 );
}


function msg(t){

 let m=document.getElementById("msg");

 m.innerHTML=t;
 m.style.display="block";

 clearTimeout(msg.t);

 msg.t=setTimeout(
  ()=>m.style.display="none",
  1100
 );
}


/* WORLD */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(400,400),
 new THREE.MeshStandardMaterial({color:0x39783c})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);


for(let x=-100;x<=100;x+=40){

 box(12,.1,200,0x303236,x,.05,0);

 box(1,.12,200,0xaaaaaa,x-6,.07,0);
 box(1,.12,200,0xaaaaaa,x+6,.07,0);
}


for(let z=-100;z<=100;z+=40){

 box(200,.1,12,0x303236,0,.05,z);

 box(200,.12,1,0xaaaaaa,0,.07,z-6);
 box(200,.12,1,0xaaaaaa,0,.07,z+6);
}


/* BUILDINGS */

let seed=9;

function rnd(){

 seed=(seed*9301+49297)%233280;

 return seed/233280;
}


for(let x=-80;x<=80;x+=40){

 for(let z=-80;z<=80;z+=40){

  if(Math.abs(x)<20&&Math.abs(z)<20)
   continue;

  for(let a of[-12,12]){

   for(let b of[-12,12]){

    let h=8+rnd()*18;

    box(
     11,
     h,
     11,
     [
      0x70777d,
      0x8a7567,
      0x526878,
      0x806d80
     ][Math.floor(rnd()*4)],
     x+a,
     h/2,
     z+b
    );
   }
  }
 }
}


/* TREES */

function tree(x,z){

 box(.8,4,.8,0x654321,x,2,z);

 let c=new THREE.Mesh(
  new THREE.SphereGeometry(3,8,8),
  new THREE.MeshStandardMaterial({
   color:0x246b32
  })
 );

 c.position.set(x,6,z);

 scene.add(c);
}


for(let i=0;i<30;i++){

 tree(
  (rnd()-.5)*180,
  (rnd()-.5)*180
 );
}


/* PLAYER */

const player=new THREE.Group();

box(
 1.4,2,.8,
 0x222222,
 0,2.1,0,
 player
);

let head=new THREE.Mesh(
 new THREE.SphereGeometry(.55,12,10),
 new THREE.MeshStandardMaterial({
  color:0xc98b63
 })
);

head.position.y=3.6;
player.add(head);

box(.45,1.8,.55,0x1d3550,-.4,.8,0,player);
box(.45,1.8,.55,0x1d3550,.4,.8,0,player);

box(.4,1.6,.5,0xc98b63,-.9,2.1,0,player);
box(.4,1.6,.5,0xc98b63,.9,2.1,0,player);

const gun=box(
 .25,.25,1.2,
 0x111111,
 .75,2.2,-.65,
 player
);

player.position.set(0,0,10);
scene.add(player);


/* WEAPONS */

const weapons=[

 {
  name:"PISTOL",
  damage:50,
  ammo:30,
  max:30,
  price:0,
  color:0x111111
 },

 {
  name:"RIFLE",
  damage:85,
  ammo:60,
  max:60,
  price:1000,
  color:0x444444
 },

 {
  name:"SMG",
  damage:35,
  ammo:100,
  max:100,
  price:1500,
  color:0x222222
 }

];

let weapon=0;


function updateWeapon(){

 let w=weapons[weapon];

 gun.material.color.set(w.color);

 document.getElementById("weapon")
 .textContent=w.name;

 document.getElementById("ammo")
 .textContent=w.ammo;
}


/* ARRAYS */

let cars=[];
let traffic=[];
let police=[];
let enemies=[];
let peds=[];
let helis=[];


/* CARS */

function car(
 x,z,c,r=0,
 trafficCar=false,
 pol=false
){

 let g=new THREE.Group();

 g.position.set(x,0,z);
 g.rotation.y=r;

 g.userData.speed=0;
 g.userData.used=false;
 g.userData.traffic=trafficCar;
 g.userData.police=pol;

 box(
  4.3,1.1,7,
  pol?0xffffff:c,
  0,1,0,
  g
 );

 box(
  3.1,1,3,
  0x20252b,
  0,1.8,0,
  g
 );

 let wg=new THREE.CylinderGeometry(
  .7,.7,.45,10
 );

 for(let a of[-2.1,2.1]){

  for(let b of[-2.2,2.2]){

   let w=new THREE.Mesh(
    wg,
    new THREE.MeshStandardMaterial({
     color:0x111111
    })
   );

   w.rotation.z=Math.PI/2;
   w.position.set(a,.7,b);

   g.add(w);
  }
 }

 if(pol){

  box(.7,.25,1,0xff0000,-.5,2.5,0,g);
  box(.7,.25,1,0x0000ff,.5,2.5,0,g);
 }

 scene.add(g);

 if(trafficCar)
  traffic.push(g);
 else
  cars.push(g);

 return g;
}


/* PLAYER CARS */

car(18,8,0xc63333,Math.PI/2);
car(-20,-30,0x2865c9,Math.PI/2);
car(45,45,0xd3a527);
car(-50,20,0xffffff,Math.PI/2);


/* TRAFFIC */

for(let i=0;i<10;i++){

 let h=i%2===0;
 let r=Math.floor(
  Math.random()*5-2
 )*40;

 let c=car(
  h?(Math.random()-.5)*180:r,
  h?r:(Math.random()-.5)*180,
  [
   0xff3333,
   0x3366ff,
   0xffff33,
   0xffffff,
   0x33aa66
  ][i%5],
  h?Math.PI/2:0,
  true
 );

 c.userData.speed=.04+Math.random()*.04;
}


/* PEDESTRIANS */

for(let i=0;i<22;i++){

 let p=new THREE.Group();

 p.position.set(
  (Math.random()-.5)*170,
  0,
  (Math.random()-.5)*170
 );

 box(
  .8,1.7,.6,
  [
   0xff5555,
   0x5555ff,
   0xffff55,
   0xffffff,
   0x55cc88
  ][i%5],
  0,1.7,0,
  p
 );

 let h=new THREE.Mesh(
  new THREE.SphereGeometry(.38,8,8),
  new THREE.MeshStandardMaterial({
   color:0xc98b63
  })
 );

 h.position.y=2.8;

 p.add(h);

 p.userData.dx=(Math.random()-.5)*.025;
 p.userData.dz=(Math.random()-.5)*.025;

 scene.add(p);
 peds.push(p);
}


/* ENEMIES */

function enemy(x,z){

 let e=new THREE.Group();

 e.position.set(x,0,z);

 box(
  1.3,2,.8,
  0x741515,
  0,2,0,
  e
 );

 let h=new THREE.Mesh(
  new THREE.SphereGeometry(.55,10,8),
  new THREE.MeshStandardMaterial({
   color:0xb87955
  })
 );

 h.position.y=3.5;

 e.add(h);

 e.userData.hp=100;
 e.userData.cool=0;
 e.userData.root=true;

 scene.add(e);
 enemies.push(e);
}

enemy(35,15);
enemy(-35,-10);
enemy(55,-35);
enemy(-55,45);
enemy(65,65);


/* SPECIAL BUILDINGS */

function building(x,z,c){

 let g=new THREE.Group();

 g.position.set(x,0,z);

 box(
  11,7,11,
  c,
  0,3.5,0,
  g
 );

 box(
  8,1,.3,
  0xffffff,
  0,7.5,5.6,
  g
 );

 scene.add(g);

 return g;
}

const shop=building(60,60,0x7b2cbf);
const garage=building(-60,60,0x1565c0);
const hospital=building(60,-60,0xeeeeee);
const station=building(-60,-60,0x333333);


/* MISSION MARKER */

function mkMarker(x,z,c){

 let m=new THREE.Mesh(
  new THREE.CylinderGeometry(3,3,.3,20),
  new THREE.MeshStandardMaterial({
   color:c
  })
 );

 m.position.set(x,.2,z);

 scene.add(m);

 return m;
}

const marker=
 mkMarker(20,20,0x0088ff);


/* GAME STATE */

let hp=100;
let money=1000;
let wanted=0;

let driving=false;
let currentCar=null;

let joyX=0;
let joyY=0;

let cam=0;

let vy=0;
let onGround=true;

let running=false;
let gas=false;
let brake=false;

let keys={};

let mission=0;
let kills=0;

let time=8;


/* MISSIONS */

const missions=[
 "Reach the blue marker",
 "Steal a car",
 "Defeat 3 enemies",
 "Lose the police",
 "Visit the weapon shop",
 "Visit the garage",
 "Visit the hospital",
 "Visit the police station"
];

const targets=[
 [20,20,0x0088ff],
 [20,20,0x0088ff],
 [20,20,0x0088ff],
 [20,20,0x0088ff],
 [60,60,0xff00ff],
 [-60,60,0x00aaff],
 [60,-60,0xffffff],
 [-60,-60,0xffff00]
];


function setMarker(){

 let t=targets[mission];

 marker.position.set(
  t[0],.2,t[1]
 );

 marker.material.color.set(t[2]);
}


function complete(){

 money+=500;

 mission++;

 if(mission>=missions.length)
  mission=0;

 kills=0;

 setMarker();

 msg(
  "MISSION COMPLETE<br>+$500"
 );
}


/* WALK */

function walk(){

 if(driving)return;

 let f=-joyY;
 let s=joyX;

 if(keys.w)f=1;
 if(keys.s)f=-1;

 if(keys.a)s=-1;
 if(keys.d)s=1;

 let x=
  Math.sin(cam)*f+
  Math.cos(cam)*s;

 let z=
  Math.cos(cam)*f-
  Math.sin(cam)*s;

 let l=Math.hypot(x,z);

 if(l>1){

  x/=l;
  z/=l;
 }

 let sp=
  (running||keys.shift)?.18:.1;

 player.position.x+=x*sp;
 player.position.z+=z*sp;

 player.position.x=
  Math.max(-150,
  Math.min(150,player.position.x));

 player.position.z=
  Math.max(-150,
  Math.min(150,player.position.z));

 if(l>.1)
  player.rotation.y=Math.atan2(x,z);

 vy-=.012;

 player.position.y+=vy;

 if(player.position.y<=0){

  player.position.y=0;
  vy=0;
  onGround=true;
 }
}


/* CAR ENTER */

function nearCar(){

 let best=null;
 let md=8;

 for(let c of cars){

  if(
   !c.userData.used &&
   d(player,c)<md
  ){

   md=d(player,c);
   best=c;
  }
 }

 return best;
}


function enterCar(){

 let c=nearCar();

 if(!c)return;

 currentCar=c;

 driving=true;

 c.userData.used=true;

 player.visible=false;

 document.getElementById("buttons")
 .style.display="none";

 document.getElementById("drive")
 .style.display="flex";

 wanted=Math.min(5,wanted+1);

 if(mission===1)
  complete();

 msg("CAR STOLEN");
}


function exitCar(){

 if(!currentCar)return;

 let c=currentCar;

 c.userData.used=false;

 player.position.set(
  c.position.x+5,
  0,
  c.position.z
 );

 player.visible=true;

 currentCar=null;
 driving=false;

 document.getElementById("drive")
 .style.display="none";

 document.getElementById("buttons")
 .style.display="flex";
}


/* DRIVING */

function drive(){

 if(!driving)return;

 let c=currentCar;

 let t=0;

 if(gas||keys.w)t=1;
 if(brake||keys.s)t=-1;

 c.userData.speed+=t*.012;

 c.userData.speed*=.985;

 c.userData.speed=
  Math.max(
   -.18,
   Math.min(.42,c.userData.speed)
  );

 let s=joyX;

 if(keys.a)s=-1;
 if(keys.d)s=1;

 if(
  Math.abs(c.userData.speed)>.005
 ){

  c.rotation.y+=
   s*.035*
   Math.sign(c.userData.speed);
 }

 c.position.x+=
  Math.sin(c.rotation.y)*
  c.userData.speed;

 c.position.z+=
  Math.cos(c.rotation.y)*
  c.userData.speed;
}


/* SHOOTING */

const ray=
 new THREE.Raycaster();


function shoot(){

 if(driving)return;

 let w=weapons[weapon];

 if(w.ammo<=0){

  msg("OUT OF AMMO");
  return;
 }

 w.ammo--;

 wanted=Math.min(5,wanted+1);

 ray.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 let hit=
  ray.intersectObjects(
   enemies,
   true
  )[0];

 if(hit){

  let o=hit.object;

  while(
   o.parent &&
   !o.userData.root
  )
   o=o.parent;

  o.userData.hp-=w.damage;

  if(o.userData.hp<=0){

   scene.remove(o);

   let i=enemies.indexOf(o);

   if(i>=0)
    enemies.splice(i,1);

   money+=100;

   kills++;

   if(
    mission===2 &&
    kills>=3
   )
    complete();
  }
 }

 updateWeapon();
}


/* POLICE */

function spawnPolice(){

 if(police.length>=wanted)
  return;

 let a=Math.random()*Math.PI*2;

 let x=
  player.position.x+
  Math.sin(a)*35;

 let z=
  player.position.z+
  Math.cos(a)*35;

 let c=car(
  x,z,
  0xffffff,
  a,
  false,
  true
 );

 police.push(c);
}


function policeAI(){

 if(!wanted){

  police.forEach(
   p=>scene.remove(p)
  );

  police.length=0;

  return;
 }

 while(police.length<wanted)
  spawnPolice();

 for(let c of police){

  let dx=
   player.position.x-c.position.x;

  let dz=
   player.position.z-c.position.z;

  let ang=Math.atan2(dx,dz);

  let dif=Math.atan2(
   Math.sin(ang-c.rotation.y),
   Math.cos(ang-c.rotation.y)
  );

  c.rotation.y+=
   Math.max(
    -.035,
    Math.min(.035,dif)
   );

  c.userData.speed=
   Math.min(
    .32,
    c.userData.speed*.99+.008
   );

  c.position.x+=
   Math.sin(c.rotation.y)*
   c.userData.speed;

  c.position.z+=
   Math.cos(c.rotation.y)*
   c.userData.speed;

  if(
   Math.hypot(dx,dz)<9
  ){

   hp-=.15;

   if(hp<=0){

    hp=100;
    wanted=0;

    player.position.set(
     0,0,10
    );

    msg("BUSTED");
   }
  }
 }
}


/* HELICOPTER */

function heliAI(){

 if(
  wanted>=4 &&
  helis.length===0
 ){

  let h=new THREE.Group();

  h.position.set(
   player.position.x+30,
   28,
   player.position.z+30
  );

  box(
   3,1.2,5,
   0x202020,
   0,0,0,
   h
  );

  let r=new THREE.Mesh(
   new THREE.BoxGeometry(9,.12,.4),
   new THREE.MeshStandardMaterial({
    color:0x111111
   })
  );

  r.position.y=1.4;

  h.add(r);

  h.userData.r=r;

  scene.add(h);

  helis.push(h);
 }

 if(wanted<4){

  helis.forEach(
   h=>scene.remove(h)
  );

  helis=[];
 }

 for(let h of helis){

  h.position.x+=
   (player.position.x-
    h.position.x)*.008;

  h.position.z+=
   (player.position.z-
    h.position.z)*.008;

  h.userData.r.rotation.y+=.4;
 }
}


/* BUILDING USE */

function use(){

 let ds=[
  d(player,shop),
  d(player,garage),
  d(player,hospital),
  d(player,station)
 ];

 let md=Math.min(...ds);

 if(md>13){

  msg("NOTHING HERE");
  return;
 }

 let i=ds.indexOf(md);

 if(i===0){

  let next=weapon+1;

  if(next>=weapons.length){

   msg("ALL WEAPONS OWNED");
   return;
  }

  let w=weapons[next];

  if(money<w.price){

   msg("NEED $"+w.price);
   return;
  }

  money-=w.price;
  weapon=next;

  updateWeapon();

  if(mission===4)
   complete();

  msg(w.name+" PURCHASED");

 }else if(i===1){

  if(!driving){

   msg("ENTER A CAR FIRST");
   return;
  }

  currentCar.userData.speed=0;

  if(mission===5)
   complete();

  msg("CAR REPAIRED");

 }else if(i===2){

  hp=100;

  if(mission===6)
   complete();

  msg("HEALTH RESTORED");

 }else{

  wanted=0;

  if(mission===7)
   complete();

  msg("WANTED CLEARED");
 }
}


/* MISSIONS */

function updateMission(){

 document.getElementById("mission")
 .textContent=
  missions[mission]+
  (
   mission===2
   ?" ("+kills+"/3)"
   :""
  );

 if(
  mission===0 &&
  d(player,marker)<7
 )
  complete();

 if(
  mission===3 &&
  wanted===0
 )
  complete();
}


/* WORLD UPDATE */

function updateWorld(){

 for(let c of traffic){

  if(c.rotation.y===0){

   c.position.z+=c.userData.speed;

   if(c.position.z>150)
    c.position.z=-150;

  }else{

   c.position.x+=c.userData.speed;

   if(c.position.x>150)
    c.position.x=-150;
  }
 }


 for(let p of peds){

  p.position.x+=p.userData.dx;
  p.position.z+=p.userData.dz;

  if(Math.abs(p.position.x)>150)
   p.userData.dx*=-1;

  if(Math.abs(p.position.z)>150)
   p.userData.dz*=-1;
 }


 for(let e of enemies){

  let dd=d(player,e);

  if(dd<30){

   let dx=
    player.position.x-e.position.x;

   let dz=
    player.position.z-e.position.z;

   let l=Math.hypot(dx,dz);

   if(l>5){

    e.position.x+=
     dx/l*.035;

    e.position.z+=
     dz/l*.035;

   }else{

    e.userData.cool--;

    if(e.userData.cool<=0){

     hp-=4;

     e.userData.cool=50;
    }
   }
  }
 }
}


/* WANTED */

let wantedTimer=0;

function wantedUpdate(){

 if(!wanted){

  wantedTimer=0;
  return;
 }

 wantedTimer++;

 let close=
  police.some(
   p=>d(player,p)<35
  );

 if(
  !close &&
  wantedTimer>500
 ){

  wanted--;
  wantedTimer=0;
 }

 if(
  mission===3 &&
  wanted===0
 )
  complete();
}


/* DAY/NIGHT */

function day(){

 time+=.002;

 if(time>=24)
  time=0;

 let light=Math.max(
  0,
  Math.sin(
   (time-6)*Math.PI/12
  )
 );

 sun.intensity=
  .35+light*1.7;

 hemi.intensity=
  .4+light*1.3;

 let r=(25+light*100)/255;
 let g=(45+light*140)/255;
 let b=(65+light*150)/255;

 scene.background.setRGB(
  r,g,b
 );

 scene.fog.color.copy(
  scene.background
 );

 let h=Math.floor(time);

 let m=Math.floor(
  (time-h)*60
 );

 document.getElementById("clock")
 .textContent=
  String(h).padStart(2,"0")+
  ":"+
  String(m).padStart(2,"0");
}


/* SAVE */

function save(){

 localStorage.setItem(
  "oc71",
  JSON.stringify({

   hp,
   money,
   wanted,
   weapon,

   ammo:weapons.map(
    w=>w.ammo
   ),

   mission,
   kills,

   x:player.position.x,
   z:player.position.z,

   time
  })
 );

 msg("GAME SAVED");
}


/* LOAD */

function load(){

 let s=
  localStorage.getItem("oc71");

 if(!s){

  msg("NO SAVE");
  return;
 }

 s=JSON.parse(s);

 hp=s.hp??100;
 money=s.money??1000;
 wanted=s.wanted??0;
 weapon=s.weapon??0;
 mission=s.mission??0;
 kills=s.kills??0;

 player.position.set(
  s.x??0,
  0,
  s.z??10
 );

 time=s.time??8;

 (s.ammo||[]).forEach(
  (a,i)=>{
   if(weapons[i])
    weapons[i].ammo=a;
  }
 );

 setMarker();
 updateWeapon();

 msg("GAME LOADED");
}


/* CAMERA */

function camUpdate(){

 if(driving){

  let c=currentCar;

  camera.position.set(
   c.position.x-
    Math.sin(cam)*10,
   5.5,
   c.position.z-
    Math.cos(cam)*10
  );

  camera.lookAt(
   c.position.x,
   1.3,
   c.position.z
  );

 }else{

  camera.position.set(
   player.position.x-
    Math.sin(cam)*9,
   player.position.y+5.5,
   player.position.z-
    Math.cos(cam)*9
  );

  camera.lookAt(
   player.position.x,
   player.position.y+2,
   player.position.z
  );
 }
}


/* MAP */

const map=
 document.getElementById("map");

const ctx=
 map.getContext("2d");


function drawMap(){

 ctx.clearRect(0,0,120,120);

 ctx.fillStyle="#172017";

 ctx.fillRect(
  0,0,120,120
 );

 ctx.strokeStyle="#555";
 ctx.lineWidth=4;

 for(let x=-100;x<=100;x+=40){

  let p=60+x/3;

  ctx.beginPath();
  ctx.moveTo(p,0);
  ctx.lineTo(p,120);
  ctx.stroke();
 }

 for(let z=-100;z<=100;z+=40){

  let p=60+z/3;

  ctx.beginPath();
  ctx.moveTo(0,p);
  ctx.lineTo(120,p);
  ctx.stroke();
 }

 ctx.fillStyle="#00ffff";

 ctx.beginPath();

 ctx.arc(
  60+player.position.x/3,
  60+player.position.z/3,
  4,
  0,7
 );

 ctx.fill();


 ctx.fillStyle="#ff3333";

 enemies.forEach(e=>{

  ctx.beginPath();

  ctx.arc(
   60+e.position.x/3,
   60+e.position.z/3,
   3,
   0,7
  );

  ctx.fill();
 });


 ctx.fillStyle="#fff";

 police.forEach(p=>{

  ctx.beginPath();

  ctx.arc(
   60+p.position.x/3,
   60+p.position.z/3,
   3,
   0,7
  );

  ctx.fill();
 });


 ctx.fillStyle="#00ff55";

 ctx.beginPath();

 ctx.arc(
  60+marker.position.x/3,
  60+marker.position.z/3,
  4,
  0,7
 );

 ctx.fill();
}


/* UI */

function ui(){

 document.getElementById("hp")
 .textContent=
  Math.max(0,Math.floor(hp));

 document.getElementById("money")
 .textContent=
  Math.floor(money);

 document.getElementById("wanted")
 .textContent=wanted;

 document.getElementById("police")
 .textContent=police.length;

 document.getElementById("heli")
 .textContent=helis.length;

 document.getElementById("enter")
 .style.display=
  !driving&&nearCar()
  ?"block"
  :"none";
}


/* JOYSTICK */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");


function setJoy(x,y){

 let r=
  joy.getBoundingClientRect();

 let dx=
  x-r.left-r.width/2;

 let dy=
  y-r.top-r.height/2;

 let max=43;

 let l=Math.hypot(dx,dy);

 if(l>max){

  dx=dx/l*max;
  dy=dy/l*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
  "translate("+dx+"px,"+dy+"px)";
}


function resetJoy(){

 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";
}


joy.addEventListener(
 "pointerdown",
 e=>{
  joy.setPointerCapture(e.pointerId);
  setJoy(e.clientX,e.clientY);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{
  setJoy(e.clientX,e.clientY);
 }
);

joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);


/* CAMERA TOUCH */

let looking=false;
let lastX=0;

const look=
 document.getElementById("look");


look.addEventListener(
 "pointerdown",
 e=>{
  looking=true;
  lastX=e.clientX;
  look.setPointerCapture(e.pointerId);
 }
);


look.addEventListener(
 "pointermove",
 e=>{

  if(looking){

   cam-=
    (e.clientX-lastX)*.008;

   lastX=e.clientX;
  }
 }
);


look.addEventListener(
 "pointerup",
 ()=>looking=false
);

look.addEventListener(
 "pointercancel",
 ()=>looking=false
);

/* KEYBOARD */

addEventListener(
 "keydown",
 e=>{

  keys[e.key.toLowerCase()]=true;

  if(
   e.key===" " &&
   !driving &&
   onGround
  ){

   vy=.25;
   onGround=false;
  }

  if(
   e.key.toLowerCase()==="e"
  ){

   if(driving)
    exitCar();
   else
    enterCar();
  }

  if(
   e.key.toLowerCase()==="f"
  )
   shoot();

  if(
   e.key.toLowerCase()==="q"
  )
   use();

  if(
   ["1","2","3"].includes(e.key)
  ){

   let n=+e.key-1;

   if(
    n<=weapon &&
    n<weapons.length
   ){

    weapon=n;
    updateWeapon();
   }
  }

  if(
   e.key.toLowerCase()==="p"
  )
   save();
 }
);


addEventListener(
 "keyup",
 e=>{
  keys[e.key.toLowerCase()]=false;
 }
);


/* RESIZE */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);


/* GAME LOOP */

function loop(){

 requestAnimationFrame(loop);

 walk();
 drive();

 updateWorld();

 policeAI();
 heliAI();

 wantedUpdate();

 updateMission();

 day();

 ui();

 updateWeapon();

 camUpdate();

 drawMap();

 renderer.render(
  scene,
  camera
 );
}


setMarker();
updateWeapon();
loop();

</script>
