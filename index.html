<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Open City</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9c8;font-family:Arial;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#loading{position:fixed;inset:0;background:#111;color:white;z-index:99;display:flex;align-items:center;justify-content:center;font-size:20px}
#hud{position:fixed;top:8px;left:8px;z-index:10;background:#0009;color:white;padding:8px;border-radius:10px;font-size:12px}
#hud b{font-size:17px}
#joy{position:fixed;left:15px;bottom:18px;width:125px;height:125px;border:3px solid #fff8;border-radius:50%;background:#0005;z-index:20}
#stick{position:absolute;left:35px;top:35px;width:55px;height:55px;border-radius:50%;background:#fff9}
#buttons{position:fixed;right:10px;bottom:15px;z-index:20;display:flex;gap:8px}
button{width:62px;height:62px;border-radius:50%;border:2px solid #fff8;background:#000b;color:white;font-weight:bold}
#fire{background:#b00000}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:25px;z-index:10}
</style>
</head>

<body>

<div id="loading">LOADING OPEN CITY...</div>

<div id="hud">
<b>OPEN CITY</b><br>
❤️ <span id="hp">100</span>
💵 $<span id="money">500</span><br>
🔫 <span id="ammo">30</span>
<br>MISSION: Reach the blue marker
</div>

<div id="cross">+</div>

<div id="joy"><div id="stick"></div></div>

<div id="buttons">
<button id="fire">FIRE</button>
<button id="run">RUN</button>
<button id="jump">JUMP</button>
</div>

<script>
const script=document.createElement("script");
script.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js";

script.onload=()=>start();
script.onerror=()=>{
document.getElementById("loading").innerHTML=
"THREE.JS FAILED TO LOAD<br><br>Check internet and reload";
};

document.head.appendChild(script);

function start(){

const T=THREE;

/* SCENE */

const scene=new T.Scene();
scene.background=new T.Color(0x78a9c8);
scene.fog=new T.Fog(0x78a9c8,80,350);

const camera=new T.PerspectiveCamera(
65,
innerWidth/innerHeight,
0.1,
600
);

const renderer=new T.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */

scene.add(new T.HemisphereLight(
0xffffff,
0x405040,
1.8
));

const sun=new T.DirectionalLight(
0xffffff,
1.5
);

sun.position.set(100,150,80);
scene.add(sun);

/* MATERIAL */

function mat(c){
return new T.MeshStandardMaterial({
color:c,
roughness:.8
});
}

function box(w,h,d,c,x,y,z,parent=scene){

const m=new T.Mesh(
new T.BoxGeometry(w,h,d),
mat(c)
);

m.position.set(x,y,z);
parent.add(m);

return m;
}

/* GROUND */

const ground=new T.Mesh(
new T.PlaneGeometry(500,500),
mat(0x39783c)
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* ROADS */

for(let p=-160;p<=160;p+=40){

box(13,.1,500,0x292c30,p,.05,0);
box(500,.1,13,0x292c30,0,.05,p);

}

/* BUILDINGS */

let seed=12;

function random(){

seed=(seed*9301+49297)%233280;
return seed/233280;

}

for(let x=-220;x<=220;x+=40){

for(let z=-220;z<=220;z+=40){

if(Math.abs(x)<25&&Math.abs(z)<25)continue;

if(random()<.72){

let w=14+random()*8;
let d=14+random()*8;
let h=12+random()*30;

let colors=[
0x646b72,
0x806d60,
0x52677a,
0x765d73
];

box(
w,h,d,
colors[Math.floor(random()*4)],
x+(random()-.5)*8,
h/2,
z+(random()-.5)*8
);

}

}

}

/* BLUE MISSION */

const marker=new T.Mesh(
new T.CylinderGeometry(4,4,.25,20),
new T.MeshBasicMaterial({color:0x008cff})
);

marker.position.set(55,.2,55);
scene.add(marker);

/* HUMAN */

function human(shirt=0x2459a6,skin=0xc98b63){

const g=new T.Group();

const S=mat(skin);
const C=mat(shirt);
const P=mat(0x202532);
const B=mat(0x111111);

/* body */

box(1.4,1.7,.75,shirt,0,2.5,0,g);

/* head */

const head=new T.Mesh(
new T.SphereGeometry(.55,12,10),
S
);

head.position.y=4;
g.add(head);

/* hair */

const hair=new T.Mesh(
new T.SphereGeometry(.57,10,8,0,6.28,0,1.6),
mat(0x151515)
);

hair.position.y=4.15;
g.add(hair);

/* arms */

let la=box(.35,1.55,.35,shirt,-.9,2.4,0,g);
let ra=box(.35,1.55,.35,shirt,.9,2.4,0,g);

/* legs */

let ll=box(.43,1.9,.43,0x202532,-.42,.9,0,g);
let rl=box(.43,1.9,.43,0x202532,.42,.9,0,g);

/* shoes */

box(.45,.3,.8,0x111111,-.42,-.15,-.15,g);
box(.45,.3,.8,0x111111,.42,-.15,-.15,g);

g.userData={
leftArm:la,
rightArm:ra,
leftLeg:ll,
rightLeg:rl,
time:Math.random()*10,
moving:false
};

return g;
}

/* PLAYER */

const player=human();
player.position.set(0,0,10);
scene.add(player);

/* PEOPLE */

const people=[];

for(let i=0;i<15;i++){

let p=human(
[0xb73535,0x315ca8,0x2d8247,0xb47a25][i%4],
[0xc98b63,0xb87955,0x9a654b][i%3]
);

p.position.set(
(Math.random()-.5)*400,
0,
(Math.random()-.5)*400
);

p.userData.dx=Math.random()-.5;
p.userData.dz=Math.random()-.5;

scene.add(p);
people.push(p);

}

/* CARS */

const cars=[];

function car(x,z,color){

const g=new T.Group();

g.position.set(x,0,z);

box(4.5,1.1,7,color,0,1,0,g);
box(3.2,1,3,0x20252a,0,1.8,.2,g);

for(let x of [-2.1,2.1]){

for(let z of [-2.2,2.2]){

const w=new T.Mesh(
new T.CylinderGeometry(.7,.7,.45,10),
mat(0x111111)
);

w.rotation.z=Math.PI/2;
w.position.set(x,.65,z);
g.add(w);

}

}

scene.add(g);
cars.push(g);

}

car(20,5,0xd52e2e);
car(-30,-25,0x2865c9);
car(55,40,0xd4a727);
car(-60,25,0xffffff);

/* INPUT */

let joyX=0;
let joyY=0;
let running=false;
let jumpY=0;
let camAngle=0;

/* JOYSTICK */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function joystick(x,y){

const r=joy.getBoundingClientRect();

let dx=x-r.left-r.width/2;
let dy=y-r.top-r.height/2;

let len=Math.hypot(dx,dy);
let max=43;

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

joyX=dx/max;
joyY=dy/max;

stick.style.transform=
`translate(${dx}px,${dy}px)`;

}

function resetJoy(){

joyX=0;
joyY=0;

stick.style.transform="translate(0,0)";

}

joy.onpointerdown=e=>{
joy.setPointerCapture(e.pointerId);
joystick(e.clientX,e.clientY);
};

joy.onpointermove=e=>{
joystick(e.clientX,e.clientY);
};

joy.onpointerup=resetJoy;
joy.onpointercancel=resetJoy;

/* RUN */

document.getElementById("run").onpointerdown=()=>{
running=true;
};

document.getElementById("run").onpointerup=()=>{
running=false;
};

document.getElementById("jump").onpointerdown=()=>{

if(jumpY<=0)jumpY=5;

};

/* SHOOT */

let ammo=30;

document.getElementById("fire").onpointerdown=()=>{

if(ammo<=0)return;

ammo--;
document.getElementById("ammo").textContent=ammo;

};

/* LOOK */

const look=document.createElement("div");

look.style.cssText=
"position:fixed;right:0;top:0;width:55%;height:70%;z-index:5";

document.body.appendChild(look);

let looking=false;
let lastX=0;

look.onpointerdown=e=>{
looking=true;
lastX=e.clientX;
look.setPointerCapture(e.pointerId);
};

look.onpointermove=e=>{

if(!looking)return;

camAngle-=(e.clientX-lastX)*.008;
lastX=e.clientX;

};

look.onpointerup=()=>{
looking=false;
};

look.onpointercancel=()=>{
looking=false;
};

/* ANIMATION */

function animateHuman(p,dt){

const u=p.userData;

u.time+=dt*(u.moving?10:2);

let s=Math.sin(u.time);
let a=u.moving?.55:0;

u.leftLeg.rotation.x=s*a;
u.rightLeg.rotation.x=-s*a;

u.leftArm.rotation.x=-s*a;
u.rightArm.rotation.x=s*a;

}

/* GAME LOOP */

let last=performance.now();

function loop(now){

requestAnimationFrame(loop);

let dt=Math.min(
(now-last)/1000,
.05
);

last=now;

/* movement */

let f=-joyY;
let s=joyX;

let len=Math.hypot(f,s);

if(len>1){

f/=len;
s/=len;

}

let speed=running?8:4;

let dx=
Math.sin(camAngle)*f+
Math.cos(camAngle)*s;

let dz=
Math.cos(camAngle)*f-
Math.sin(camAngle)*s;

if(Math.abs(dx)+Math.abs(dz)>.05){

player.position.x+=dx*speed*dt;
player.position.z+=dz*speed*dt;

player.rotation.y=Math.atan2(dx,dz);

player.userData.moving=true;

}else{

player.userData.moving=false;

}

/* jump */

if(jumpY>0){

jumpY-=12*dt;
player.position.y+=jumpY*dt;

if(player.position.y<0){

player.position.y=0;
jumpY=0;

}

}

/* limits */

player.position.x=Math.max(-240,Math.min(240,player.position.x));
player.position.z=Math.max(-240,Math.min(240,player.position.z));

/* people */

people.forEach(p=>{

let dx=p.position.x-player.position.x;
let dz=p.position.z-player.position.z;
let d=Math.hypot(dx,dz);

if(d<12){

let l=Math.max(.1,d);

p.userData.dx=dx/l;
p.userData.dz=dz/l;
p.userData.moving=true;

}else{

p.userData.moving=true;

}

p.position.x+=p.userData.dx*dt;
p.position.z+=p.userData.dz*dt;

p.rotation.y=Math.atan2(
p.userData.dx,
p.userData.dz
);

animateHuman(p,dt);

});

/* player animation */

animateHuman(player,dt);

/* camera */

const distance=9;

camera.position.set(
player.position.x-Math.sin(camAngle)*distance,
player.position.y+5.2,
player.position.z-Math.cos(camAngle)*distance
);

camera.lookAt(
player.position.x,
player.position.y+2,
player.position.z
);

/* marker */

marker.rotation.y+=dt*2;

/* render */

renderer.render(scene,camera);

}

document.getElementById("loading").style.display="none";

requestAnimationFrame(loop);

/* resize */

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

}
</script>

</body>
  </html>
