<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V7</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#111;
 font-family:Arial;
 touch-action:none
}
#game{position:fixed;inset:0}

#hud{
 position:fixed;
 top:8px;
 left:8px;
 z-index:10;
 color:white;
 background:#0009;
 padding:8px;
 border-radius:10px;
 font-size:13px
}

#mission{
 position:fixed;
 top:8px;
 left:50%;
 transform:translateX(-50%);
 z-index:10;
 color:white;
 background:#0009;
 padding:8px 12px;
 border-radius:10px;
 text-align:center
}

#map{
 position:fixed;
 right:8px;
 top:8px;
 width:120px;
 height:120px;
 z-index:10;
 border:2px solid white;
 border-radius:10px
}

button{
 border:0;
 border-radius:14px;
 background:#111c;
 color:white;
 font-weight:bold;
 width:70px;
 height:48px
}

#buttons{
 position:fixed;
 right:8px;
 bottom:10px;
 z-index:20;
 display:grid;
 grid-template-columns:repeat(2,70px);
 gap:7px
}

#drive{
 display:none;
 position:fixed;
 right:8px;
 bottom:10px;
 z-index:20;
 grid-template-columns:repeat(2,78px);
 gap:7px
}

#drive button{width:78px;height:55px}

#joy{
 position:fixed;
 left:18px;
 bottom:18px;
 width:135px;
 height:135px;
 z-index:20;
 border-radius:50%;
 background:#fff2;
 border:2px solid #fff4
}

#stick{
 position:absolute;
 left:39px;
 top:39px;
 width:54px;
 height:54px;
 border-radius:50%;
 background:#fff6
}

#look{
 position:fixed;
 right:0;
 top:0;
 width:55%;
 height:60%;
 z-index:5
}

#msg{
 display:none;
 position:fixed;
 bottom:160px;
 left:50%;
 transform:translateX(-50%);
 z-index:30;
 color:white;
 background:#000c;
 padding:9px 14px;
 border-radius:10px
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
❤️ <span id="hp">100</span>
💰 $<span id="money">500</span>
⭐ <span id="wanted">0</span>
🔫 <span id="ammo">30</span>
<div id="carHUD" style="display:none">
🚗 <span id="carName">Car</span>
❤️ <span id="carHP">100</span>
⚡ <span id="speed">0</span>
</div>
</div>

<div id="mission">Mission 1: Find the garage</div>

<canvas id="map" width="120" height="120"></canvas>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="look"></div>

<div id="buttons">
 <button id="fire">FIRE</button>
 <button id="enter">ENTER</button>
 <button id="jump">JUMP</button>
 <button id="run">RUN</button>
 <button id="weapon">WEAPON</button>
 <button id="save">SAVE</button>
 <button id="load">LOAD</button>
</div>

<div id="drive">
 <button id="gas">GAS ▲</button>
 <button id="brake">BRAKE ▼</button>
 <button id="exit">EXIT</button>
 <button id="repair">REPAIR</button>
</div>

<div id="msg"></div>

<!-- LOCAL THREE.JS -->
<script src="./three.min.js"></script>

<script>

if(typeof THREE==="undefined"){
 document.body.innerHTML=
 "<h1 style='color:red;padding:20px'>"+
 "three.min.js was not found.<br><br>"+
 "Make sure index.html and three.min.js are in the same GitHub folder."+
 "</h1>";
 throw new Error("three.min.js missing");
}

/* =========================
   SETUP
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x80b5df);
scene.fog=new THREE.Fog(0x80b5df,80,400);

const camera=new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 600
);

const renderer=new THREE.WebGLRenderer({
 antialias:false
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio||1,1.5)
);

renderer.setSize(innerWidth,innerHeight);

document.getElementById("game")
.appendChild(renderer.domElement);

const clock=new THREE.Clock();

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x405040,
  1.5
 )
);

const sun=new THREE.DirectionalLight(
  0xffffff,
  1.2
);

sun.position.set(100,150,80);
scene.add(sun);

/* =========================
   HELPERS
========================= */

function material(c){
 return new THREE.MeshLambertMaterial({
  color:c
 });
}

function cube(x,y,z,c){
 return new THREE.Mesh(
  new THREE.BoxGeometry(x,y,z),
  material(c)
 );
}

function cylinder(r,h,c){
 return new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,10),
  material(c)
 );
}

function distance(a,b){
 return Math.hypot(
  a.x-b.x,
  a.z-b.z
 );
}

function message(t){
 const m=document.getElementById("msg");
 m.textContent=t;
 m.style.display="block";

 clearTimeout(message.timer);

 message.timer=setTimeout(()=>{
  m.style.display="none";
 },1800);
}

/* =========================
   WORLD
========================= */

const ground=cube(
 500,.3,500,
 0x477447
);

ground.position.y=-.15;
scene.add(ground);

function road(x,z,w,d){

 const r=cube(
  w,.08,d,
  0x292929
 );

 r.position.set(x,.04,z);

 scene.add(r);
}

road(0,0,32,500);
road(0,0,500,32);
road(0,100,500,18);
road(0,-100,500,18);
road(100,0,18,500);
road(-100,0,18,500);

/* Buildings */

for(let x=-220;x<=220;x+=45){

 for(let z=-220;z<=220;z+=45){

  if(Math.abs(x)<25 ||
     Math.abs(z)<25)continue;

  if(Math.random()<.75){

   const w=22+Math.random()*12;
   const d=22+Math.random()*12;
   const h=12+Math.random()*40;

   const b=cube(
    w,h,d,
    0x555555+
    Math.floor(Math.random()*0x333333)
   );

   b.position.set(
    x+Math.random()*8-4,
    h/2,
    z+Math.random()*8-4
   );

   scene.add(b);
  }
 }
}

/* Trees */

function tree(x,z){

 const g=new THREE.Group();

 const trunk=cylinder(
  1,6,0x704628
 );

 trunk.position.y=3;

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(4.5,8,6),
  material(0x26732e)
 );

 leaves.position.y=7;

 g.add(trunk);
 g.add(leaves);

 g.position.set(x,0,z);

 scene.add(g);
}

for(let i=0;i<70;i++){

 const x=Math.random()*440-220;
 const z=Math.random()*440-220;

 if(Math.abs(x)<25 ||
    Math.abs(z)<25)continue;

 tree(x,z);
}

/* =========================
   PLAYER
========================= */

const player=new THREE.Group();

const playerBody=cube(
 1.5,2.2,1,
 0x2455b8
);

playerBody.position.y=2.1;

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.65,10,8),
 material(0xd39b72)
);

head.position.y=3.65;

const leg1=cube(.5,1.5,.55,0x202020);
const leg2=cube(.5,1.5,.55,0x202020);

leg1.position.set(-.4,.75,0);
leg2.position.set(.4,.75,0);

const gun=cube(
 .25,.25,1.8,
 0x111111
);

gun.position.set(
 .9,2.25,-.8
);

gun.rotation.x=Math.PI/2;

player.add(
 playerBody,
 head,
 leg1,
 leg2,
 gun
);

player.position.set(0,0,55);

scene.add(player);

/* =========================
   CARS
========================= */

const cars=[];
const traffic=[];
const police=[];

const carTypes=[
 {
  name:"Sport",
  color:0xd72b2b,
  max:190,
  acceleration:100
 },
 {
  name:"SUV",
  color:0x444444,
  max:125,
  acceleration:70
 },
 {
  name:"Taxi",
  color:0xe0c52c,
  max:140,
  acceleration:80
 },
 {
  name:"Super",
  color:0x276ed1,
  max:210,
  acceleration:115
 }
];

function makeCar(
 x,z,type=0,policeCar=false
){

 const t=carTypes[type];

 const g=new THREE.Group();

 const body=cube(
  2.6,.85,4.6,
  policeCar?0xffffff:t.color
 );

 body.position.y=1;

 const roof=cube(
  2,.65,2.2,
  0x222222
 );

 roof.position.y=1.65;

 g.add(body,roof);

 for(const sx of [-1,1]){

  for(const sz of [-1,1]){

   const wheel=cylinder(
    .55,.35,0x111111
   );

   wheel.rotation.z=Math.PI/2;

   wheel.position.set(
    sx*1.35,
    .55,
    sz*1.55
   );

   g.add(wheel);
  }
 }

 if(policeCar){

  const siren=cube(
   .8,.25,.35,
   0xff2222
  );

  siren.position.y=2.1;

  g.add(siren);
 }

 g.position.set(x,0,z);

 g.userData={
  name:t.name,
  max:t.max,
  acceleration:t.acceleration,
  health:100,
  speed:0,
  police:policeCar
 };

 scene.add(g);

 return g;
}

/* parked */

for(let i=0;i<18;i++){

 const type=i%4;

 const c=makeCar(
  Math.random()*400-200,
  Math.random()*400-200,
  type
 );

 c.rotation.y=
  Math.random()*Math.PI*2;

 cars.push(c);
}

/* traffic */

for(let i=0;i<10;i++){

 const horizontal=i%2===0;

 const c=makeCar(
  horizontal?
   Math.random()*400-200:
   (i%3)*100-100,

  horizontal?
   (i%3)*100-100:
   Math.random()*400-200,

  i%4
 );

 c.userData.speed=
  20+Math.random()*30;

 c.userData.traffic=true;

 c.rotation.y=
  horizontal?
   0:
   Math.PI/2;

 traffic.push(c);
}

/* =========================
   GARAGE
========================= */

const garage=cube(
 18,4,18,
 0x315d89
);

garage.position.set(
 -60,2,60
);

scene.add(garage);

const garageMarker=cube(
 12,.2,12,
 0xffcc00
);

garageMarker.position.set(
 -60,4.1,60
);

scene.add(garageMarker);

/* =========================
   ENEMIES
========================= */

const enemies=[];

function makeEnemy(x,z){

 const e=new THREE.Group();

 const body=cube(
  .9,1.9,.7,
  0x771d1d
 );

 body.position.y=1.5;

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(
   .4,8,6
  ),
  material(0xa96f52)
 );

 h.position.y=2.8;

 e.add(body,h);

 e.position.set(x,0,z);

 e.userData={
  hp:100,
  dead:false
 };

 scene.add(e);
 enemies.push(e);
}

makeEnemy(40,40);
makeEnemy(-40,30);
makeEnemy(60,-50);
makeEnemy(-60,-60);
makeEnemy(110,70);

/* =========================
   GAME STATE
========================= */

let hp=100;
let money=500;
let ammo=30;
let wanted=0;
let weapon=1;

let inCar=false;
let car=null;

let yaw=0;
let pitch=.2;

let joyX=0;
let joyY=0;

let gas=false;
let brake=false;
let running=false;
let firing=false;

let mission=0;

const keys={};

/* =========================
   ENTER CAR
========================= */

function nearestCar(){

 let best=null;
 let bestDistance=5;

 for(const c of cars){

  if(c.userData.dead)continue;

  const d=
   distance(player.position,c.position);

  if(d<bestDistance){

   best=c;
   bestDistance=d;
  }
 }

 return best;
}

function enterCar(){

 if(inCar)return;

 const c=nearestCar();

 if(!c){

  message("No car nearby");
  return;
 }

 car=c;
 inCar=true;

 player.visible=false;

 document.getElementById(
  "buttons"
 ).style.display="none";

 document.getElementById(
  "drive"
 ).style.display="grid";

 document.getElementById(
  "carHUD"
 ).style.display="block";

 message("Entered "+c.userData.name);
}

function exitCar(){

 if(!inCar)return;

 player.visible=true;

 player.position.copy(car.position);

 player.position.x+=3;

 inCar=false;

 car=null;

 document.getElementById(
  "buttons"
 ).style.display="grid";

 document.getElementById(
  "drive"
 ).style.display="none";

 document.getElementById(
  "carHUD"
 ).style.display="none";
}

/* =========================
   SHOOT
========================= */

function shoot(){

 if(inCar)return;

 if(ammo<=0){

  message("Out of ammo");
  return;
 }

 ammo--;

 const dir=new THREE.Vector3(
  Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 let hit=null;
 let best=60;

 for(const e of enemies){

  if(e.userData.dead)continue;

  const dx=
   e.position.x-player.position.x;

  const dz=
   e.position.z-player.position.z;

  const d=Math.hypot(dx,dz);

  if(d>best)continue;

  const dot=
   (dx*dir.x+dz*dir.z)/
   Math.max(d,.01);

  if(dot>.94){

   hit=e;
   best=d;
  }
 }

 if(hit){

  hit.userData.hp-=
   weapon===1?35:60;

  wanted=
   Math.min(5,wanted+1);

  if(hit.userData.hp<=0){

   hit.userData.dead=true;
   hit.visible=false;

   money+=100;

   message("+$100");
  }
 }
}

/* =========================
   EXPLODE CAR
========================= */

function explodeCar(c){

 if(!c||c.userData.dead)return;

 c.userData.dead=true;
 c.visible=false;

 const fire=new THREE.Mesh(
  new THREE.SphereGeometry(
   2.5,8,8
  ),
  material(0xff5500)
 );

 fire.position.copy(c.position);
 fire.position.y=2;

 scene.add(fire);

 setTimeout(()=>{
  scene.remove(fire);
 },700);

 message("CAR DESTROYED!");

 if(distance(
  player.position,
  c.position
 )<8){

  hp-=35;
 }
}

/* =========================
   DRIVING
========================= */

function drive(dt){

 if(!inCar||!car)return;

 const u=car.userData;

 let steer=joyX;

 if(keys.a)steer=-1;
 if(keys.d)steer=1;

 if(gas){

  u.speed+=
   u.acceleration*dt;
 }

 if(brake){

  u.speed-=
   u.acceleration*1.4*dt;
 }

 if(!gas&&!brake){

  u.speed*=.96;
 }

 u.speed=
  THREE.MathUtils.clamp(
   u.speed,
   -35,
   u.max
  );

 car.rotation.y+=
  steer*.045*
  Math.max(1,Math.abs(u.speed))*dt;

 car.position.x+=
  Math.sin(car.rotation.y)*
  u.speed*dt;

 car.position.z+=
  Math.cos(car.rotation.y)*
  u.speed*dt;

 car.position.x=
  THREE.MathUtils.clamp(
   car.position.x,
   -245,245
  );

 car.position.z=
  THREE.MathUtils.clamp(
   car.position.z,
   -245,245
  );

 /* collision */

 for(const other of [
  ...cars,
  ...traffic
 ]){

  if(other===car)continue;

  if(distance(
   car.position,
   other.position
  )<3){

   u.health-=
    Math.abs(u.speed)*.03;

   u.speed*=.5;

   if(u.health<=0){

    explodeCar(car);
    exitCar();

    return;
   }
  }
 }
}

/* =========================
   PLAYER
========================= */

function move(dt){

 if(inCar)return;

 let x=joyX;
 let y=joyY;

 if(keys.w)y=-1;
 if(keys.s)y=1;
 if(keys.a)x=-1;
 if(keys.d)x=1;

 const speed=
  running?10:6;

 const forward=new THREE.Vector3(
  Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),
  0,
  Math.sin(yaw)
 );

 player.position.addScaledVector(
  forward,
  -y*speed*dt
 );

 player.position.addScaledVector(
  right,
  x*speed*dt
 );
}

/* =========================
   TRAFFIC
========================= */

function updateTraffic(dt){

 for(const c of traffic){

  c.position.x+=
   Math.sin(c.rotation.y)*
   c.userData.speed*dt;

  c.position.z+=
   Math.cos(c.rotation.y)*
   c.userData.speed*dt;

  if(c.position.x>250)
   c.position.x=-250;

  if(c.position.x<-250)
   c.position.x=250;

  if(c.position.z>250)
   c.position.z=-250;

  if(c.position.z<-250)
   c.position.z=250;
 }
}

/* =========================
   POLICE
========================= */

let policeTimer=0;

function createPolice(){

 if(wanted<=0)return;
 if(police.length>=3)return;

 const a=Math.random()*
   Math.PI*2;

 const r=35+
   Math.random()*25;

 const p=makeCar(
  player.position.x+
   Math.cos(a)*r,

  player.position.z+
   Math.sin(a)*r,

  0,
  true
 );

 police.push(p);
}

function updatePolice(dt){

 if(wanted<=0)return;

 policeTimer-=dt;

 if(policeTimer<=0){

  createPolice();
  policeTimer=5;
 }

 for(const p of police){

  const dx=
   player.position.x-
   p.position.x;

  const dz=
   player.position.z-
   p.position.z;

  const target=
   Math.atan2(dx,dz);

  let diff=
   target-p.rotation.y;

  while(diff>Math.PI)
   diff-=Math.PI*2;

  while(diff<-Math.PI)
   diff+=Math.PI*2;

  p.rotation.y+=
   Math.sign(diff)*.02;

  p.userData.speed=
   Math.min(
    75,
    p.userData.speed+30*dt
   );

  p.position.x+=
   Math.sin(p.rotation.y)*
   p.userData.speed*dt;

  p.position.z+=
   Math.cos(p.rotation.y)*
   p.userData.speed*dt;

  if(distance(
   p.position,
   player.position
  )<4){

   hp-=10*dt;
  }
 }
}

/* =========================
   MISSIONS
========================= */

function updateMission(){

 const m=
  document.getElementById("mission");

 if(mission===0){

  m.textContent=
   "Mission 1: Find the yellow garage";

  if(distance(
   player.position,
   garage.position
  )<20){

   mission=1;
   money+=150;

   message(
    "Mission complete +$150"
   );
  }

 }else if(mission===1){

  m.textContent=
   "Mission 2: Steal a car";

  if(inCar){

   mission=2;
   money+=200;

   message(
    "Mission complete +$200"
   );
  }

 }else if(mission===2){

  m.textContent=
   "Mission 3: Get 2 wanted stars";

  if(wanted>=2){

   mission=3;
   money+=250;

   message(
    "Mission complete +$250"
   );
  }

 }else if(mission===3){

  m.textContent=
   "Mission 4: Destroy an enemy";

  if(enemies.some(
   e=>e.userData.dead
  )){

   mission=4;
   money+=300;

   message(
    "Mission complete +$300"
   );
  }

 }else{

  m.textContent=
   "Mission 5: Repair your car";

  if(
   inCar &&
   car &&
   distance(
    car.position,
    garage.position
   )<20 &&
   car.userData.health===100
  ){

   mission=5;
   money+=500;

   message(
    "🏆 ALL MISSIONS COMPLETE!"
   );

   m.textContent=
    "🏆 CITY BOSS COMPLETE";
  }
 }
}

/* =========================
   REPAIR
========================= */

function repair(){

 if(!inCar||!car)return;

 if(distance(
  car.position,
  garage.position
 )>20){

  message("Go to the garage");
  return;
 }

 if(wanted){

  message("Lose the police first");
  return;
 }

 if(money<100){

  message("Need $100");
  return;
 }

 money-=100;
 car.userData.health=100;

 message("Car repaired");
}

/* =========================
   SAVE
========================= */

function save(){

 localStorage.setItem(
  "OPEN_CITY_V7",
  JSON.stringify({
   x:player.position.x,
   z:player.position.z,
   hp,
   money,
   ammo,
   wanted,
   mission,
   weapon
  })
 );

 message("Game saved");
}

function load(){

 const raw=
  localStorage.getItem(
   "OPEN_CITY_V7"
  );

 if(!raw){

  message("No save");
  return;
 }

 const d=JSON.parse(raw);

 player.position.x=d.x||0;
 player.position.z=d.z||55;

 hp=d.hp??100;
 money=d.money??500;
 ammo=d.ammo??30;
 wanted=d.wanted??0;
 mission=d.mission??0;
 weapon=d.weapon??1;

 message("Game loaded");
}

/* =========================
   JOYSTICK
========================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

let pointer=null;

function joystick(e){

 const r=
  joy.getBoundingClientRect();

 let x=
  e.clientX-
  (r.left+r.width/2);

 let y=
  e.clientY-
  (r.top+r.height/2);

 const max=48;

 const d=Math.hypot(x,y);

 if(d>max){

  x=x/d*max;
  y=y/d*max;
 }

 joyX=x/max;
 joyY=y/max;

 stick.style.left=
  39+x+"px";

 stick.style.top=
  39+y+"px";
}

joy.addEventListener(
 "pointerdown",
 e=>{

  pointer=e.pointerId;

  joy.setPointerCapture(
   pointer
  );

  joystick(e);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(e.pointerId===pointer)
   joystick(e);
 }
);

function resetJoy(){

 pointer=null;
 joyX=0;
 joyY=0;

 stick.style.left="39px";
 stick.style.top="39px";
}

joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);

/* =========================
   CAMERA LOOK
========================= */

const look=
 document.getElementById("look");

let lookID=null;
let lastX=0;
let lastY=0;

look.addEventListener(
 "pointerdown",
 e=>{

  lookID=e.pointerId;

  lastX=e.clientX;
  lastY=e.clientY;
 }
);

look.addEventListener(
 "pointermove",
 e=>{

  if(e.pointerId!==lookID)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  yaw-=dx*.008;

  pitch+=dy*.004;

  pitch=
   THREE.MathUtils.clamp(
    pitch,-.5,.8
   );
 }
);

look.addEventListener(
 "pointerup",
 ()=>lookID=null
);

/* =========================
   BUTTONS
========================= */

document.getElementById(
 "enter"
).onclick=enterCar;

document.getElementById(
 "exit"
).onclick=exitCar;

document.getElementById(

).onclick=repair;

document.getElementById(

).onclick=save;

document.getElementById(

).onclick=load;

document.getElementById(

).onclick=()=>{

 if(!inCar)
  player.position.y=.8;
};

document.getElementById(
 "weapon"
).onclick=()=>{

 weapon=weapon===1?2:1;

 message(
  weapon===1?
  "PISTOL":
  "RIFLE"
 );
};

function hold(id,on,off){

 const b=
  document.getElementById(id);

 b.addEventListener(
  "pointerdown",
 e=>{
  e.preventDefault();
  on();
 }
 );

 b.addEventListener(
  "pointerup",
 off
 );

 b.addEventListener(
  "pointercancel",
 off
 );
}

hold(
 "fire",
 ()=>firing=true,
 ()=>firing=false
);

hold(
 "gas",
 ()=>gas=true,
 ()=>gas=false
);

hold(
 "brake",
 ()=>brake=true,
 ()=>brake=false
);

hold(
 "run",
 ()=>running=true,
 ()=>running=false
);

/* =========================
   KEYBOARD
========================= */

addEventListener(
 "keydown",
 e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){

   if(inCar)exitCar();
   else enterCar();
  }

  if(e.key.toLowerCase()==="f")
   shoot();
 }
);

addEventListener(
 "keyup",
 e=>{
  keys[e.key.toLowerCase()]=false;
 }
);

/* =========================
   HUD
========================= */

function hud(){

 document.getElementById(
  "hp"
 ).textContent=
  Math.max(0,Math.floor(hp));

 document.getElementById(
  "money"
 ).textContent=
  Math.floor(money);

 document.getElementById(
  "ammo"
 ).textContent=ammo;

 document.getElementById(
  "wanted"
 ).textContent=wanted;

 if(inCar&&car){

  document.getElementById(
   "carName"
  ).textContent=
   car.userData.name;

  document.getElementById(
   "carHP"
  ).textContent=
   Math.max(
    0,
    Math.floor(car.userData.health)
   );

  document.getElementById(
   "speed"
  ).textContent=
   Math.floor(
    Math.abs(car.userData.speed)
   );
 }
}

/* =========================
   CAMERA
========================= */

function cameraUpdate(){

 if(inCar&&car){

  const target=
   car.position.clone();

  target.y+=3;

  const back=
   new THREE.Vector3(
    -Math.sin(car.rotation.y)*9,
    5,
    -Math.cos(car.rotation.y)*9
   );

  camera.position
   .copy(target)
   .add(back);

  camera.lookAt(
   car.position.x,
   1.5,
   car.position.z
  );

 }else{

  const target=
   player.position.clone();

  target.y+=2;

  const back=
   new THREE.Vector3(
    -Math.sin(yaw)*7,
    4,
    Math.cos(yaw)*7
   );

  camera.position
   .copy(target)
   .add(back);

  camera.lookAt(
   player.position.x,
   1.6,
   player.position.z
  );
 }
}

/* =========================
   MINIMAP
========================= */

const map=
 document.getElementById("map");

const ctx=
 map.getContext("2d");

function minimap(){

 ctx.fillStyle="#173817";
 ctx.fillRect(0,0,120,120);

 ctx.fillStyle="#444";

 ctx.fillRect(
  48,0,24,120
 );

 ctx.fillRect(
  0,48,120,24
 );

 function dot(x,z,c,r){

  const px=
   60+x/500*120;

  const py=
   60+z/500*120;

  ctx.fillStyle=c;

  ctx.beginPath();

  ctx.arc(
   px,py,r,
   0,Math.PI*2
  );

  ctx.fill();
 }

 const p=
  inCar&&car?
  car.position:
  player.position;

 dot(
  p.x,p.z,
  "#00ff55",4
 );

 dot(
  garage.position.x,
  garage.position.z,
  "#ffff00",4
 );

 for(const p of police){

  dot(
   p.position.x,
   p.position.z,
   "#ff2222",3
  );
 }
}

/* =========================
   DAY NIGHT
========================= */

let day=0;

function dayNight(dt){

 day+=dt*.01;

 const light=
  (Math.sin(day)+1)/2;

 sun.intensity=
  .4+light*1.2;

}

/* =========================
   GAME LOOP
========================= */

let shootTimer=0;

function loop(){

 requestAnimationFrame(loop);

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 if(firing){

  shootTimer-=dt;

  if(shootTimer<=0){

   shoot();

   shootTimer=
    weapon===1?.35:.15;
  }
 }

 move(dt);
 drive(dt);
 updateTraffic(dt);
 updatePolice(dt);
 updateMission();
 dayNight(dt);

 cameraUpdate();
 hud();
 minimap();

 if(hp<=0){

  hp=100;
  money=
   Math.max(0,money-200);

  player.position.set(
   0,0,55
  );

  wanted=0;

  message(
   "You were knocked out -$200"
  );
 }

 renderer.render(
  scene,
  camera
 );
}

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

message(
 "Welcome to Open City V7"
);

loop();

</script>
