<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OPEN CITY V9</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,sans-serif;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#loading{
  position:fixed;
  inset:0;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#05070a;
  color:white;
  font-size:20px;
}
#loading small{
  margin-top:10px;
  color:#9aa;
  font-size:13px;
}
#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}
#top{
  position:absolute;
  left:10px;
  top:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
#stats{
  background:rgba(0,0,0,.58);
  border-radius:12px;
  padding:9px 12px;
  min-width:150px;
  font-size:13px;
  line-height:1.55;
  backdrop-filter:blur(5px);
}
#mission{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(380px,72%);
  text-align:center;
  background:rgba(0,0,0,.58);
  border-radius:12px;
  padding:9px;
  font-size:13px;
}
#weapon{
  font-weight:bold;
}
#wanted{
  color:#ffd400;
  letter-spacing:2px;
}
#speed{
  color:#7ee7ff;
}
#message{
  position:absolute;
  top:88px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  border-radius:12px;
  padding:10px 15px;
  opacity:0;
  transition:.2s;
  font-weight:bold;
  text-align:center;
}
#minimap{
  position:absolute;
  right:12px;
  bottom:12px;
  width:145px;
  height:145px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  background:rgba(8,14,20,.82);
  overflow:hidden;
}
#mapCanvas{
  width:100%;
  height:100%;
}
#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:20px;
  height:20px;
  transform:translate(-50%,-50%);
}
#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.9);
}
#crosshair:before{
  width:20px;
  height:2px;
  top:9px;
  left:0;
}
#crosshair:after{
  width:2px;
  height:20px;
  top:0;
  left:9px;
}

#joystick{
  position:absolute;
  left:18px;
  bottom:20px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;
}
#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:36px;
  top:36px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.45);
}

.btn{
  pointer-events:auto;
  position:absolute;
  width:64px;
  height:64px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(15,20,28,.72);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  text-align:center;
  touch-action:none;
}
.btn:active{
  background:rgba(80,100,120,.8);
}
#fire{
  right:25px;
  bottom:112px;
  width:78px;
  height:78px;
  background:rgba(170,30,25,.72);
}
#enter{
  right:112px;
  bottom:38px;
}
#use{
  right:25px;
  bottom:38px;
}
#switch{
  right:112px;
  bottom:112px;
}
#brake{
  right:198px;
  bottom:38px;
}
#save{
  left:12px;
  top:150px;
  width:52px;
  height:38px;
  border-radius:10px;
}
#load{
  left:70px;
  top:150px;
  width:52px;
  height:38px;
  border-radius:10px;
}
#help{
  position:absolute;
  left:12px;
  bottom:12px;
  max-width:220px;
  font-size:10px;
  color:#bbc;
}
.hidden{
  display:none!important;
}

@media(min-width:900px){
  #joystick,
  .btn,
  #help{
    opacity:.65;
  }
}
</style>
</head>

<body>

<div id="loading">
  <b>OPEN CITY V9</b>
  <small>Loading 3D city...</small>
</div>

<div id="ui">

  <div id="top">
    <div id="stats">
      ❤️ <span id="health">100</span>
      &nbsp; 💰 $<span id="money">500</span><br>
      🔫 <span id="weapon">PISTOL</span>
      &nbsp; <span id="ammo">12</span><br>
      🚗 <span id="speed">0</span> km/h<br>
      ⭐ <span id="wanted">☆☆☆☆☆</span>
    </div>
  </div>

  <div id="mission">
    <b id="missionTitle">MISSION</b><br>
    <span id="missionText">Loading...</span>
  </div>

  <div id="message"></div>

  <div id="crosshair"></div>

  <div id="minimap">
    <canvas id="mapCanvas" width="145" height="145"></canvas>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="help">
    WALK: joystick<br>
    DRIVE: enter a vehicle<br>
    FIRE: shoot<br>
    SWIPE: rotate camera
  </div>

  <div class="btn" id="fire">FIRE</div>
  <div class="btn" id="enter">ENTER</div>
  <div class="btn" id="use">USE</div>
  <div class="btn" id="switch">WEAPON</div>
  <div class="btn" id="brake">BRAKE</div>
  <div class="btn" id="save">SAVE</div>
  <div class="btn" id="load">LOAD</div>

</div>

<script>
/* =========================================================
   THREE.JS LOADER
========================================================= */

(function(){

const sources=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
  "https://unpkg.com/three@0.160.0/build/three.min.js"
];

let index=0;

function loadThree(){
  if(index>=sources.length){
    document.getElementById("loading").innerHTML=
      "<b>THREE.JS COULD NOT LOAD</b><small>Check your internet connection and reload.</small>";
    return;
  }

  const s=document.createElement("script");
  s.src=sources[index++];

  s.onload=()=>{
    if(window.THREE) startGame();
    else loadThree();
  };

  s.onerror=()=>{
    s.remove();
    loadThree();
  };

  document.head.appendChild(s);
}

loadThree();

})();


/* =========================================================
   GAME
========================================================= */

function startGame(){

const THREE=window.THREE;

document.getElementById("loading").style.display="none";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x82b8e8);

scene.fog=new THREE.Fog(
  0x82b8e8,
  110,
  430
);

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  700
);

camera.position.set(0,8,13);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi=new THREE.HemisphereLight(
  0xbfe8ff,
  0x26301e,
  1.6
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  2.1
);

sun.position.set(
  100,
  160,
  80
);

scene.add(sun);

const moon=new THREE.DirectionalLight(
  0x6d83c8,
  0
);

moon.position.set(-100,120,-100);

scene.add(moon);


/* =========================================================
   WORLD ARRAYS
========================================================= */

const obstacles=[];
const vehicles=[];
const traffic=[];
const police=[];
const pedestrians=[];
const enemies=[];
const bullets=[];
const effects=[];
const streetLights=[];
const locations=[];

let currentCar=null;
let helicopter=null;

let health=100;
let money=500;

let wanted=0;
let wantedTimer=0;

let weaponIndex=0;
let rifleOwned=false;

let ammo=12;

let missionIndex=0;
let missionProgress=0;

let gameTime=10;

let cameraYaw=0;
let cameraPitch=.20;

let firePressed=false;
let brakePressed=false;

let joystickX=0;
let joystickY=0;

let messageTimer=0;

let dead=false;


/* =========================================================
   MATERIALS
========================================================= */

const mat={
  grass:new THREE.MeshStandardMaterial({
    color:0x426c38
  }),

  road:new THREE.MeshStandardMaterial({
    color:0x24272b,
    roughness:1
  }),

  sidewalk:new THREE.MeshStandardMaterial({
    color:0x999b9d
  }),

  white:new THREE.MeshStandardMaterial({
    color:0xffffff
  }),

  yellow:new THREE.MeshStandardMaterial({
    color:0xf3c72e
  }),

  black:new THREE.MeshStandardMaterial({
    color:0x101216
  }),

  glass:new THREE.MeshStandardMaterial({
    color:0x375e78,
    metalness:.2,
    roughness:.25
  }),

  window:new THREE.MeshStandardMaterial({
    color:0x6e8290,
    emissive:0xffc15b,
    emissiveIntensity:0
  }),

  tree:new THREE.MeshStandardMaterial({
    color:0x23662f
  }),

  trunk:new THREE.MeshStandardMaterial({
    color:0x60452e
  }),

  red:new THREE.MeshStandardMaterial({
    color:0xb82727
  }),

  blue:new THREE.MeshStandardMaterial({
    color:0x2875c7
  }),

  policeBlue:new THREE.MeshBasicMaterial({
    color:0x236fff
  }),

  policeRed:new THREE.MeshBasicMaterial({
    color:0xff2222
  })
};


/* =========================================================
   HELPERS
========================================================= */

function box(w,h,d,material,x=0,y=0,z=0){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  m.position.set(x,y,z);

  scene.add(m);

  return m;
}


function cyl(r,h,material,x=0,y=0,z=0){

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,12),
    material
  );

  m.position.set(x,y,z);

  scene.add(m);

  return m;
}


function sphere(r,material,x=0,y=0,z=0){

  const m=new THREE.Mesh(
    new THREE.SphereGeometry(r,12,8),
    material
  );

  m.position.set(x,y,z);

  scene.add(m);

  return m;
}


function dist(a,b){

  const dx=a.x-b.x;
  const dz=a.z-b.z;

  return Math.sqrt(dx*dx+dz*dz);
}


function clamp(v,a,b){

  return Math.max(a,Math.min(b,v));

}


/* =========================================================
   GROUND
========================================================= */

box(
  520,
  .5,
  520,
  mat.grass,
  0,
  -.3,
  0
);


/* =========================================================
   ROADS
========================================================= */

const roadPositions=[];

for(let p=-240;p<=240;p+=40){

  roadPositions.push(p);

  box(
    520,
    .08,
    15,
    mat.road,
    0,
    -.02,
    p
  );

  box(
    15,
    .08,
    520,
    mat.road,
    p,
    -.01,
    0
  );

  box(
    520,
    .10,
    2,
    mat.sidewalk,
    0,
    .02,
    p-9
  );

  box(
    520,
    .10,
    2,
    mat.sidewalk,
    0,
    .02,
    p+9
  );

  box(
    2,
    .10,
    520,
    mat.sidewalk,
    p-9,
    .02,
    0
  );

  box(
    2,
    .10,
    520,
    mat.sidewalk,
    p+9,
    .02,
    0
  );
}


/* road markings */

const lineMat=new THREE.MeshBasicMaterial({
  color:0xf0d95b
});

for(let p=-240;p<=240;p+=40){

  for(let x=-245;x<245;x+=12){

    box(
      5,
      .025,
      .35,
      lineMat,
      x,
      .05,
      p
    );

  }

  for(let z=-245;z<245;z+=12){

    box(
      .35,
      .025,
      5,
      lineMat,
      p,
      .05,
      z
    );

  }
}


/* =========================================================
   BUILDINGS
========================================================= */

function addBuilding(x,z,w,d,h,color){

  const bodyMat=new THREE.MeshStandardMaterial({
    color:color,
    roughness:.85
  });

  box(
    w,
    h,
    d,
    bodyMat,
    x,
    h/2,
    z
  );

  obstacles.push({
    x:x,
    z:z,
    w:w,
    d:d
  });


  /* windows */

  const rows=Math.max(2,Math.floor(h/4));

  const cols=Math.max(2,Math.floor(w/4));

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      if(Math.random()<.25) continue;

      const wx=x-w/2+2+c*(w-4)/Math.max(1,cols-1);
      const wy=2+r*(h-4)/Math.max(1,rows-1);

      const front= new THREE.Mesh(
        new THREE.BoxGeometry(.8,1.2,.08),
        mat.window
      );

      front.position.set(
        wx,
        wy,
        z-d/2-.05
      );

      scene.add(front);


      const back=front.clone();

      back.position.z=z+d/2+.05;

      scene.add(back);
    }
  }
}


/* city blocks */

const buildingColors=[
  0x69747c,
  0x7b6656,
  0x556a78,
  0x766d82,
  0x8b8174,
  0x58645b,
  0x6b6a72
];

for(let x=-220;x<=220;x+=40){

  for(let z=-220;z<=220;z+=40){

    if(Math.abs(x)<25 && Math.abs(z)<25)
      continue;

    const spots=[
      [-11,-11],
      [11,-11],
      [-11,11],
      [11,11]
    ];

    spots.forEach(s=>{

      if(Math.random()<.14) return;

      const w=10+Math.random()*10;
      const d=10+Math.random()*10;
      const h=7+Math.random()*38;

      addBuilding(
        x+s[0],
        z+s[1],
        w,
        d,
        h,
        buildingColors[
          Math.floor(Math.random()*buildingColors.length)
        ]
      );

    });
  }
}


/* =========================================================
   PARKS
========================================================= */

function makeTree(x,z,scale=1){

  const trunk=cyl(
    .55*scale,
    4*scale,
    mat.trunk,
    x,
    2*scale,
    z
  );

  const crown=sphere(
    3.1*scale,
    mat.tree,
    x,
    5*scale,
    z
  );

  crown.scale.y=1.15;

}

for(let i=0;i<35;i++){

  const x=(Math.random()-.5)*460;
  const z=(Math.random()-.5)*460;

  if(
    Math.abs(x%40)<11 ||
    Math.abs(z%40)<11
  ) continue;

  makeTree(
    x,
    z,
    .7+Math.random()*.55
  );
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function makeStreetLight(x,z){

  const pole=box(
    .18,
    6,
    .18,
    mat.black,
    x,
    3,
    z
  );

  box(
    1.4,
    .18,
    .18,
    mat.black,
    x+.6,
    5.8,
    z
  );

  const bulb=sphere(
    .22,
    new THREE.MeshBasicMaterial({
      color:0xffd36a
    }),
    x+1.15,
    5.55,
    z
  );

  const light=new THREE.PointLight(
    0xffc86b,
    0,
    24
  );

  light.position.set(
    x+1.15,
    5.55,
    z
  );

  scene.add(light);

  streetLights.push({
    bulb:bulb,
    light:light
  });
}

for(let x=-220;x<=220;x+=80){

  for(let z=-220;z<=220;z+=80){

    makeStreetLight(x+10,z+10);

  }
}


/* =========================================================
   SPECIAL LOCATIONS
========================================================= */

function makeLocation(name,x,z,color){

  const h=7;

  box(
    16,
    h,
    13,
    new THREE.MeshStandardMaterial({
      color:color
    }),
    x,
    h/2,
    z
  );

  obstacles.push({
    x:x,
    z:z,
    w:16,
    d:13
  });

  const sign=box(
    10,
    2.4,
    .3,
    new THREE.MeshBasicMaterial({
      color:0xffffff
    }),
    x,
    7,
    z-6.7
  );

  locations.push({
    name:name,
    x:x,
    z:z
  });
}

makeLocation("GARAGE",-40,-40,0x49545d);
makeLocation("HOSPITAL",80,-80,0xd9d9d9);
makeLocation("POLICE",80,80,0x3d526e);
makeLocation("SHOP",-80,80,0x6e493d);


/* =========================================================
   MISSION MARKER
========================================================= */

const marker=new THREE.Mesh(
  new THREE.CylinderGeometry(4,4,.3,32),
  new THREE.MeshBasicMaterial({
    color:0x00eaff,
    transparent:true,
    opacity:.65
  })
);

marker.position.set(40,0.25,40);

scene.add(marker);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Group();

scene.add(player);

const body=box(
  1.5,
  2,
  .9,
  mat.blue
);

body.position.set(0,2.1,0);
body.parent.remove(body);
player.add(body);

const head=sphere(
  .62,
  new THREE.MeshStandardMaterial({
    color:0xd28b65
  }),
  0,
  3.5,
  0
);

player.add(head);

const leg1=box(
  .38,
  1.5,
  .45,
  mat.black,
  -.38,
  .75,
  0
);

const leg2=box(
  .38,
  1.5,
  .45,
  mat.black,
  .38,
  .75,
  0
);

player.add(leg1);
player.add(leg2);

player.position.set(0,0,0);


/* =========================================================
   GUN
========================================================= */

const gun=new THREE.Group();

const gunBody=box(
  .18,
  .22,
  1.05,
  mat.black
);

gunBody.position.z=-.55;

gun.add(gunBody);

const muzzle=sphere(
  .13,
  new THREE.MeshBasicMaterial({
    color:0xffcc44
  })
);

muzzle.position.z=-1.15;
muzzle.visible=false;

gun.add(muzzle);

gun.position.set(
  .85,
  2.35,
  -.25
);

gun.rotation.x=-.08;

player.add(gun);


/* =========================================================
   RIFLE
========================================================= */

const rifle=new THREE.Group();

const rifleBody=box(
  .18,
  .25,
  1.7,
  mat.black
);

rifleBody.position.z=-.85;

rifle.add(rifleBody);

const rifleBarrel=box(
  .10,
  .10,
  .9,
  mat.black
);

rifleBarrel.position.z=-2;

rifle.add(rifleBarrel);

rifle.position.copy(gun.position);

rifle.rotation.copy(gun.rotation);

rifle.visible=false;

player.add(rifle);


/* =========================================================
   VEHICLES
========================================================= */

const carTypes=[
  {
    name:"SPORT",
    color:0xe43b32,
    max:42,
    accel:35
  },
  {
    name:"SUV",
    color:0x27384a,
    max:31,
    accel:25
  },
  {
    name:"TAXI",
    color:0xd8c72e,
    max:34,
    accel:29
  },
  {
    name:"MUSCLE",
    color:0x542b68,
    max:38,
    accel:31
  }
];


function makeCar(
  x,
  z,
  typeIndex=0,
  rotation=0,
  options={}
){

  const type=carTypes[typeIndex] || carTypes[0];

  const car=new THREE.Group();

  car.position.set(x,0,z);
  car.rotation.y=rotation;

  const bodyMat=new THREE.MeshStandardMaterial({
    color:options.police?0x20252c:type.color,
    metalness:.15,
    roughness:.55
  });

  const lower=box(
    3.4,
    .8,
    5.8,
    bodyMat
  );

  lower.position.y=1.05;
  lower.parent.remove(lower);
  car.add(lower);


  const cabin=box(
    2.7,
    1.15,
    2.9,
    mat.glass
  );

  cabin.position.y=1.75;
  cabin.position.z=.15;
  cabin.parent.remove(cabin);
  car.add(cabin);


  const hood=box(
    3,
    .35,
    1.5,
    bodyMat
  );

  hood.position.y=1.35;
  hood.position.z=-2;
  hood.parent.remove(hood);
  car.add(hood);


  const wheelGeo=new THREE.CylinderGeometry(
    .62,
    .62,
    .38,
    12
  );

  const wheelMat=new THREE.MeshStandardMaterial({
    color:0x111111
  });

  const wheels=[];

  [
    [-1.65,.65,-1.8],
    [1.65,.65,-1.8],
    [-1.65,.65,1.8],
    [1.65,.65,1.8]
  ].forEach(p=>{

    const w=new THREE.Mesh(
      wheelGeo,
      wheelMat
    );

    w.rotation.z=Math.PI/2;

    w.position.set(
      p[0],

/* =========================================================
   HELPER: COLLISION
========================================================= */

function hitsObstacle(x,z,r){

  for(const o of obstacles){

    if(
      Math.abs(x-o.x)>o.w/2+r ||
      Math.abs(z-o.z)>o.d/2+r
    ) continue;

    return true;
  }

  return false;
}


function moveCharacter(obj,dx,dz,r=.7){

  const nx=obj.position.x+dx;
  const nz=obj.position.z+dz;

  if(
    !hitsObstacle(nx,obj.position.z,r) &&
    Math.abs(nx)<250
  )
    obj.position.x=nx;

  if(
    !hitsObstacle(obj.position.x,nz,r) &&
    Math.abs(nz)<250
  )
    obj.position.z=nz;
}


/* =========================================================
   ENTER / EXIT CAR
========================================================= */

function nearestVehicle(){

  let best=null;
  let bestD=999;

  for(const v of vehicles){

    if(v.userData.destroyed) continue;

    const d=dist(player.position,v.position);

    if(d<bestD){

      bestD=d;
      best=v;

    }
  }

  return bestD<7?best:null;
}


function enterExitCar(){

  if(dead) return;

  if(currentCar){

    player.visible=true;

    player.position.copy(currentCar.position);

    player.position.x+=3.8;

    player.position.y=0;

    currentCar.userData.speed=0;

    currentCar=null;

    showMessage("LEFT VEHICLE");

    return;
  }


  const car=nearestVehicle();

  if(!car) return;

  currentCar=car;

  player.visible=false;

  wanted=Math.max(wanted,1);

  showMessage(
    "STOLE "+car.userData.type
  );
}


/* =========================================================
   SHOOTING
========================================================= */

let lastShot=0;

function shoot(){

  if(dead) return;

  const now=performance.now();

  const cooldown=
    weaponIndex===0 ? 260 : 110;

  if(now-lastShot<cooldown)
    return;

  if(ammo<=0){

    showMessage("NO AMMO");

    return;
  }

  lastShot=now;

  ammo--;

  muzzle.visible=false;

  const gunGroup=
    weaponIndex===0 ? gun : rifle;

  gunGroup.visible=true;

  const flash=
    weaponIndex===0
      ? muzzle
      : null;

  if(flash){

    flash.visible=true;

    setTimeout(()=>{
      flash.visible=false;
    },55);
  }


  const origin=new THREE.Vector3();

  camera.getWorldPosition(origin);

  const dir=new THREE.Vector3();

  camera.getWorldDirection(dir);

  const ray=new THREE.Raycaster(
    origin,
    dir,
    0,
    160
  );


  const targets=[];

  enemies.forEach(e=>{
    if(!e.userData.dead)
      targets.push(e);
  });

  police.forEach(p=>targets.push(p));


  const hits=ray.intersectObjects(
    targets,
    true
  );


  if(hits.length){

    let obj=hits[0].object;

    while(obj.parent && !obj.userData.health)
      obj=obj.parent;

    if(obj.userData.health){

      obj.userData.health-=
        weaponIndex===0 ? 35 : 60;

      wanted=Math.max(wanted,2);

      if(obj.userData.health<=0){

        obj.userData.dead=true;

        scene.remove(obj);

        if(obj.userData.police){

          wanted=Math.min(5,wanted+1);

        }else{

          money+=100;

          missionProgress++;

        }

        showMessage("+$100");

      }
    }
  }


  /* tracer */

  const end=origin.clone()
    .add(dir.clone().multiplyScalar(70));

  const geom=new THREE.BufferGeometry()
    .setFromPoints([
      origin,
      end
    ]);

  const line=new THREE.Line(
    geom,
    new THREE.LineBasicMaterial({
      color:0xffee88
    })
  );

  scene.add(line);

  setTimeout(()=>{

    scene.remove(line);
    geom.dispose();

  },70);


  /* shooting scares pedestrians */

  pedestrians.forEach(p=>{

    if(dist(
      currentCar||player,
      p
    )<45){

      p.userData.flee=4;

    }
  });


  updateUI();
}

function updateEnemies(dt){

  const target=currentCar||player;

  enemies.forEach(e=>{

    if(e.userData.dead) return;

    const dx=target.position.x-e.position.x;
    const dz=target.position.z-e.position.z;

    const d=Math.sqrt(dx*dx+dz*dz);

    if(d<65){

      e.rotation.y=Math.atan2(dx,dz);

      if(d>12){

        const speed=3.2;

        moveCharacter(
          e,
          dx/d*speed*dt,
          dz/d*speed*dt,
          .6
        );

      }

      e.userData.shootTimer-=dt;

      if(
        d<30 &&
        e.userData.shootTimer<=0
      ){

        e.userData.shootTimer=
          1.3+Math.random()*1.5;

        if(Math.random()<.3){

          health-=8;

          if(health<=0)
            die();

        }
      }
    }
  });
}


/* =========================================================
   POLICE
========================================================= */

function spawnPolice(){

  if(police.length>=wanted+2)
    return;

  const target=currentCar||player;

  const angle=Math.random()*Math.PI*2;

  const d=55+Math.random()*25;

  const x=target.position.x+
    Math.cos(angle)*d;

  const z=target.position.z+
    Math.sin(angle)*d;

  const p=makeCar(
    x,
    z,
    1,
    Math.atan2(
      target.position.x-x,
      target.position.z-z
    ),
    {
      police:true
    }
  );

  p.userData.health=160;
}


function updatePolice(dt){

  if(wanted<=0){

    clearPolice();

    return;
  }

  if(
    police.length<
    Math.min(6,wanted+1)
  )
    spawnPolice();


  const target=currentCar||player;


  police.forEach(p=>{

    if(p.userData.destroyed) return;

    const dx=target.position.x-p.position.x;
    const dz=target.position.z-p.position.z;

    const d=Math.sqrt(dx*dx+dz*dz);

    p.rotation.y=Math.atan2(dx,dz);

    const desired=
      p.userData.maxSpeed*0.72;

    p.userData.speed=
      THREE.MathUtils.lerp(
        p.userData.speed,
        desired,
        dt*1.8
      );

    if(d>6){

      const step=
        p.userData.speed*dt;

      const nx=
        p.position.x+
        Math.sin(p.rotation.y)*step;

      const nz=
        p.position.z+
        Math.cos(p.rotation.y)*step;

      if(!hitsObstacle(nx,nz,2.5)){

        p.position.x=nx;
        p.position.z=nz;

      }else{

        p.rotation.y+=.7;

      }

    }else{

      p.userData.speed=0;

      if(!currentCar){

        health-=dt*3;

        if(health<=0)
          die();

      }

    }

  });
}


function clearPolice(){

  while(police.length){

    const p=police.pop();

    scene.remove(p);

  }

}

/* =========================================================
   TRAFFIC
========================================================= */

function updateTraffic(dt){

  traffic.forEach(car=>{

    if(car.userData.destroyed) return;

    const speed=12+(
      car.userData.type==="SPORT"
        ? 6
        : 0
    );

    const step=speed*dt;

    if(
      Math.abs(
        Math.sin(car.rotation.y)
      )>.5
    ){

      car.position.x+=
        Math.sin(car.rotation.y)*step;

      car.position.z+=
        Math.cos(car.rotation.y)*step;

    }else{

      car.position.x+=
        Math.sin(car.rotation.y)*step;

      car.position.z+=
        Math.cos(car.rotation.y)*step;

    }


    if(car.position.x>255)
      car.position.x=-255;

    if(car.position.x<-255)
      car.position.x=255;

    if(car.position.z>255)
      car.position.z=-255;

    if(car.position.z<-255)
      car.position.z=255;


    car.userData.wheels.forEach(w=>{
      w.rotation.x-=step*2;
    });


    /* traffic gets scared */

    const target=currentCar||player;

    if(dist(car,target)<5){

      if(currentCar){

        currentCar.userData.health-=dt*20;

      }else{

        health-=dt*10;

      }

    }

  });
}

function updatePedestrians(dt){

  const target=currentCar||player;

      p.userData.flee-=dt;

      const dx=p.position.x-target.position.x;
      const dz=p.position.z-target.position.z;

      const d=Math.max(.1,
        Math.sqrt(dx*dx+dz*dz)
      );

      moveCharacter(
        p,
        dx/d*5*dt,
        dz/d*5*dt,
        .4
      );

    }else{

      p.position.x+=p.userData.vx*dt;
      p.position.z+=p.userData.vz*dt;

      if(
        Math.abs(p.position.x)>240 ||
        Math.abs(p.position.z)>240
      ){

        p.userData.vx*=-1;
        p.userData.vz*=-1;

      }

    }

    p.rotation.y=
      Math.atan2(
        p.userData.vx,
        p.userData.vz
      );

  });
}


/* =========================================================
   CAR DAMAGE / EXPLOSION
========================================================= */

function explodeCar(car){

  if(car.userData.destroyed)
    return;

  car.userData.destroyed=true;
  car.userData.speed=0;

  if(currentCar===car){

    currentCar=null;
    player.visible=true;

    player.position.copy(car.position);

    player.position.x+=4;

  }


  car.visible=false;


  /* explosion sphere */

  const boom=sphere(
    1,
    new THREE.MeshBasicMaterial({
      color:0xff7a00,
      transparent:true,
      opacity:.95
    }),
    car.position.x,
    1.5,
    car.position.z
  );

  effects.push({
    mesh:boom,
    life:0,
    max:1
  });


  money=Math.max(0,money-50);

  addWanted(2);

  showMessage("VEHICLE DESTROYED");


  if(car.userData.traffic){

    setTimeout(()=>{

      car.position.set(
        (Math.random()-.5)*450,
        0,
        (Math.random()-.5)*450
      );

      car.rotation.y=
        Math.random()<.5
          ? 0
          : Math.PI/2;

      car.userData.health=100;
      car.userData.destroyed=false;
      car.visible=true;

    },6000);

  }
}


function updateEffects(dt){

  for(let i=effects.length-1;i>=0;i--){

    const e=effects[i];

    e.life+=dt;

    const t=e.life/e.max;

    e.mesh.scale.setScalar(
      1+t*6
    );

    e.mesh.material.opacity=
      1-t;

    if(e.life>=e.max){

      scene.remove(e.mesh);

      effects.splice(i,1);

    }
  }
}


/* =========================================================
   DRIVING
========================================================= */

function drive(dt){

  if(!currentCar) return;

  const c=currentCar;

  const throttle=
    -joystickY;

  const steer=
    joystickX;


  if(throttle>0){

    c.userData.speed+=
      c.userData.accel*
      throttle*
      dt;

  }else{

    c.userData.speed=
      THREE.MathUtils.lerp(
        c.userData.speed,
        0,
        dt*1.2
      );

  }


  if(brakePressed){

    c.userData.speed=
      THREE.MathUtils.lerp(
        c.userData.speed,
        0,
        dt*6
      );

  }


  c.userData.speed=
    clamp(
      c.userData.speed,
      -10,
      c.userData.maxSpeed
    );


  const speedFactor=
    Math.min(
      1,
      Math.abs(c.userData.speed)/10
    );


  c.rotation.y+=
    steer*
    dt*
    2.2*
    speedFactor;


  const step=
    c.userData.speed*dt;

  const nx=
    c.position.x+
    Math.sin(c.rotation.y)*step;

  const nz=
    c.position.z+
    Math.cos(c.rotation.y)*step;


  if(
    !hitsObstacle(nx,nz,2.7) &&
    Math.abs(nx)<248 &&
    Math.abs(nz)<248
  ){

    c.position.x=nx;
    c.position.z=nz;

  }else{

    c.userData.health-=
      Math.abs(c.userData.speed)*dt*2;

    c.userData.speed*=-.3;

  }


  c.userData.wheels.forEach(w=>{
    w.rotation.x-=step*2;
  });


  if(c.userData.health<=0)
    explodeCar(c);
}

   WALKING
========================================================= */

function walk(dt){

  if(currentCar) return;

  const speed=8;

  const dx=
    joystickX*speed*dt;

  const dz=
    joystickY*speed*dt;

  if(
    Math.abs(dx)+Math.abs(dz)>.01
  ){

    player.rotation.y=
      Math.atan2(
        dx,
        dz
      );

  }

  moveCharacter(
    player,
    dx,
    dz,
    .75
  );
}

  },
  {
    title:"GARAGE DELIVERY",
    text:"Take a vehicle to the garage.",
    target:{x:-40,z:-40}
  }
];


function updateMission(){

  const m=missions[missionIndex];

  document.getElementById("missionTitle")
    .textContent=m.title;

  document.getElementById("missionText")
    .textContent=m.text;


  if(m.target){

    marker.visible=true;

    marker.position.set(
      m.target.x,
      .25,
      m.target.z
    );

  }else{

    marker.visible=false;

  }
}


function missionCheck(){

  const m=missions[missionIndex];

  const target=currentCar||player;


  if(missionIndex===0){

    if(
      dist(
        target,
        new THREE.Vector3(
          40,
          0,
          40
        )
      )<8
    ){

      completeMission();

    }

  }


  else if(missionIndex===1){

    if(currentCar){

      completeMission();

    }

  }


  else if(missionIndex===2){

    if(missionProgress>=3){

      completeMission();

    }

  }


  else if(missionIndex===3){

    if(
      wanted===0 &&
      missionProgress>=3
    ){

      completeMission();

    }

  }


  else if(missionIndex===4){

    const garage=new THREE.Vector3(
      -40,
      0,
      -40
    );

    if(
      currentCar &&
      dist(currentCar,garage)<12
    ){

      completeMission();

    }

  }

}


function completeMission(){

  money+=500;

  showMessage(
    "MISSION COMPLETE +$500"
  );

  missionIndex++;

  missionProgress=0;

  wanted=0;

  clearPolice();


  if(missionIndex>=missions.length){

    missionIndex=0;

    showMessage(
      "CITY JOBS COMPLETE - NEW JOBS AVAILABLE"
    );

  }

  updateMission();
  updateUI();
}


/* =========================================================
   LOCATIONS
========================================================= */

function nearestLocation(){

  const target=currentCar||player;

  let best=null;
  let bestD=999;

  locations.forEach(l=>{

    const d=Math.sqrt(
      (target.position.x-l.x)**2+
      (target.position.z-l.z)**2
    );

    if(d<bestD){

      bestD=d;
      best=l;

    }

  });

  return bestD<13?best:null;
}


function useLocation(){

  const l=nearestLocation();

  if(!l) return;

  if(l.name==="SHOP"){

    if(money>=100){

      money-=100;
      ammo+=12;

      showMessage(
        "AMMO +12  -$100"
      );

    }else{

      showMessage("NOT ENOUGH MONEY");

    }

  }


  if(l.name==="HOSPITAL"){

    health=100;

    showMessage(
      "HEALTH RESTORED"
    );

  }


  if(l.name==="GARAGE"){

    if(currentCar){

      currentCar.userData.health=100;

      showMessage(
        "VEHICLE REPAIRED"
      );

    }else{

      showMessage(
        "BRING A VEHICLE HERE"
      );

    }

  }


  if(l.name==="POLICE"){

    if(wanted>0){

      showMessage(
        "POLICE ARE LOOKING FOR YOU"
      );

    }else{

      showMessage(
        "POLICE STATION"
      );

    }

  }

  updateUI();
}


/* =========================================================
   DAY / NIGHT
========================================================= */

function updateDayNight(dt){

  gameTime+=dt*.045;

  if(gameTime>=24)
    gameTime-=24;


  const sunStrength=
    Math.max(
      0,
      Math.sin(
        (gameTime-6)/24*Math.PI*2
      )
    );


  const night=
    gameTime<6 ||
    gameTime>18;


  const skyDay=
    new THREE.Color(
      0x82b8e8
    );

  const skyNight=
    new THREE.Color(
      0x071020
    );


  const nightAmount=
    night
      ? 1
      : .1;


  scene.background=
    skyDay.clone().lerp(
      skyNight,
      nightAmount
    );


  scene.fog.color=
    scene.background;


  sun.intensity=
    .25+
    sunStrength*1.9;


  moon.intensity=
    night ? .8 : 0;


  mat.window.emissiveIntensity=
    night ? 1.7 : 0;


  streetLights.forEach(s=>{

    s.light.intensity=
      night ? 1.5 : 0;

    s.bulb.material.color.set(
      night
        ? 0xffd16b
        : 0x806f50
    );

  });
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  const target=currentCar||player;

  const distance=
    currentCar ? 13 : 10;

  const height=
    currentCar ? 7 : 6;


  const desiredX=
    target.position.x+
    Math.sin(
      target.rotation.y+
      cameraYaw
    )*distance;

  const desiredZ=
    target.position.z+
    Math.cos(
      target.rotation.y+
      cameraYaw
    )*distance;


  const desiredY=
    target.position.y+
    height+
    cameraPitch*4;


  camera.position.x=
    THREE.MathUtils.lerp(
      camera.position.x,
      desiredX,
      dt*6
    );

  camera.position.z=
    THREE.MathUtils.lerp(
      camera.position.z,
      desiredZ,
      dt*6
    );

  camera.position.y=
    THREE.MathUtils.lerp(
      camera.position.y,
      desiredY,
      dt*6
    );


  const look=new THREE.Vector3(
    target.position.x,
    target.position.y+
      (currentCar?1.5:2.2),
    target.position.z
  );

  camera.lookAt(look);
}


/* =========================================================
   MINIMAP
========================================================= */

const mapCanvas=
  document.getElementById("mapCanvas");

const mapCtx=
  mapCanvas.getContext("2d");


function updateMinimap(){

  const w=145;
  const h=145;

  mapCtx.clearRect(
    0,0,w,h
  );

  mapCtx.fillStyle="#071018";

  mapCtx.fillRect(
    0,0,w,h
  );


  /* roads */

  mapCtx.strokeStyle="#444";
  mapCtx.lineWidth=5;

  roadPositions.forEach(p=>{

    const x=
      72.5+
      p/500*145;

    const y=
      72.5+
      p/500*145;

    mapCtx.beginPath();
    mapCtx.moveTo(x,0);
    mapCtx.lineTo(x,145);
    mapCtx.stroke();

    mapCtx.beginPath();
    mapCtx.moveTo(0,y);
    mapCtx.lineTo(145,y);
    mapCtx.stroke();

  });


  /* mission */

  if(marker.visible){

    mapCtx.fillStyle="#00eaff";

    const mx=
      72.5+
      marker.position.x/500*145;

    const my=
      72.5+
      marker.position.z/500*145;

    mapCtx.beginPath();

    mapCtx.arc(
      mx,my,4,0,Math.PI*2
    );

    mapCtx.fill();

  }


  const target=currentCar||player;

  const px=
    72.5+
    target.position.x/500*145;

  const py=
    72.5+
    target.position.z/500*145;


  mapCtx.fillStyle="#fff";

  mapCtx.beginPath();

  mapCtx.arc(
    px,py,4,0,Math.PI*2
  );

  mapCtx.fill();


  /* police */

  mapCtx.fillStyle="#ff3030";

  police.forEach(p=>{

    const x=
      72.5+
      p.position.x/500*145;

    const y=
      72.5+
      p.position.z/500*145;

    mapCtx.fillRect(
      x-2,y-2,4,4
    );

  });

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById("health")
    .textContent=Math.max(
      0,
      Math.floor(health)
    );

  document.getElementById("money")
    .textContent=money;

  document.getElementById("weapon")
    .textContent=
      weaponIndex===0
        ? "PISTOL"
        : "RIFLE";

  document.getElementById("ammo")
    .textContent=ammo;


  document.getElementById("wanted")
    .textContent=
      "★".repeat(wanted)+
      "☆".repeat(5-wanted);


  let speed=0;

  if(currentCar){

    speed=Math.round(
      Math.abs(
        currentCar.userData.speed
      )*3.6
    );

  }

  document.getElementById("speed")
    .textContent=speed;

}


function showMessage(text){

  const el=
    document.getElementById("message");

  el.textContent=text;

  el.style.opacity=1;

  messageTimer=2.2;
}


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

  const target=currentCar||player;

  const data={
    x:target.position.x,
    z:target.position.z,
    health:health,
    money:money,
    wanted:wanted,
    weapon:weaponIndex,
    rifle:rifleOwned,
    ammo:ammo,
    mission:missionIndex,
    progress:missionProgress,
    time:gameTime
  };

  localStorage.setItem(
    "OPEN_CITY_V9_SAVE",
    JSON.stringify(data)
  );

  showMessage("GAME SAVED");
}


function loadGame(){

  const raw=
    localStorage.getItem(
      "OPEN_CITY_V9_SAVE"
    );

  if(!raw){

    showMessage("NO SAVE FOUND");

    return;
  }

  try{

    const d=JSON.parse(raw);

    if(currentCar){

      currentCar.userData.speed=0;
      currentCar=null;
      player.visible=true;

    }

    player.position.set(
      d.x||0,
      0,
      d.z||0
    );

    health=d.health||100;
    money=d.money||500;
    wanted=d.wanted||0;
    weaponIndex=d.weapon||0;
    rifleOwned=!!d.rifle;
    ammo=d.ammo||12;
    missionIndex=d.mission||0;
    missionProgress=d.progress||0;
    gameTime=d.time||10;

    gun.visible=weaponIndex===0;
    rifle.visible=weaponIndex===1;

    clearPolice();

    updateMission();
    updateUI();

    showMessage("GAME LOADED");

  }catch(e){

    showMessage("SAVE FILE ERROR");

  }
}

  );

/* =========================================================
   INPUT
========================================================= */

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joyActive=false;


function updateJoystick(clientX,clientY){

  const rect=
    joystick.getBoundingClientRect();

  const cx=
    rect.left+rect.width/2;

  const cy=
    rect.top+rect.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=48;

  const len=Math.sqrt(
    dx*dx+dy*dy
  );

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;

  }

  joystickX=
    clamp(dx/max,-1,1);

  joystickY=
    clamp(dy/max,-1,1);

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

  joyActive=false;

  joystickX=0;
  joystickY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "touchstart",
  e=>{

    joyActive=true;

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:true}
);


joystick.addEventListener(
  "touchmove",
  e=>{

    if(!joyActive) return;

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:true}
);


joystick.addEventListener(
  "touchend",
  resetJoystick
);


/* buttons */

function bindButton(id,down,up){

  const el=document.getElementById(id);

  el.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      down();
    },
    {passive:false}
  );

  el.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      if(up) up();
    },
    {passive:false}
  );

  el.addEventListener(
    "mousedown",
    e=>{
      e.preventDefault();
      down();
    }
  );

  el.addEventListener(
    "mouseup",
    e=>{
      e.preventDefault();
      if(up) up();
    }
  );
}

);

/* keyboard */

const keys={};

addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
      shoot();
    }

    if(e.key.toLowerCase()==="e"){
      enterExitCar();
    }

    if(e.key.toLowerCase()==="f"){
      useLocation();
    }

    if(e.key.toLowerCase()==="q"){
      switchWeapon();
    }

    if(e.key.toLowerCase()==="p"){
      saveGame();
    }

  }
);


addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);


/* desktop keyboard -> joystick */

function keyboardInput(){

  let x=0;
  let y=0;

  if(keys["a"]||keys["arrowleft"])
    x-=1;

  if(keys["d"]||keys["arrowright"])
    x+=1;

  if(keys["w"]||keys["arrowup"])
    y-=1;

  if(keys["s"]||keys["arrowdown"])
    y+=1;

  if(
    !joyActive &&
    (x!==0||y!==0)
  ){

    joystickX=x;
    joystickY=y;

  }

  if(
    !joyActive &&
    x===0 &&
    y===0
  ){

    joystickX=0;
    joystickY=0;

  }

  if(keys[" "]){
    firePressed=true;
  }else if(!joyActive){
    firePressed=false;
  }

  if(keys["shift"])
    brakePressed=true;
  else if(!joyActive)
    brakePressed=false;
}


/* camera swipe */

let swipeX=null;
let swipeY=null;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length!==1) return;

    swipeX=e.touches[0].clientX;
    swipeY=e.touches[0].clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchmove",
  e=>{

    if(
      swipeX===null ||
      e.touches.length!==1
    ) return;

    const x=e.touches[0].clientX;
    const y=e.touches[0].clientY;

    const dx=x-swipeX;
    const dy=y-swipeY;

    cameraYaw-=dx*.006;

    cameraPitch=
      clamp(
        cameraPitch-dy*.003,
        -.25,
        .65
      );

    swipeX=x;
    swipeY=y;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  ()=>{
    swipeX=null;
    swipeY=null;
  }
);


/* =========================================================
   RESPAWN
========================================================= */

function respawn(){

  dead=false;

  health=100;

  wanted=0;

  clearPolice();

  if(currentCar){

    currentCar.userData.speed=0;
    currentCar=null;

  }

  player.visible=true;

  player.position.set(
    0,
    0,
    0
  );

  showMessage(
    "YOU ARE BACK"
  );

  updateUI();
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=performance.now();


function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  let dt=
    (now-lastTime)/1000;

  lastTime=now;

  dt=Math.min(dt,.05);


  keyboardInput();


  if(!dead){

    if(currentCar){

      drive(dt);

    }else{

      walk(dt);

    }


    if(firePressed)
      shoot();


    updateEnemies(dt);
    updatePolice(dt);
    updateWanted(dt);
    updateTraffic(dt);
    updatePedestrians(dt);
    updateHelicopter(dt);

    missionCheck();

  }


  updateEffects(dt);
  updateDayNight(dt);
  updateCamera(dt);
  updateMinimap();
  updateUI();


  if(messageTimer>0){

    messageTimer-=dt;

    if(messageTimer<=0){

      document.getElementById("message")
        .style.opacity=0;

    }
  }


  marker.rotation.y+=dt*1.8;

  renderer.render(
    scene,
    camera
  );
}


updateMission();
updateUI();
animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

}
