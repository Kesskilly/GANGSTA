<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V8</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#111;font-family:Arial,sans-serif;
 touch-action:none
}
canvas{display:block}

#loading{
 position:fixed;inset:0;background:#071018;color:white;
 z-index:9999;display:flex;align-items:center;
 justify-content:center;text-align:center;
 font-size:22px;font-weight:bold
}

#hud{
 position:fixed;top:8px;left:8px;z-index:50;
 color:#fff;text-shadow:2px 2px 4px #000;
 background:#0008;padding:8px 10px;
 border-radius:12px;font-size:13px;
 min-width:180px
}
#hud b{font-size:18px}
#mission{margin-top:4px;color:#ffe45c}

#cross{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 z-index:20;color:white;font-size:25px;
 text-shadow:0 0 5px #000
}

#map{
 position:fixed;right:8px;top:8px;
 width:125px;height:125px;
 background:#172017dd;
 border:2px solid white;
 border-radius:10px;
 z-index:50
}

#joy{
 position:fixed;left:15px;bottom:15px;
 width:132px;height:132px;
 border:3px solid #ffffff66;
 border-radius:50%;
 background:#0005;
 z-index:100
}
#stick{
 position:absolute;
 width:55px;height:55px;
 left:35px;top:35px;
 border-radius:50%;
 background:#ffffffaa
}

#look{
 position:fixed;right:0;top:0;
 width:58%;height:65%;
 z-index:30
}

.panel{
 position:fixed;right:9px;bottom:12px;
 width:245px;z-index:110;
 display:flex;gap:7px;flex-wrap:wrap;
 justify-content:flex-end
}

#drive{display:none}

button{
 width:62px;height:62px;
 border:2px solid #ffffff88;
 border-radius:50%;
 background:#000b;color:#fff;
 font-weight:bold;font-size:10px;
 box-shadow:0 3px 8px #0008
}
button:active{transform:scale(.92)}
#fire{background:#a40000ee}
#enter{display:none;background:#087cdd}
#gas{background:#078b43}
#brake{background:#8b3907}
#exit{background:#7d1111}

.small{
 position:fixed;left:8px;z-index:100;
 width:72px;height:34px;
 border-radius:8px;font-size:10px
}
#save{bottom:150px}
#load{bottom:110px}

#msg{
 position:fixed;left:50%;top:42%;
 transform:translate(-50%,-50%);
 z-index:200;color:white;
 font-size:23px;font-weight:bold;
 text-align:center;text-shadow:2px 2px 6px #000;
 display:none;pointer-events:none
}

#damage{
 position:fixed;inset:0;
 background:#ff000033;
 z-index:80;
 pointer-events:none;
 opacity:0;
 transition:opacity .1s
}

#help{
 position:fixed;left:50%;bottom:7px;
 transform:translateX(-50%);
 color:#fff9;background:#0007;
 padding:4px 8px;border-radius:7px;
 z-index:40;font-size:9px
}

@media(max-width:500px){
 #help{display:none}
 #hud{font-size:11px;min-width:170px}
 #hud b{font-size:16px}
}
</style>
</head>

<body>

<div id="loading">
 LOADING OPEN CITY V8...
</div>

<div id="damage"></div>

<div id="hud">
 <b>OPEN CITY V8</b><br>
 ❤️ <span id="hp">100</span>
 &nbsp; 🚗 <span id="carhp">---</span>
 &nbsp; 🔫 <span id="ammo">30</span><br>
 💵 $<span id="money">500</span>
 &nbsp; ⭐ <span id="wanted">0</span><br>
 🚓 <span id="police">0</span>
 &nbsp; 🚁 <span id="heli">0</span>
 &nbsp; 🌤️ <span id="clock">08:00</span><br>
 🔫 <span id="weapon">PISTOL</span>
 <div id="mission">MISSION</div>
</div>

<canvas id="map" width="125" height="125"></canvas>

<div id="cross">+</div>
<div id="msg"></div>

<button id="save" class="small">SAVE</button>
<button id="load" class="small">LOAD</button>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="look"></div>

<div id="buttons" class="panel">
 <button id="fire">FIRE</button>
 <button id="jump">JUMP</button>
 <button id="run">RUN</button>
 <button id="weaponBtn">WEAPON</button>
 <button id="enter">ENTER</button>
 <button id="use">USE</button>
</div>

<div id="drive" class="panel">
 <button id="gas">GAS</button>
 <button id="brake">BRAKE</button>
 <button id="repair">REPAIR</button>
 <button id="exit">EXIT</button>
</div>

<div id="help">
 JOYSTICK MOVE • DRAG RIGHT SIDE TO LOOK
</div>

<script>
/* =========================================================
   THREE.JS LOADER
========================================================= */

(function(){

 const urls=[
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
  "https://unpkg.com/three@0.160.0/build/three.min.js"
 ];

 function load(i){

  if(i>=urls.length){
   document.getElementById("loading").innerHTML=
    "THREE.JS COULD NOT LOAD<br><br>"+
    "Please reload the page.";
   return;
  }

  const s=document.createElement("script");
  s.src=urls[i];

  s.onload=function(){
   if(window.THREE){
    document.getElementById("loading").style.display="none";
    startGame();
   }else{
    load(i+1);
   }
  };

  s.onerror=function(){
   load(i+1);
  };

  document.head.appendChild(s);
 }

 load(0);

})();


/* =========================================================
   GAME
========================================================= */

function startGame(){

const THREE=window.THREE;


/* =========================================================
   CORE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x76a9c8);

scene.fog=new THREE.Fog(
 0x76a9c8,
 90,
 330
);

const camera=new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 600
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(
 Math.min(window.devicePixelRatio||1,1.5)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();


/* =========================================================
   LIGHTING
========================================================= */

const hemi=new THREE.HemisphereLight(
 0xffffff,
 0x263526,
 1.5
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
 0xffffff,
 1.7
);

sun.position.set(80,120,40);
scene.add(sun);


/* =========================================================
   HELPERS
========================================================= */

function mat(color){

 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.82,
  metalness:.05
 });
}

function cube(
 w,h,d,color,
 x,y,z,
 parent=scene
){

 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color)
 );

 m.position.set(x,y,z);

 parent.add(m);

 return m;
}

function cyl(
 r,h,color,
 x,y,z,
 parent=scene
){

 const m=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,10),
  mat(color)
 );

 m.position.set(x,y,z);

 parent.add(m);

 return m;
}

function dist(a,b){

 return Math.hypot(
  a.position.x-b.position.x,
  a.position.z-b.position.z
 );
}

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function message(t){

 const m=document.getElementById("msg");

 m.innerHTML=t;
 m.style.display="block";

 clearTimeout(message.timer);

 message.timer=setTimeout(()=>{
  m.style.display="none";
 },1500);
}

function damageFlash(){

 const d=document.getElementById("damage");

 d.style.opacity="1";

 setTimeout(()=>{
  d.style.opacity="0";
 },100);
}


/* =========================================================
   WORLD
========================================================= */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 mat(0x3d7a3d)
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* =========================================================
   ROADS
========================================================= */

function road(x,z,w,d){

 cube(
  w,.08,d,
  0x292c30,
  x,.04,z
 );

}

for(let p=-160;p<=160;p+=40){

 road(p,0,13,500);
 road(0,p,500,13);

 /* sidewalks */

 cube(
  2,.12,500,
  0x777777,
  p-8,.08,0
 );

 cube(
  2,.12,500,
  0x777777,
  p+8,.08,0
 );

 cube(
  500,.12,2,
  0x777777,
  0,.08,p-8
 );

 cube(
  500,.12,2,
  0x777777,
  0,.08,p+8
 );
}


/* =========================================================
   ROAD MARKINGS
========================================================= */

for(let p=-240;p<=240;p+=16){

 cube(
  .35,.09,7,
  0xf3d54e,
  0,.1,p
 );

 cube(
  7,.09,.35,
  0xf3d54e,
  p,.1,0
 );
}


/* =========================================================
   BUILDINGS
========================================================= */

let seed=17;

function rnd(){

 seed=(seed*9301+49297)%233280;

 return seed/233280;
}

const buildingColors=[
 0x626a72,
 0x806e62,
 0x52687a,
 0x765f75,
 0x61715e,
 0x777777
];

function building(x,z){

 const w=12+rnd()*8;
 const d=12+rnd()*8;
 const h=10+rnd()*35;

 const g=new THREE.Group();

 g.position.set(x,0,z);

 cube(
  w,h,d,
  buildingColors[
   Math.floor(rnd()*buildingColors.length)
  ],
  0,h/2,0,g
 );

 /* roof */

 cube(
  w+.5,.5,d+.5,
  0x252525,
  0,h+.25,0,g
 );

 /* windows */

 const rows=Math.max(
  2,
  Math.floor(h/5)
 );

 for(let r=0;r<rows;r++){

  const y=3+r*4;

  if(y>h-1)continue;

  for(let side of[-1,1]){

   for(let q=-1;q<=1;q++){

    const win=cube(
     1.5,.9,.08,
     0x9ecce8,
     q*(w/3),
     y,
     side*(d/2+.05),
     g
    );

    win.material.emissive.setHex(
     0x182a35
    );
   }
  }
 }

 scene.add(g);
}

for(let x=-220;x<=220;x+=40){

 for(let z=-220;z<=220;z+=40){

  if(
   Math.abs(x)<25 ||
   Math.abs(z)<25
  )continue;

  if(rnd()<.85){

   building(
    x+(rnd()-.5)*8,
    z+(rnd()-.5)*8
   );
  }
 }
}


/* =========================================================
   TREES
========================================================= */

function tree(x,z){

 const g=new THREE.Group();

 cyl(
  .7,4,
  0x654321,
  0,2,0,g
 );

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(3.5,8,7),
  mat(0x286d32)
 );

 crown.position.y=5.5;

 g.add(crown);

 g.position.set(x,0,z);

 scene.add(g);
}

for(let i=0;i<70;i++){

 const x=(rnd()-.5)*450;
 const z=(rnd()-.5)*450;

 if(
  Math.abs(x)%40<10 ||
  Math.abs(z)%40<10
 )continue;

 tree(x,z);
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function streetLight(x,z){

 const g=new THREE.Group();

 cyl(
  .12,5,
  0x333333,
  0,2.5,0,g
 );

 cube(
  1.4,.15,.15,
  0x333333,
  .6,5,0,g
 );

 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.22,8,8),
  new THREE.MeshBasicMaterial({
   color:0xffe5a0
  })
 );

 bulb.position.set(1.2,4.8,0);

 g.add(bulb);

 g.position.set(x,0,z);

 scene.add(g);
}

for(let p=-180;p<=180;p+=40){

 streetLight(p+5,5);
 streetLight(5,p+5);
}


/* =========================================================
   LOCATIONS
========================================================= */

function specialBuilding(
 x,z,color,label
){

 const g=new THREE.Group();

 g.position.set(x,0,z);

 cube(
  18,12,18,
  color,
  0,6,0,g
 );

 cube(
  19,.5,19,
  0x222222,
  0,12.25,0,g
 );

 const sign=cube(
  10,2,.3,
  0xffff66,
  0,8,-9.2,g
 );

 sign.userData.label=label;

 scene.add(g);

 return g;
}

const garage=
 specialBuilding(
  -60,60,
  0x3157a0,
  "GARAGE"
 );

const hospital=
 specialBuilding(
  60,-60,
  0xb83b3b,
  "HOSPITAL"
 );

const station=
 specialBuilding(
  -60,-60,
  0x3d4148,
  "POLICE"
 );

const shop=
 specialBuilding(
  60,60,
  0x298b4a,
  "SHOP"
 );


/* =========================================================
   MARKER
========================================================= */

const marker=new THREE.Mesh(
 new THREE.CylinderGeometry(4,4,.25,24),
 new THREE.MeshBasicMaterial({
  color:0x008cff
 })
);

marker.position.set(55,.2,55);

scene.add(marker);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Group();

const body=cube(
 1.5,2,.9,
 0x2459a6,
 0,2.1,0,
 player
);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.58,12,10),
 mat(0xc98b63)
);

head.position.y=3.55;

player.add(head);

cube(
 .48,1.7,.55,
 0x202a38,
 -.42,.85,0,
 player
);

cube(
 .48,1.7,.55,
 0x202a38,
 .42,.85,0,
 player
);

cube(
 .42,1.55,.5,
 0xc98b63,
 -.95,2.1,0,
 player
);

cube(
 .42,1.55,.5,
 0xc98b63,
 .95,2.1,0,
 player
);

const gun=cube(
 .24,.24,1.35,
 0x111111,
 .75,2.25,-.7,
 player
);

player.position.set(0,0,10);

scene.add(player);


/* =========================================================
   WEAPONS
========================================================= */

const weapons=[
 {
  name:"PISTOL",
  damage:40,
  ammo:30,
  maxAmmo:30,
  fireRate:.35,
  color:0x111111
 },
 {
  name:"RIFLE",
  damage:75,
  ammo:60,
  maxAmmo:60,
  fireRate:.14,
  color:0x444444
 }
];

let weaponIndex=0;

function currentWeapon(){
 return weapons[weaponIndex];
}

function updateWeapon(){

 const w=currentWeapon();

 gun.material.color.setHex(w.color);

 document.getElementById(
  "weapon"
 ).textContent=w.name;

 document.getElementById(
  "ammo"
 ).textContent=w.ammo;
}


/* =========================================================
   CARS
========================================================= */

const cars=[];
const traffic=[];
const police=[];
const helicopters=[];

function makeCar(
 x,z,color,
 rot=0,
 policeCar=false,
 trafficCar=false
){

 const g=new THREE.Group();

 g.position.set(x,0,z);
 g.rotation.y=rot;

 g.userData={
  speed:0,
  health:100,
  used:false,
  destroyed:false,
  police:policeCar,
  traffic:trafficCar
 };

 /* body */

 cube(
  4.4,1.05,7,
  policeCar?0xe8e8e8:color,
  0,1,0,g
 );

 /* hood */

 cube(
  4.1,.25,1.7,
  policeCar?0xdedede:color,
  0,1.55,-2.1,g
 );

 /* cabin */

 cube(
  3.1,1.05,3.1,
  0x20262b,
  0,1.8,.3,g
 );

 /* lights */

 cube(
  .7,.22,.18,
  0xffffbb,
  -1.35,1.15,-3.53,g
 );

 cube(
  .7,.22,.18,
  0xffffbb,
  1.35,1.15,-3.53,g
 );

 cube(
  .7,.22,.18,
  0xff2222,
  -1.35,1.15,3.53,g
 );

 cube(
  .7,.22,.18,
  0xff2222,
  1.35,1.15,3.53,g
 );

 const wheelGeo=
  new THREE.CylinderGeometry(
   .72,.72,.45,12
  );

 for(const sx of[-2.1,2.1]){

  for(const sz of[-2.2,2.2]){

   const w=new THREE.Mesh(
    wheelGeo,
    mat(0x111111)
   );

   w.rotation.z=Math.PI/2;

   w.position.set(
    sx,.65,sz
   );

   g.add(w);
  }
 }

 if(policeCar){

  cube(
   .65,.25,1,
   0xff2222,
   -.5,2.5,0,g
  );

  cube(
   .65,.25,1,
   0x2255ff,
   .5,2.5,0,g
  );
 }

 scene.add(g);

 if(!policeCar&&!trafficCar)
  cars.push(g);

 return g;
}


/* PARKED */

makeCar(
 18,8,0xc93434,
 Math.PI/2
);

makeCar(
 -20,-30,0x2865c9,
 Math.PI/2
);

makeCar(
 45,45,0xd4a727
);

makeCar(
 -50,20,0xffffff,
 Math.PI/2
);

makeCar(
 100,-40,0x25a65b,
 Math.PI/2
);

makeCar(
 -100,80,0x9b38b8
);


/* =========================================================
   TRAFFIC
========================================================= */

function createTraffic(){

 const colors=[
  0xe23a3a,
  0x3366dd,
  0xe4c936,
  0xffffff,
  0x32a66a,
  0x222222
 ];

 for(let i=0;i<16;i++){

  const horizontal=i%2===0;

  const lane=
   Math.floor(Math.random()*9-4)*40;

  const c=makeCar(
   horizontal?
    (Math.random()-.5)*440:
    lane,

   horizontal?
    lane:
    (Math.random()-.5)*440,

   colors[
    Math.floor(Math.random()*colors.length)
   ],

   horizontal?Math.PI/2:0,
   false,
   true
  );

  c.userData.speed=
   .12+Math.random()*.12;

  traffic.push(c);
 }
}

createTraffic();

function updateTraffic(dt){

 for(const c of traffic){

  if(c.userData.destroyed)continue;

  if(c.rotation.y===0){

   c.position.z+=
    c.userData.speed*dt*60;

   if(c.position.z>245)
    c.position.z=-245;

  }else{

   c.position.x+=
    c.userData.speed*dt*60;

   if(c.position.x>245)
    c.position.x=-245;
  }
 }
}


/* =========================================================
   DAMAGE / EXPLOSIONS
========================================================= */

function damageCar(c,amount){

 if(!c||c.userData.destroyed)return;

 c.userData.health-=amount;

 if(c.userData.health<=0)
  explodeCar(c);
}

function explodeCar(c){

 if(c.userData.destroyed)return;

 c.userData.destroyed=true;

 const pos=c.position.clone();

 message("💥 CAR DESTROYED");

 for(let i=0;i<5;i++){

  const fire=new THREE.Mesh(
   new THREE.SphereGeometry(
    .6+Math.random()*.9,8,8
   ),
   new THREE.MeshBasicMaterial({
    color:i%2?0xffcc22:0xff5511
   })
  );

  fire.position.set(
   pos.x+(Math.random()-.5)*3,
   1+Math.random()*3,
   pos.z+(Math.random()-.5)*3
  );

  scene.add(fire);

  setTimeout(()=>{
   scene.remove(fire);
  },500+Math.random()*500);
 }

 scene.remove(c);

 if(c===currentCar){

  driving=false;
  currentCar=null;
  player.visible=true;

  document.getElementById(
   "drive"
  ).style.display="none";

  document.getElementById(
   "buttons"
  ).style.display="flex";

  player.position.y=0;

  damageFlash();
 }
}


/* =========================================================
   PEDESTRIANS
========================================================= */

const pedestrians=[];

function createPedestrian(x,z){

 const p=new THREE.Group();

 p.position.set(x,0,z);

 cube(
  .75,1.7,.6,
  0x9d3e3e,
  0,1.7,0,p
 );

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.38,8,8),
  mat(0xc98b63)
 );

 h.position.y=2.8;

 p.add(h);

 p.userData={
  dx:(Math.random()-.5)*.5,
  dz:(Math.random()-.5)*.5
 };

 scene.add(p);

 pedestrians.push(p);
}

for(let i=0;i<32;i++){

 createPedestrian(
  (Math.random()-.5)*420,
  (Math.random()-.5)*420
 );
}

function updatePedestrians(dt){

 for(const p of pedestrians){

  p.position.x+=
   p.userData.dx*dt;

  p.position.z+=
   p.userData.dz*dt;

  if(Math.abs(p.position.x)>245)
   p.userData.dx*=-1;

  if(Math.abs(p.position.z)>245)
   p.userData.dz*=-1;

  if(Math.random()<.01){

   p.userData.dx=
    (Math.random()-.5)*.5;

   p.userData.dz=
    (Math.random()-.5)*.5;
  }
 }
}


/* =========================================================
   ENEMIES
========================================================= */

const enemies=[];

function makeEnemy(x,z){

 const e=new THREE.Group();

 e.position.set(x,0,z);

 cube(
  1.3,2,.8,
  0x741515,
  0,2,0,e
 );

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.55,12,10),
  mat(0xb87955)
 );

 h.position.y=3.5;

 e.add(h);

 e.userData={
  hp:100,
  cool:0,
  dead:false,
  type:"enemy",
  enemyRoot:true
 };

 scene.add(e);

 enemies.push(e);
}

makeEnemy(35,15);
makeEnemy(-35,-10);
makeEnemy(55,-35);
makeEnemy(-55,45);
makeEnemy(65,65);
makeEnemy(100,30);


/* =========================================================
   POLICE
========================================================= */

let wanted=0;
let wantedTimer=0;

function spawnPolice(){

 if(police.length>=wanted)return;

 const a=Math.random()*Math.PI*2;
 const d=55+Math.random()*30;

 const x=player.position.x+
  Math.cos(a)*d;

 const z=player.position.z+
  Math.sin(a)*d;

 const c=makeCar(
  x,z,0xffffff,
  Math.atan2(
   player.position.x-x,
   player.position.z-z
  ),
  true,false
 );

 const officer=new THREE.Group();

 officer.position.copy(c.position);

 cube(
  1.25,2,.8,
  0x18212d,
  0,2,0,
  officer
 );

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.5,10,8),
  mat(0xc98b63)
 );

 h.position.y=3.4;

 officer.add(h);

 officer.userData={
  cool:0,
  type:"police",
  enemyRoot:true
 };

 scene.add(officer);

 police.push({
  car:c,
  officer:officer
 });
}

function clearPolice(){

 for(const p of police){

  scene.remove(p.car);
  scene.remove(p.officer);
 }

 police.length=0;
}

function updatePolice(dt){

 if(wanted<=0){

  if(police.length)
   clearPolice();

  return;
 }

 while(police.length<wanted)
  spawnPolice();

 const target=
  driving&&currentCar?
  currentCar.position:
  player.position;

 for(const p of police){

  const c=p.car;

  const dx=
   target.x-c.position.x;

  const dz=
   target.z-c.position.z;

  const d=Math.hypot(dx,dz);

  const angle=
   Math.atan2(dx,dz);

  let diff=
   angle-c.rotation.y;

  while(diff>Math.PI)
   diff-=Math.PI*2;

  while(diff<-Math.PI)
   diff+=Math.PI*2;

  c.rotation.y+=
   clamp(diff,-.045,.045);

  c.userData.speed=
   clamp(
    c.userData.speed+dt*.35,
    0,
    .48
   );

  c.position.x+=
   Math.sin(c.rotation.y)*
   c.userData.speed*dt*60;

  c.position.z+=
   Math.cos(c.rotation.y)*
   c.userData.speed*dt*60;

  p.officer.position.copy(c.position);

  p.officer.userData.cool-=dt;

  if(d<11){

   if(
    p.officer.userData.cool<=0
   ){

    hp-=8;

    damageFlash();

    p.officer.userData.cool=1.1;
   }
  }

  if(
   d<5 &&
   driving &&
   currentCar
  ){

   damageCar(
    currentCar,
    dt*7
   );
  }
 }
}

  new THREE.BoxGeometry(10,.1,.35),

 h.add(rotor);

 h.userData.rotor=rotor;
 h.userData.cool=0;

 helicopters.push(h);
}

function updateHelicopters(dt){

 if(wanted>=4)
  spawnHelicopter();

 if(wanted<4){

  for(const h of helicopters)
   scene.remove(h);

  helicopters.length=0;

  return;
 }

 for(const h of helicopters){

  const target=
   driving&&currentCar?
   currentCar.position:
   player.position;

  h.position.x+=
   (target.x-h.position.x)*dt*.35;

  h.position.z+=
   (target.z-h.position.z)*dt*.35;

  h.userData.rotor.rotation.y+=dt*12;

  h.userData.cool-=dt;

  const d=Math.hypot(
   target.x-h.position.x,
   target.z-h.position.z
  );

  if(
   d<30 &&
   h.userData.cool<=0
  ){

   hp-=12;

   damageFlash();

   h.userData.cool=1.5;
  }
 }
}


/* =========================================================
   GAME STATE
========================================================= */

let hp=100;
let money=500;

let driving=false;
let currentCar=null;

let joyX=0;
let joyY=0;

let running=false;
let gas=false;
let brake=false;

let camAngle=0;

let velocityY=0;
let onGround=true;

let keys={};

let fireHeld=false;
let fireTimer=0;


/* =========================================================
   WALKING
========================================================= */

function walk(dt){

 if(driving)return;

 let f=-joyY;
 let s=joyX;

 if(keys.w)f=1;
 if(keys.s)f=-1;
 if(keys.a)s=-1;
 if(keys.d)s=1;

 let x=
  Math.sin(camAngle)*f+
  Math.cos(camAngle)*s;

 let z=
  Math.cos(camAngle)*f-
  Math.sin(camAngle)*s;

 const len=Math.hypot(x,z);

 if(len>1){

  x/=len;
  z/=len;
 }

 const speed=
  running||keys.shift?8:4.5;

 player.position.x+=
  x*speed*dt;

 player.position.z+=
  z*speed*dt;

 player.position.x=
  clamp(player.position.x,-245,245);

 player.position.z=
  clamp(player.position.z,-245,245);

 if(len>.1){

  player.rotation.y=
   Math.atan2(x,z);
 }

 velocityY-=12*dt;

 player.position.y+=
  velocityY*dt;

 if(player.position.y<=0){

  player.position.y=0;
  velocityY=0;
  onGround=true;
 }
}


/* =========================================================
   CAR ENTER / EXIT
========================================================= */

function nearestCar(){

 let best=null;
 let bestD=8;

 for(const c of cars){

  if(
   c.userData.destroyed ||
   c.userData.used
  )continue;

  const d=dist(player,c);

  if(d<bestD){

   bestD=d;
   best=c;
  }
 }

 return best;
}

function enterCar(){

 if(driving)return;

 const c=nearestCar();

 if(!c){

  message("NO CAR NEARBY");
  return;
 }

 currentCar=c;
 driving=true;

 c.userData.used=true;

 player.visible=false;

 document.getElementById(
  "buttons"
 ).style.display="none";

 document.getElementById(
  "drive"
 ).style.display="flex";

 wanted=
  clamp(wanted+1,0,5);

 message(
  "🚗 CAR STOLEN<br>WANTED +1"
 );

 missionCheck("car");
}

function exitCar(){

 if(!driving||!currentCar)return;

 const c=currentCar;

 c.userData.used=false;

 player.position.set(
  c.position.x+
   Math.cos(c.rotation.y)*5,
  0,
  c.position.z-
   Math.sin(c.rotation.y)*5
 );

 player.visible=true;

 currentCar=null;
 driving=false;

 document.getElementById(
  "drive"
 ).style.display="none";

 document.getElementById(
  "buttons"
 ).style.display="flex";
}


/* =========================================================
   DRIVING
========================================================= */

function drive(dt){

 if(!driving||!currentCar)return;

 const c=currentCar;

 let throttle=0;

 if(gas||keys.w)
  throttle=1;

 if(brake||keys.s)
  throttle=-1;

 c.userData.speed+=
  throttle*.7*dt;

 c.userData.speed*=
  Math.pow(.94,dt*60);

 c.userData.speed=
  clamp(
   c.userData.speed,
   -.22,.55
  );

 let steer=joyX;

 if(keys.a)steer=-1;
 if(keys.d)steer=1;

 if(Math.abs(c.userData.speed)>.01){

  c.rotation.y+=
   steer*.055*
   Math.min(
    1,
    Math.abs(c.userData.speed)*3
   )*
   Math.sign(c.userData.speed);
 }

 c.position.x+=
  Math.sin(c.rotation.y)*
  c.userData.speed*
  dt*60;

 c.position.z+=
  Math.cos(c.rotation.y)*
  c.userData.speed*
  dt*60;

 c.position.x=
  clamp(c.position.x,-245,245);

 c.position.z=
  clamp(c.position.z,-245,245);

 /* traffic collisions */

 for(const t of traffic){

  if(
   t.userData.destroyed ||
   dist(c,t)>5
  )continue;

  if(
   Math.abs(c.userData.speed)>.18
  ){

   damageCar(t,12);
   damageCar(c,7);

   c.userData.speed*= -.25;
  }
 }
}


/* =========================================================
   SHOOTING
========================================================= */

const raycaster=new THREE.Raycaster();

function shoot(){

 if(driving)return;

 const w=currentWeapon();

 if(w.ammo<=0){

  message("OUT OF AMMO");
  return;
 }

 w.ammo--;

 wanted=
  Math.min(5,wanted+1);

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 const targets=[];

 for(const e of enemies){

  if(!e.userData.dead)
   targets.push(e);
 }

 for(const p of police)
  targets.push(p.officer);

 const hits=
  raycaster.intersectObjects(
   targets,
   true
  );

 if(hits.length){

  let obj=hits[0].object;

  while(
   obj.parent &&
   !obj.userData.enemyRoot
  ){
   obj=obj.parent;
  }

  if(
   obj.userData &&
   obj.userData.type==="enemy"
  ){

   obj.userData.hp-=w.damage;

   if(obj.userData.hp<=0)
    killEnemy(obj);
  }

  if(
   obj.userData &&
   obj.userData.type==="police"
  ){

   wanted=5;

   message("🚓 POLICE HIT");
  }
 }

 updateWeapon();
}


/* =========================================================
   ENEMY AI
========================================================= */

let missionKills=0;

function killEnemy(e){

 if(e.userData.dead)return;

 e.userData.dead=true;

 money+=100;
 missionKills++;

 e.traverse(o=>{

  if(o.isMesh)
   o.material.color.setHex(0x151515);
 });

 message("+$100");

 setTimeout(()=>{

  scene.remove(e);

  const i=enemies.indexOf(e);

  if(i>=0)
   enemies.splice(i,1);

 },400);

 missionCheck("enemy");
}

function updateEnemies(dt){

 const target=
  driving&&currentCar?
  currentCar.position:
  player.position;

 for(const e of enemies){

  if(e.userData.dead)continue;

  const dx=
   target.x-e.position.x;

  const dz=
   target.z-e.position.z;

  const d=Math.hypot(dx,dz);

  if(d<40){

   if(d>5){

    e.position.x+=
     dx/d*1.8*dt;

    e.position.z+=
     dz/d*1.8*dt;
   }

   e.userData.cool-=dt;

   if(
    d<7 &&
    e.userData.cool<=0
   ){

    hp-=8;

    damageFlash();

    e.userData.cool=1;
   }
  }
 }
}

/* =========================================================
   WANTED SYSTEM
========================================================= */

function wantedSystem(dt){

 if(wanted<=0){

  wantedTimer=0;

  return;
 }

 const target=
  driving&&currentCar?
  currentCar.position:
  player.position;

 let nearest=999;

 for(const p of police){

  nearest=Math.min(
   nearest,
   Math.hypot(
    target.x-p.car.position.x,
    target.z-p.car.position.z
   )
  );
 }

 /* Lose police only when far away */

 if(nearest>65){

  wantedTimer+=dt;

 }else{

  wantedTimer=0;
 }

 if(wantedTimer>8){

  wanted--;

  wantedTimer=0;

  if(wanted<=0){

   clearPolice();

   message(
    "⭐ YOU ESCAPED"
   );

   missionCheck("escape");
  }
 }
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let gameTime=8;

function updateDayNight(dt){

 gameTime+=dt*.04;

 if(gameTime>=24)
  gameTime=0;

 const daylight=
  Math.max(
   0,
   Math.sin(
    (gameTime-6)*Math.PI/12
   )
  );

 sun.intensity=
  .3+daylight*1.7;

 hemi.intensity=
  .35+daylight*1.2;

 const r=
  25+daylight*95;

 const g=
  42+daylight*135;

 const b=
  62+daylight*155;

 scene.background.setRGB(
  r/255,
  g/255,
  b/255
 );

 scene.fog.color.copy(
  scene.background
 );

 const hour=
  Math.floor(gameTime);

 const min=
  Math.floor(
   (gameTime-hour)*60
  );

 document.getElementById(
  "clock"
 ).textContent=
  String(hour).padStart(2,"0")+
  ":"+
  String(min).padStart(2,"0");
}

   SAVE / LOAD
========================================================= */

function saveGame(){

 const data={
  hp,
  money,
  wanted,
  weaponIndex,
  ammo:weapons.map(
   w=>w.ammo
  ),
  missionIndex,
  missionKills,
  x:player.position.x,
  z:player.position.z,
  gameTime
 };

 localStorage.setItem(
  "OPEN_CITY_V8",
  JSON.stringify(data)
 );

 message("💾 GAME SAVED");
}

function loadGame(){

 const raw=
  localStorage.getItem(
   "OPEN_CITY_V8"
  );

 if(!raw){

  message("NO SAVE FOUND");
  return;
 }

 try{

  const d=JSON.parse(raw);

  hp=d.hp??100;
  money=d.money??500;
  wanted=d.wanted??0;
  weaponIndex=d.weaponIndex??0;

  if(d.ammo){

   for(
    let i=0;
    i<d.ammo.length;
    i++
   ){

    if(weapons[i])
     weapons[i].ammo=d.ammo[i];
   }
  }

  missionIndex=
   d.missionIndex??0;

  missionKills=
   d.missionKills??0;

  player.position.x=
   d.x??0;

  player.position.z=
   d.z??10;

  gameTime=
   d.gameTime??8;

  clearPolice();

  updateWeapon();

  message("💾 GAME LOADED");

 }catch(e){

  message("SAVE ERROR");
 }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

function setJoy(x,y){

 const r=
  joy.getBoundingClientRect();

 let dx=
  x-r.left-r.width/2;

 let dy=
  y-r.top-r.height/2;

 const max=43;

 const len=
  Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
  "translate("+dx+"px,"+
  dy+"px)";
}

function resetJoy(){

 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";
}

joy.addEventListener(
 "pointerdown",
 e=>{

  joy.setPointerCapture(
   e.pointerId
  );

  setJoy(
   e.clientX,
   e.clientY
  );
 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  setJoy(
   e.clientX,
   e.clientY
  );
 }
);

joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);

  ]=true;

   velocityY=5.5;
   onGround=false;
  }

  if(
   e.key.toLowerCase()==="e"
  ){

   if(driving)
    exitCar();
   else
    enterCar();
  }

  if(
   e.key.toLowerCase()==="f"
  )
   shoot();

  if(
   e.key.toLowerCase()==="u"
  )
   useLocation();

  if(e.key==="1"){

   weaponIndex=0;
   updateWeapon();
  }

  if(e.key==="2"){

   if(weaponIndex===1){

    weaponIndex=0;
    updateWeapon();

   }else{

    buyRifle();
   }
  }

  if(
   e.key.toLowerCase()==="p"
  )

);

function updateCamera(){

 const target=
  driving&&currentCar?
  currentCar:
  player;

 const distanceBack=
  driving?11:9;

 const height=
  driving?5.5:5.3;

 camera.position.set(
  target.position.x-
   Math.sin(camAngle)*
   distanceBack,

  target.position.y+
   height,

  target.position.z-
   Math.cos(camAngle)*
   distanceBack
 );

 camera.lookAt(
  target.position.x,
  target.position.y+
   (driving?1.3:2),
  target.position.z
 );
}


/* =========================================================
   MINIMAP
========================================================= */

const map=
 document.getElementById("map");

const ctx=
 map.getContext("2d");

function dot(
 x,z,color,size
){

 const px=
  62.5+x/4;

 const py=
  62.5+z/4;

 if(
  px<0||px>125||
  py<0||py>125
 )return;

 ctx.fillStyle=color;

 ctx.beginPath();

 ctx.arc(
  px,py,size,
  0,Math.PI*2
 );

 ctx.fill();
}

function drawMap(){

 ctx.fillStyle="#152315";

 ctx.fillRect(
  0,0,125,125
 );

 /* roads */

 ctx.fillStyle="#444";

 for(let p=-160;p<=160;p+=40){

  const x=
   62.5+p/4;

  ctx.fillRect(
   x-2,0,4,125
  );

  const y=
   62.5+p/4;

  ctx.fillRect(
   0,y-2,125,4
  );
 }

 dot(
  marker.position.x,
  marker.position.z,
  missionIndex===4?
   "#00ff55":
   "#008cff",
  4
 );

 for(const e of enemies){

  dot(
   e.position.x,
   e.position.z,
   "#ff3333",
   2.5
  );
 }

 for(const p of police){

  dot(
   p.car.position.x,
   p.car.position.z,
   "#ffffff",
   3
  );
 }

 const target=
  driving&&currentCar?
  currentCar:
  player;

 dot(
  target.position.x,
  target.position.z,
  "#00ffff",
  4
 );
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

 document.getElementById(
  "hp"
 ).textContent=
  Math.max(
   0,
   Math.floor(hp)
  );

 document.getElementById(
  "money"
 ).textContent=
  Math.floor(money);

 document.getElementById(
  "wanted"
 ).textContent=
  wanted;

 document.getElementById(
  "police"
 ).textContent=
  police.length;

 document.getElementById(
  "heli"
 ).textContent=
  helicopters.length;

 if(
  driving &&
  currentCar
 ){

  document.getElementById(
   "carhp"
  ).textContent=
   Math.max(
    0,
    Math.floor(
     currentCar.userData.health
    )
   );

 }else{

  document.getElementById(
   "carhp"
  ).textContent="---";
 }

 if(!driving){

  const c=nearestCar();

  document.getElementById(
   "enter"
  ).style.display=
   c?"block":"none";
 }
}


/* =========================================================
   DEATH / BUST
========================================================= */

function checkDeath(){

 if(hp>0)return;

 hp=100;

 money=
  Math.max(
   0,
   money-200
  );

 wanted=0;

 wantedTimer=0;

 clearPolice();

 if(driving)
  exitCar();

 player.position.set(
  0,0,10
 );

 message(
  "💀 YOU DIED<br>-$200"
 );
}


/* =========================================================
   LOOP
========================================================= */

function loop(){

 requestAnimationFrame(loop);

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );

 if(fireHeld){

  fireTimer-=dt;

  if(
   fireTimer<=0
  ){

   shoot();

   fireTimer=
    currentWeapon().fireRate;
  }
 }

 walk(dt);
 drive(dt);

 updateTraffic(dt);
 updatePedestrians(dt);
 updateEnemies(dt);
 updatePolice(dt);
 updateHelicopters(dt);

 wantedSystem(dt);
 updateMission();
 updateDayNight(dt);

 checkDeath();

 updateUI();
 updateWeapon();

 updateCamera();
 drawMap();

 renderer.render(
  scene,
  camera
 );
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);


/* =========================================================
   START
========================================================= */

updateWeapon();

message(
 "WELCOME TO OPEN CITY V8"
);

loop();

}
</script>
