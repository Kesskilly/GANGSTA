<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Open City V2</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#78a9c8;
 font-family:Arial,sans-serif;
 touch-action:none
}
canvas{
 position:fixed;
 inset:0;
 display:block
}
#loading{
 position:fixed;
 inset:0;
 z-index:100;
 background:#101820;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:22px;
 font-weight:bold
}
#hud{
 position:fixed;
 left:8px;
 top:8px;
 z-index:20;
 color:white;
 background:#0009;
 padding:9px;
 border-radius:10px;
 text-shadow:2px 2px 3px #000;
 font-size:12px;
 line-height:20px
}
#hud b{font-size:18px}
#mission{color:#ffe45c}
#cross{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:white;
 font-size:26px;
 z-index:15;
 text-shadow:0 0 5px #000
}
#map{
 position:fixed;
 right:8px;
 top:8px;
 width:125px;
 height:125px;
 background:#172517;
 border:2px solid white;
 border-radius:10px;
 z-index:20
}
#joy{
 position:fixed;
 left:15px;
 bottom:15px;
 width:130px;
 height:130px;
 border:3px solid #ffffff88;
 border-radius:50%;
 background:#0005;
 z-index:30
}
#stick{
 position:absolute;
 width:55px;
 height:55px;
 left:35px;
 top:35px;
 border-radius:50%;
 background:#ffffffaa
}
#look{
 position:fixed;
 right:0;
 top:0;
 width:55%;
 height:70%;
 z-index:10
}
.buttons{
 position:fixed;
 right:8px;
 bottom:12px;
 z-index:30;
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 justify-content:flex-end;
 width:250px
}
button{
 width:60px;
 height:60px;
 border-radius:50%;
 border:2px solid #ffffff88;
 background:#000b;
 color:white;
 font-weight:bold;
 font-size:10px
}
#fire{background:#a40000ee}
#gas{background:#087d42}
#brake{background:#8b3907}
#enter{background:#086fd1;display:none}
#exit{background:#8b1515;display:none}
#msg{
 position:fixed;
 left:50%;
 top:40%;
 transform:translate(-50%,-50%);
 z-index:50;
 color:white;
 font-size:22px;
 font-weight:bold;
 text-align:center;
 text-shadow:2px 2px 6px #000;
 display:none
}
</style>
</head>

<body>

<div id="loading">LOADING OPEN CITY V2...</div>

<div id="hud">
<b>OPEN CITY V2</b><br>
❤️ <span id="hp">100</span>
&nbsp; 💵 $<span id="money">500</span><br>
🔫 <span id="ammo">30</span>
&nbsp; ⭐ <span id="wanted">0</span><br>
🚓 <span id="police">0</span>
&nbsp; 🕐 <span id="clock">08:00</span><br>
<span id="mission">MISSION: Reach the blue marker</span>
</div>

<canvas id="map" width="125" height="125"></canvas>

<div id="cross">+</div>
<div id="msg"></div>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="look"></div>

<div class="buttons" id="walkButtons">
 <button id="fire">FIRE</button>
 <button id="run">RUN</button>
 <button id="jump">JUMP</button>
 <button id="enter">ENTER</button>
</div>

<div class="buttons" id="driveButtons" style="display:none">
 <button id="gas">GAS</button>
 <button id="brake">BRAKE</button>
 <button id="exit">EXIT</button>
</div>

<script>

const three=document.createElement("script");

three.src=
"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js";

three.onload=start;

three.onerror=()=>{
 document.getElementById("loading").innerHTML=
 "THREE.JS FAILED TO LOAD<br><br>"+
 "<small>Check your internet connection and reload.</small>";
};

document.head.appendChild(three);


function start(){

const T=THREE;


/* =========================
   SCENE
========================= */

const scene=new T.Scene();

scene.background=
new T.Color(0x78a9c8);

scene.fog=
new T.Fog(0x78a9c8,90,330);


/* CAMERA */

const camera=
new T.PerspectiveCamera(
65,
innerWidth/innerHeight,
0.1,
600
);


/* RENDERER */

let renderer;

try{

 renderer=
 new T.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
 });

}catch(e){

 document.getElementById("loading").innerHTML=
 "3D GRAPHICS NOT AVAILABLE<br><br>"+
 "<small>Try Chrome on a device with WebGL enabled.</small>";

 return;

}

renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x78a9c8,1);

renderer.domElement.style.position="fixed";
renderer.domElement.style.left="0";
renderer.domElement.style.top="0";
renderer.domElement.style.zIndex="0";

document.body.insertBefore(
 renderer.domElement,
 document.body.firstChild
);


/* =========================
   LIGHT
========================= */

scene.add(
 new T.HemisphereLight(
  0xffffff,
  0x405040,
  1.8
 )
);

const sun=
new T.DirectionalLight(
 0xffffff,
 1.5
);

sun.position.set(100,150,80);

scene.add(sun);


/* =========================
   HELPERS
========================= */

function material(color){

 return new T.MeshStandardMaterial({
  color:color,
  roughness:.8
 });

}


function box(
 w,h,d,
 color,
 x,y,z,
 parent=scene
){

 const m=
 new T.Mesh(
  new T.BoxGeometry(w,h,d),
  material(color)
 );

 m.position.set(x,y,z);

 parent.add(m);

 return m;

}


function distance(a,b){

 return Math.hypot(
  a.position.x-b.position.x,
  a.position.z-b.position.z
 );

}


/* =========================
   GROUND
========================= */

const ground=
new T.Mesh(
 new T.PlaneGeometry(500,500),
 material(0x39783c)
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* =========================
   ROADS
========================= */

for(let p=-160;p<=160;p+=40){

 box(
  13,.1,500,
  0x292c30,
  p,.05,0
 );

 box(
  500,.1,13,
  0x292c30,
  0,.05,p
 );

}


/* =========================
   BUILDINGS
========================= */

let seed=42;

function random(){

 seed=(seed*9301+49297)%233280;

 return seed/233280;

}


for(let x=-220;x<=220;x+=40){

 for(let z=-220;z<=220;z+=40){

  if(
   Math.abs(x)<25 &&
   Math.abs(z)<25
  ) continue;

  if(random()<.75){

   const w=13+random()*9;
   const d=13+random()*9;
   const h=12+random()*28;

   const colors=[
    0x646b72,
    0x806d60,
    0x52677a,
    0x765d73
   ];

   box(
    w,h,d,
    colors[Math.floor(random()*colors.length)],
    x+(random()-.5)*7,
    h/2,
    z+(random()-.5)*7
   );

  }

 }

}


/* =========================
   TREES
========================= */

function tree(x,z){

 const g=new T.Group();

 g.position.set(x,0,z);

 box(
  .8,4,.8,
  0x58391e,
  0,2,0,g
 );

 const crown=
 new T.Mesh(
  new T.SphereGeometry(
   2.8,8,6
  ),
  material(0x24752d)
 );

 crown.position.y=5;

 g.add(crown);

 scene.add(g);

}

for(let i=0;i<30;i++){

 tree(
  (random()-.5)*430,
  (random()-.5)*430
 );

}


/* =========================
   MISSION MARKER
========================= */

const marker=
new T.Mesh(
 new T.CylinderGeometry(
  4,4,.25,20
 ),
 new T.MeshBasicMaterial({
  color:0x008cff
 })
);

marker.position.set(55,.2,55);

scene.add(marker);


/* =========================
   HUMAN
========================= */

function human(
 shirt=0x2459a6,
 skin=0xc98b63,
 pants=0x202532
){

 const g=new T.Group();

 const S=material(skin);
 const C=material(shirt);
 const P=material(pants);
 const B=material(0x111111);


 /* torso */

 const torso=
 new T.Mesh(
  new T.BoxGeometry(
   1.35,1.65,.72
  ),
  C
 );

 torso.position.y=2.55;

 g.add(torso);


 /* neck */

 const neck=
 new T.Mesh(
  new T.CylinderGeometry(
   .22,.22,.25,8
  ),
  S
 );

 neck.position.y=3.45;

 g.add(neck);


 /* head */

 const head=
 new T.Mesh(
  new T.SphereGeometry(
   .53,12,10
  ),
  S
 );

 head.position.y=4.05;

 g.add(head);


 /* hair */

 const hair=
 new T.Mesh(
  new T.SphereGeometry(
   .55,10,8,0,6.28,0,1.6
  ),
  B
 );

 hair.position.y=4.16;

 g.add(hair);


 /* arms */

 const leftArm=
 box(
  .34,.82,.34,
  shirt,
  -.9,3.15,0,g
 );

 const rightArm=
 box(
  .34,.82,.34,
  shirt,
  .9,3.15,0,g
 );


 /* lower arms */

 const leftLower=
 box(
  .3,.78,.3,
  skin,
  -.9,2.35,0,g
 );

 const rightLower=
 box(
  .3,.78,.3,
  skin,
  .9,2.35,0,g
 );


 /* legs */

 const leftLeg=
 box(
  .43,1.8,.43,
  pants,
  -.42,.8,0,g
 );

 const rightLeg=
 box(
  .43,1.8,.43,
  pants,
  .42,.8,0,g
 );


 /* shoes */

 box(
  .45,.3,.75,
  0x111111,
  -.42,-.15,-.12,g
 );

 box(
  .45,.3,.75,
  0x111111,
  .42,-.15,-.12,g
 );


 g.userData={
  leftArm,
  rightArm,
  leftLower,
  rightLower,
  leftLeg,
  rightLeg,
  time:Math.random()*10,
  moving:false,
  running:false
 };


 return g;

}


/* =========================
   PLAYER
========================= */

const player=
human(
 0x2459a6,
 0xc98b63,
 0x202532
);

player.position.set(0,0,10);

scene.add(player);


/* gun */

const gun=
box(
 .22,.22,1.25,
 0x111111,
 .72,2.65,-.65,
 player
);


/* =========================
   CARS
========================= */

const cars=[];

function createCar(
 x,z,color
){

 const g=new T.Group();

 g.position.set(x,0,z);

 g.userData={
  speed:0,
  health:100,
  stolen:false
 };


 box(
  4.4,1.05,7,
  color,
  0,1,0,g
 );


 box(
  3.1,1.05,3.1,
  0x20262b,
  0,1.8,.3,g
 );


 for(
  let sx of [-2.1,2.1]
 ){

  for(
   let sz of [-2.2,2.2]
  ){

   const wheel=
   new T.Mesh(
    new T.CylinderGeometry(
     .72,.72,.45,10
    ),
    material(0x111111)
   );

   wheel.rotation.z=
   Math.PI/2;

   wheel.position.set(
    sx,.65,sz
   );

   g.add(wheel);

  }

 }


 scene.add(g);

 cars.push(g);

 return g;

}


createCar(
 20,5,0xd52e2e
);

createCar(
 -30,-25,0x2865c9
);

createCar(
 55,40,0xd4a727
);

createCar(
 -60,25,0xffffff
);

createCar(
 100,-50,0x25a65b
);


/* =========================
   TRAFFIC
========================= */

const traffic=[];

for(let i=0;i<10;i++){

 const horizontal=i%2===0;

 const lane=
 (Math.floor(random()*8)-4)*40;

 const c=
 createCar(
  horizontal?
   (random()-.5)*430:
   lane,

  horizontal?
   lane:
   (random()-.5)*430,

  [
   0xe23a3a,
   0x3366dd,
   0xe4c936,
   0xffffff,
   0x32a66a
  ][i%5]
 );

 c.userData.traffic=true;
 c.userData.horizontal=horizontal;
 c.userData.speed=.06+random()*.05;

 traffic.push(c);

}


/* =========================
   PEOPLE
========================= */

const people=[];

for(let i=0;i<18;i++){

 const p=
 human(
  [
   0xb73535,
   0x315ca8,
   0x2d8247,
   0xb47a25,
   0x733b8c
  ][i%5],
  [
   0xc98b63,
   0xb87955,
   0x9a654b
  ][i%3],
  [
   0x222222,
   0x343b45,
   0x171717
  ][i%3]
 );

 p.position.set(
  (random()-.5)*420,
  0,
  (random()-.5)*420
 );

 p.userData.dx=random()-.5;
 p.userData.dz=random()-.5;
 p.userData.walkSpeed=.7+random();

 scene.add(p);

 people.push(p);

}


/* =========================
   ENEMIES
========================= */

const enemies=[];

function createEnemy(x,z){

 const e=
 human(
  0x741515,
  0xb87955,
  0x181818
 );

 e.position.set(x,0,z);

 e.userData.hp=100;
 e.userData.cool=0;
 e.userData.enemy=true;

 scene.add(e);

 enemies.push(e);

}

createEnemy(35,15);
createEnemy(-35,-10);
createEnemy(55,-35);
createEnemy(-55,45);
createEnemy(65,65);


/* =========================
   POLICE
========================= */

const police=[];

function createPolice(){

 if(police.length>=wanted)return;

 const a=Math.random()*Math.PI*2;
 const d=60;

 const x=
 player.position.x+
 Math.cos(a)*d;

 const z=
 player.position.z+
 Math.sin(a)*d;

 const car=
 createCar(
  x,z,0xffffff
 );

 car.userData.police=true;

 const officer=
 human(
  0x18212d,
  0xb87955,
  0x10151d
 );

 officer.position.copy(
  car.position
 );

 officer.userData.police=true;

 scene.add(officer);

 police.push({
  car,
  officer,
  cool:0
 });

}


/* =========================
   STATE
========================= */

let hp=100;
let money=500;
let wanted=0;

let ammo=30;

let driving=false;
let currentCar=null;

let joyX=0;
let joyY=0;

let running=false;
let gas=false;
let brake=false;

let camAngle=0;

let jumpVelocity=0;
let onGround=true;

let fireHeld=false;
let fireCooldown=0;

let gameTime=8;

let mission=0;
let kills=0;


/* =========================
   WEAPON
========================= */

const raycaster=
new T.Raycaster();

function shoot(){

 if(driving)return;

 if(ammo<=0){

  showMessage("OUT OF AMMO");

  return;

 }

 ammo--;

 wanted=
 Math.min(5,wanted+1);

 player.userData.moving=false;

 raycaster.setFromCamera(
  new T.Vector2(0,0),
  camera
 );

 const targets=[
  ...enemies,
  ...police.map(p=>p.officer)
 ];

 const hits=
 raycaster.intersectObjects(
  targets,
  true
 );

 if(hits.length){

  let o=hits[0].object;

  while(
   o.parent &&
   !o.userData.enemy &&
   !o.userData.police
  ){

   o=o.parent;

  }

  if(o.userData.enemy){

   o.userData.hp-=40;

   if(o.userData.hp<=0){

    scene.remove(o);

    const i=enemies.indexOf(o);

    if(i>=0)
    enemies.splice(i,1);

    money+=100;

    kills++;

    showMessage("+$100");

   }

  }

 }

 updateUI();

}


/* =========================
   CAR ENTER
========================= */

function nearbyCar(){

 let best=null;
 let bestDistance=8;

 for(const c of cars){

  if(c.userData.traffic)continue;
  if(c.userData.police)continue;
  if(c.userData.stolen)continue;

  const d=
  distance(player,c);

  if(d<bestDistance){

   bestDistance=d;
   best=c;

  }

 }

 return best;

}


function enterCar(){

 if(driving)return;

 const c=nearbyCar();

 if(!c){

  showMessage("NO CAR NEARBY");

  return;

 }

 currentCar=c;
 driving=true;

 c.userData.stolen=true;

 player.visible=false;

 document.getElementById(
  "walkButtons"
 ).style.display="none";

 document.getElementById(
  "driveButtons"
 ).style.display="flex";

 wanted=
 Math.min(5,wanted+1);

 showMessage("CAR STOLEN!");

}


/* =========================
   EXIT CAR
========================= */

function exitCar(){

 if(!driving)return;

 const c=currentCar;

 player.position.set(
  c.position.x+
  Math.cos(c.rotation.y)*5,

  0,

  c.position.z-
  Math.sin(c.rotation.y)*5
 );

 player.visible=true;

 currentCar=null;

 driving=false;

 document.getElementById(
  "walkButtons"
 ).style.display="flex";

 document.getElementById(
  "driveButtons"
 ).style.display="none";

}


/* =========================
   CAR DRIVING
========================= */

function driveCar(dt){

 if(!driving)return;

 const c=currentCar;

 let throttle=0;

 if(gas)throttle=1;
 if(brake)throttle=-1;

 c.userData.speed+=
 throttle*.7*dt;

 c.userData.speed*=
 Math.pow(.94,dt*60);

 c.userData.speed=
 Math.max(
  -.22,
  Math.min(
   .55,
   c.userData.speed
  )
 );


 c.rotation.y+=
 joyX*
 .05*
 Math.min(
  1,
  Math.abs(c.userData.speed)*3
 )*
 Math.sign(c.userData.speed);


 c.position.x+=
 Math.sin(c.rotation.y)*
 c.userData.speed*
 dt*60;

 c.position.z+=
 Math.cos(c.rotation.y)*
 c.userData.speed*
 dt*60;


 c.position.x=
 Math.max(
  -245,
  Math.min(245,c.position.x)
 );

 c.position.z=
 Math.max(
  -245,
  Math.min(245,c.position.z)
 );

}


/* =========================
   WALK
========================= */

function walk(dt){

 if(driving)return;

 let f=-joyY;
 let s=joyX;

 const len=Math.hypot(f,s);

 if(len>1){

  f/=len;
  s/=len;

 }

 const speed=
 running?8:4.5;

 const x=
 Math.sin(camAngle)*f+
 Math.cos(camAngle)*s;

 const z=
 Math.cos(camAngle)*f-
 Math.sin(camAngle)*s;

 const moving=
 Math.abs(x)+Math.abs(z)>.05;

 player.userData.moving=moving;
 player.userData.running=running;

 if(moving){

  player.position.x+=
  x*speed*dt;

  player.position.z+=
  z*speed*dt;

  player.rotation.y=
  Math.atan2(x,z);

 }

 player.position.x=
 Math.max(
  -245,
  Math.min(245,player.position.x)
 );

 player.position.z=
 Math.max(
  -245,
  Math.min(245,player.position.z)
 );


 /* jump */

 if(!onGround){

  jumpVelocity-=12*dt;

  player.position.y+=
  jumpVelocity*dt;

  if(player.position.y<=0){

   player.position.y=0;
   jumpVelocity=0;
   onGround=true;

  }

 }

}


/* =========================
   HUMAN ANIMATION
========================= */

function animateHuman(p,dt){

 const u=p.userData;

 u.time+=
 dt*
 (u.moving?
  (u.running?12:8):
  2
 );

 const s=
 Math.sin(u.time);

 const a=
 u.moving?
  (u.running?.7:.45):
  .02;

 u.leftLeg.rotation.x=
 s*a;

 u.rightLeg.rotation.x=
 -s*a;

 u.leftArm.rotation.x=
 -s*a*.8;

 u.rightArm.rotation.x=
 s*a*.8;

}


/* =========================
   PEOPLE UPDATE
========================= */

function updatePeople(dt){

 for(const p of people){

  const target=
  driving?
  currentCar:
  player;

  const d=
  distance(p,target);

  if(d<15){

   const dx=
   p.position.x-target.position.x;

   const dz=
   p.position.z-target.position.z;

   const l=
   Math.max(.1,Math.hypot(dx,dz));

   p.userData.dx=dx/l;
   p.userData.dz=dz/l;

   p.userData.walkSpeed=3;
   p.userData.running=true;

  }else{

   p.userData.running=false;

   if(Math.random()<.01){

    p.userData.dx=
    Math.random()-.5;

    p.userData.dz=
    Math.random()-.5;

   }

  }

  const l=
  Math.max(
   .1,
   Math.hypot(
    p.userData.dx,
    p.userData.dz
   )
  );

  p.position.x+=
  p.userData.dx/l*
  p.userData.walkSpeed*
  dt;

  p.position.z+=
  p.userData.dz/l*
  p.userData.walkSpeed*
  dt;

  p.rotation.y=
  Math.atan2(
   p.userData.dx,
   p.userData.dz
  );

  p.userData.moving=true;

  animateHuman(p,dt);

 }

}


/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies(dt){

 const target=
 driving?
 currentCar:
 player;

 for(const e of enemies){

  const dx=
  target.position.x-
  e.position.x;

  const dz=
  target.position.z-
  e.position.z;

  const d=
  Math.hypot(dx,dz);

  if(d<50){

   if(d>5){

    e.position.x+=
    dx/d*2.5*dt;

    e.position.z+=
    dz/d*2.5*dt;

    e.rotation.y=
    Math.atan2(dx,dz);

    e.userData.moving=true;
    e.userData.running=true;

   }else{

    e.userData.moving=false;

   }

  }

  animateHuman(e,dt);

 }

}


/* =========================
   POLICE UPDATE
========================= */

function updatePolice(dt){

 if(wanted<=0){

  for(const p of police){

   scene.remove(p.car);
   scene.remove(p.officer);

  }

  police.length=0;

  return;

 }


 while(police.length<wanted){

  createPolice();

 }


 const target=
 driving?
 currentCar:
 player;


 for(const p of police){

  const c=p.car;

  const dx=
  target.position.x-
  c.position.x;

  const dz=
  target.position.z-
  c.position.z;

  const d=
  Math.hypot(dx,dz);

  const desired=
  Math.atan2(dx,dz);

  let diff=
  desired-c.rotation.y;

  while(diff>Math.PI)
  diff-=Math.PI*2;

  while(diff<-Math.PI)
  diff+=Math.PI*2;

  c.rotation.y+=
  Math.max(
   -.05,
   Math.min(.05,diff)
  );

  c.userData.speed=
  Math.min(
   .5,
   c.userData.speed+
   dt*.3
  );

  c.position.x+=
  Math.sin(c.rotation.y)*
  c.userData.speed*
  dt*60;

  c.position.z+=
  Math.cos(c.rotation.y)*
  c.userData.speed*
  dt*60;

  p.officer.position.copy(
   c.position
  );

  p.officer.rotation.y=
  c.rotation.y;

  p.officer.userData.moving=true;
  p.officer.userData.running=false;

  animateHuman(
   p.officer,
   dt
  );


  if(d<9){

   p.cool-=dt;

   if(p.cool<=0){

    hp-=8;
    p.cool=1;

   }

  }

 }

}


/* =========================
   TRAFFIC
========================= */

function updateTraffic(dt){

 for(const c of traffic){

  if(c.userData.horizontal){

   c.position.x+=
   c.userData.speed*dt*60;

   if(c.position.x>245)
   c.position.x=-245;

  }else{

   c.position.z+=
   c.userData.speed*dt*60;

   if(c.position.z>245)
   c.position.z=-245;

  }

 }

}


/* =========================
   WANTED
========================= */

let escapeTimer=0;

function updateWanted(dt){

 if(wanted<=0)return;

 const target=
 driving?
 currentCar:
 player;

 let nearest=999;

 for(const p of police){

  nearest=
  Math.min(
   nearest,
   distance(target,p.car)
  );

 }

 if(nearest>70){

  escapeTimer+=dt;

 }else{

  escapeTimer=0;

 }

 if(escapeTimer>8){

  wanted--;

  escapeTimer=0;

  if(wanted===0){

   showMessage(
    "⭐ YOU ESCAPED!"
   );

  }

 }

}


/* =========================
   MISSIONS
========================= */

function updateMission(){

 if(mission===0){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Reach the blue marker";

  if(
   distance(player,marker)<7
  ){

   money+=250;
   mission=1;

   showMessage(
    "MISSION COMPLETE +$250"
   );

  }

 }

 else if(mission===1){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Steal a car";

  if(driving){

   money+=300;
   mission=2;

   showMessage(
    "MISSION COMPLETE +$300"
   );

  }

 }

 else if(mission===2){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Defeat 3 enemies ("+
   kills+
   "/3)";

  if(kills>=3){

   money+=500;
   kills=0;
   mission=3;

   showMessage(
    "MISSION COMPLETE +$500"
   );

  }

 }

 else if(mission===3){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Escape the police";

  if(wanted===0){

   money+=750;
   mission=0;

   marker.position.set(
    (Math.random()-.5)*180,
    .2,
    (Math.random()-.5)*180
   );

   showMessage(
    "MISSION COMPLETE +$750"
   );

  }

 }

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

 const target=
 driving?
 currentCar:
 player;

 const d=
 driving?11:9;

 camera.position.set(

  target.position.x-
  Math.sin(camAngle)*d,

  target.position.y+
  (driving?5.5:5.2),

  target.position.z-
  Math.cos(camAngle)*d

 );

 camera.lookAt(

  target.position.x,

  target.position.y+
  (driving?1.2:2),

  target.position.z

 );

}


/* =========================
   MAP
========================= */

const map=
document.getElementById("map");

const ctx=
map.getContext("2d");


function dot(x,z,color,size){

 const px=
 62.5+x/4;

 const py=
 62.5+z/4;

 if(
  px<0||
  px>125||
  py<0||
  py>125
 )return;

 ctx.fillStyle=color;

 ctx.beginPath();

 ctx.arc(
  px,py,size,
  0,Math.PI*2
 );

 ctx.fill();

}


function drawMap(){

 ctx.fillStyle="#162216";
 ctx.fillRect(
  0,0,125,125
 );

 ctx.fillStyle="#444";

 for(let p=-160;p<=160;p+=40){

  ctx.fillRect(
   62.5+p/4-2,
   0,
   4,125
  );

  ctx.fillRect(
   0,
   62.5+p/4-2,
   125,4
  );

 }

 dot(
  marker.position.x,
  marker.position.z,
  "#08f",
  4
 );

 for(const e of enemies){

  dot(
   e.position.x,
   e.position.z,
   "#f33",
   2
  );

 }

 for(const p of police){

  dot(
   p.car.position.x,
   p.car.position.z,
   "#fff",
   3
  );

 }

 const target=
 driving?
 currentCar:
 player;

 dot(
  target.position.x,
  target.position.z,
  "#0ff",
  4
 );

}


/* =========================
   UI
========================= */

function updateUI(){

 hp=
 Math.max(0,hp);

 document.getElementById(
  "hp"
 ).textContent=
 Math.floor(hp);

 document.getElementById(
  "money"
 ).textContent=
 Math.floor(money);

 document.getElementById(
  "ammo"
 ).textContent=
 ammo;

 document.getElementById(
  "wanted"
 ).textContent=
 wanted;

 document.getElementById(
  "police"
 ).textContent=
 police.length;

 const enter=
 document.getElementById("enter");

 if(!driving){

  enter.style.display=
  nearbyCar()?
  "block":
  "none";

 }

}


function showMessage(text){

 const m=
 document.getElementById("msg");

 m.textContent=text;
 m.style.display="block";

 clearTimeout(showMessage.timer);

 showMessage.timer=
 setTimeout(()=>{
  m.style.display="none";
 },1500);

}


/* =========================
   TIME
========================= */

function updateTime(dt){

 gameTime+=dt*.04;

 if(gameTime>=24)
 gameTime=0;

 const h=
 Math.floor(gameTime);

 const m=
 Math.floor(
  (gameTime-h)*60
 );

 document.getElementById(
  "clock"
 ).textContent=
 String(h).padStart(2,"0")+
 ":"+
 String(m).padStart(2,"0");

 const daylight=
 Math.max(
  0,
  Math.sin(
   (gameTime-6)*
   Math.PI/12
  )
 );

 sun.intensity=
 .3+
 daylight*1.7;

}


/* =========================
   JOYSTICK
========================= */

const joy=
document.getElementById("joy");

const stick=
document.getElementById("stick");


function setJoystick(x,y){

 const r=
 joy.getBoundingClientRect();

 let dx=
 x-r.left-r.width/2;

 let dy=
 y-r.top-r.height/2;

 const max=43;

 const len=
 Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;

 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
 `translate(${dx}px,${dy}px)`;

}


function resetJoystick(){

 joyX=0;
 joyY=0;

 stick.style.transform=
 "translate(0,0)";

}


joy.onpointerdown=e=>{

 joy.setPointerCapture(
  e.pointerId
 );

 setJoystick(
  e.clientX,
  e.clientY
 );

};

joy.onpointermove=e=>{

 setJoystick(
  e.clientX,
  e.clientY
 );

};

joy.onpointerup=
resetJoystick;

joy.onpointercancel=
resetJoystick;


/* =========================
   LOOK
========================= */

const look=
document.getElementById("look");

let looking=false;
let lastLookX=0;


look.onpointerdown=e=>{

 looking=true;

 lastLookX=e.clientX;

 look.setPointerCapture(
  e.pointerId
 );

};


look.onpointermove=e=>{

 if(!looking)return;

 camAngle-=
 (e.clientX-lastLookX)*
 .008;

 lastLookX=e.clientX;

};


look.onpointerup=()=>{
 looking=false;
};

look.onpointercancel=()=>{
 looking=false;
};

   BUTTONS
========================= */

};

document.getElementById(

/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener(
 "keydown",
 e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="e"){

   if(driving)
    exitCar();
   else
    enterCar();

  }

  if(e.key.toLowerCase()==="f")
   shoot();

  if(e.key===" ")
   document.getElementById(
    "jump"
   ).onpointerdown();

 }
);

addEventListener(
 "keyup",
 e=>{
  keys[e.key.toLowerCase()]=false;
 }
);


/* keyboard movement */

setInterval(()=>{

 if(keys.w)
  joyY=-1;

 else if(keys.s)
  joyY=1;

 else if(!joyX)
  joyY=0;

 if(keys.a)
  joyX=-1;

 else if(keys.d)
  joyX=1;

 else if(!joyY)
  joyX=0;

 running=!!keys.shift;

},30);


/* =========================
   LOOP
========================= */

const clock=
new T.Clock();


function loop(){

 requestAnimationFrame(loop);

 const dt=
 Math.min(
  clock.getDelta(),
  .05
 );

 walk(dt);

 driveCar(dt);

 updateTraffic(dt);

 updatePeople(dt);

 updateEnemies(dt);

 updatePolice(dt);

 updateWanted(dt);

 updateMission();

 updateTime(dt);

 updateCamera();

 drawMap();

 updateUI();

 marker.rotation.y+=
 dt*2;


 /* firing */

 if(fireHeld){

  fireCooldown-=dt;

  if(fireCooldown<=0){

   shoot();

   fireCooldown=.35;

  }

 }


 /* death */

 if(hp<=0){

  hp=100;
  money=
  Math.max(0,money-200);
  wanted=0;

  player.position.set(
   0,0,10
  );

  if(driving)
   exitCar();

  showMessage(
   "YOU DIED -$200"
  );

 }


 renderer.render(
  scene,
  camera
 );

}


/* =========================
   START
========================= */

document.getElementById(
 "loading"
).style.display="none";

showMessage(
 "WELCOME TO OPEN CITY V2"
);

updateUI();

loop();


/* resize */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);

}
