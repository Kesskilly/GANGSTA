function cube(
 w,h,d,
 color,
 x,y,z,
 parent=scene
){

  new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({
    color:color
   })
  );

 m.position.set(
  x,y,z
 );

 parent.add(m);

 return m;
}


function dist(a,b){

 return Math.hypot(
  a.position.x-b.position.x,
  a.position.z-b.position.z
 );
}

}

/* =========================================================
   CARS
========================================================= */

let cars=[];


function makeCar(
 x,z,
 color,
 rot=0,
 police=false,
 traffic=false
){

 let g=
  new THREE.Group();

 g.position.set(
  x,0,z
 );

 g.rotation.y=rot;

 g.userData.speed=0;
 g.userData.used=false;
 g.userData.police=police;
 g.userData.traffic=traffic;


 cube(
  4.3,
  1.1,
  7,
  police?0xffffff:color,
  0,1,0,
  g
 );


 cube(
  3.1,
  1,
  3,
  0x20252b,
  0,1.8,0,
  g
 );


 const wheelGeo=
  new THREE.CylinderGeometry(
   .7,.7,.45,12
  );


 for(
  let a of [-2.1,2.1]
 ){

  for(
   let b of [-2.2,2.2]
  ){

   let w=
    new THREE.Mesh(
     wheelGeo,
     new THREE.MeshStandardMaterial({
      color:0x111111
     })
    );

   w.rotation.z=
    Math.PI/2;

   w.position.set(
    a,.7,b
   );

   g.add(w);
  }
 }


 if(police){

  cube(
   .7,.25,1,
   0xff0000,
   -.5,2.5,0,
   g
  );

  cube(
   .7,.25,1,
   0x0000ff,
   .5,2.5,0,
   g
  );
 }


 scene.add(g);


 if(
  !police &&
  !traffic
 ){

  cars.push(g);
 }


 return g;
}

let traffic=[];


function createTraffic(){

 const colors=[
  0xff3333,
  0x3366ff,
  0xffff33,
  0xffffff,
  0x33aa66
 ];


 for(
  let i=0;
  i<12;
  i++
 ){

  let horizontal=
   i%2===0;

  let road=
   Math.floor(
    Math.random()*5-2
   )*40;


  let c=
   makeCar(
    horizontal?
     (Math.random()-.5)*180:
     road,

    horizontal?
     road:
     (Math.random()-.5)*180,

    colors[
     Math.floor(
      Math.random()*colors.length
     )
    ],

    horizontal?
     Math.PI/2:
     0,

    false,
    true
   );


  c.userData.speed=
   .05+Math.random()*.04;

  traffic.push(c);
 }
}


createTraffic();


function updateTraffic(){

 for(
  let c of traffic
 ){

  if(
   c.rotation.y===0
  ){

   c.position.z+=
    c.userData.speed;

   if(
    c.position.z>150
   )
    c.position.z=-150;

  }else{

   c.position.x+=
    c.userData.speed;

   if(
    c.position.x>150
   )
    c.position.x=-150;
  }
 }
}

 for(
  let p of pedestrians
 ){

  p.position.x+=
   p.userData.dx;

  p.position.z+=
   p.userData.dz;


  if(
   Math.abs(p.position.x)>150
  )
   p.userData.dx*=-1;


  if(
   Math.abs(p.position.z)>150
  )
   p.userData.dz*=-1;


  if(
   Math.random()<.01
  ){

   p.userData.dx=
    (Math.random()-.5)*.025;

   p.userData.dz=
    (Math.random()-.5)*.025;
  }
 }
}

let hp=100;
let money=500;
let wanted=0;

let driving=false;
let currentCar=null;

let joyX=0;
let joyY=0;
let joyActive=false;

let camAngle=0;

let velocityY=0;
let onGround=true;

let running=false;
let gas=false;
let brake=false;

let keys={};


/* =========================================================
   JOYSTICK
========================================================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");


function setJoy(x,y){

 const r=
  joy.getBoundingClientRect();

 let dx=
  x-r.left-r.width/2;

 let dy=
  y-r.top-r.height/2;

 const max=43;

 const len=
  Math.hypot(dx,dy);


 if(len>max){

  dx=
   dx/len*max;

  dy=
   dy/len*max;
 }


 joyX=
  dx/max;

 joyY=
  dy/max;


 stick.style.transform=
  "translate("+dx+"px,"+
  dy+"px)";
}


function resetJoy(){

 joyActive=false;

 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";
}


joy.addEventListener(
 "pointerdown",
 e=>{

  joyActive=true;

  joy.setPointerCapture(
   e.pointerId
  );

  setJoy(
   e.clientX,
   e.clientY
  );
 }
);


joy.addEventListener(
 "pointermove",
 e=>{

  if(joyActive)
   setJoy(
    e.clientX,
    e.clientY
   );
 }
);


joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);


/* =========================================================
   CAMERA LOOK
========================================================= */

const look=
 document.getElementById("look");

let looking=false;
let lastX=0;


look.addEventListener(
 "pointerdown",
 e=>{

  looking=true;

  lastX=e.clientX;

  look.setPointerCapture(
   e.pointerId
  );
 }
);


look.addEventListener(
 "pointermove",
 e=>{

  if(!looking)
   return;

  camAngle-=
   (e.clientX-lastX)*.008;

  lastX=e.clientX;
 }
);


look.addEventListener(
 "pointerup",
 ()=>looking=false
);

look.addEventListener(
 "pointercancel",
 ()=>looking=false
);


/* =========================================================
   WALKING
========================================================= */

function walk(){

 if(driving)
  return;


 let f=
  -joyY;

 let s=
  joyX;


 if(keys.w)
  f=1;

 if(keys.s)
  f=-1;

 if(keys.a)
  s=-1;

 if(keys.d)
  s=1;


 let x=
  Math.sin(camAngle)*f+
  Math.cos(camAngle)*s;


 let z=
  Math.cos(camAngle)*f-
  Math.sin(camAngle)*s;


 let len=
  Math.hypot(x,z);


 if(len>1){

  x/=len;
  z/=len;
 }


 let speed=
  running||keys.shift
   ? .18
   : .1;


 player.position.x+=
  x*speed;

 player.position.z+=
  z*speed;


 player.position.x=
  Math.max(
   -190,
   Math.min(
    190,
    player.position.x
   )
  );


 player.position.z=
  Math.max(
   -190,
   Math.min(
    190,
    player.position.z
   )
  );


 if(len>.1){

  player.rotation.y=
   Math.atan2(x,z);
 }


 velocityY-=.012;

 player.position.y+=
  velocityY;


 if(
  player.position.y<=0
 ){

  player.position.y=0;

  velocityY=0;

  onGround=true;
 }
}


/* =========================================================
   CAR
========================================================= */

function nearestCar(){

 let best=null;
 let bestDist=999;


 for(
  let c of cars
 ){

  if(c.userData.used)
   continue;


  let d=
   dist(player,c);


  if(d<bestDist){

   bestDist=d;
   best=c;
  }
 }


 return best;
}


function enterCar(){

 let c=
  nearestCar();


 if(!c)
  return;


 currentCar=c;

 driving=true;

 c.userData.used=true;

 player.visible=false;


 wanted=
  Math.min(
   5,
   wanted+1
  );


 document.getElementById(
  "buttons"
 ).style.display="none";


 document.getElementById(
  "drive"
 ).style.display="flex";


 showMsg(
  "CAR STOLEN<br>WANTED +1"
 );


 checkMission("car");
}


function exitCar(){

 if(!currentCar)
  return;


 let c=
  currentCar;


 c.userData.used=false;


 player.position.set(
  c.position.x+
   Math.cos(c.rotation.y)*5,
  0,
  c.position.z-
   Math.sin(c.rotation.y)*5
 );


 player.visible=true;

 currentCar=null;

 driving=false;


 document.getElementById(
  "drive"
 ).style.display="none";


 document.getElementById(
  "buttons"
 ).style.display="flex";
}


function drive(){

 if(!driving)
  return;


 let c=
  currentCar;


 let throttle=0;


 if(
  gas||
  keys.w
 )
  throttle=1;


 if(
  brake||
  keys.s
 )
  throttle=-1;


 c.userData.speed+=
  throttle*.012;


 c.userData.speed*=.985;


 c.userData.speed=
  Math.max(
   -.18,
   Math.min(
    .42,
    c.userData.speed
   )
  );


 let steer=
  joyX;


 if(keys.a)
  steer=-1;

 if(keys.d)
  steer=1;


 if(
  Math.abs(
   c.userData.speed
  )>.005
 ){

  c.rotation.y+=
   steer*.035*
   Math.min(
    1,
    Math.abs(
     c.userData.speed
    )*4
   )*
   Math.sign(
    c.userData.speed
   );
 }


 c.position.x+=
  Math.sin(c.rotation.y)*
  c.userData.speed;


 c.position.z+=
  Math.cos(c.rotation.y)*
  c.userData.speed;


 c.position.x=
  Math.max(
   -190,
   Math.min(
    190,
    c.position.x
   )
  );


 c.position.z=
  Math.max(
   -190,
   Math.min(
    190,
    c.position.z
   )
  );
}


/* =========================================================
   SHOOTING
========================================================= */

const raycaster=
 new THREE.Raycaster();


function shoot(){

 if(driving)
  return;


 const w=
  currentWeapon();


 if(w.ammo<=0){

  showMsg(
   "OUT OF AMMO"
  );

  return;
 }


 w.ammo--;

 wanted=
  Math.min(
   5,
   wanted+1
  );


 raycaster.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );


 let targets=[];


 for(
  let e of enemies
 ){

  if(!e.userData.dead)
   targets.push(e);
 }


 for(
  let p of police
 ){

  targets.push(
   p.officer
  );
 }


 let hits=
  raycaster.intersectObjects(
   targets,
   true
  );


 if(hits.length){

  let obj=
   hits[0].object;


  while(
   obj.parent &&
   !obj.userData.enemyRoot
  ){

   obj=obj.parent;
  }


  if(
   obj.userData.enemyRoot
  ){

   if(
    obj.userData.type===
    "enemy"
   ){

    obj.userData.hp-=
     w.damage;


    if(
     obj.userData.hp<=0
    )
     killEnemy(obj);
   }


   if(
    obj.userData.type===
    "police"
   ){

    wanted=5;

    showMsg(
     "POLICE HIT"
    );
   }
  }
 }


 updateWeapon();
}


/* =========================================================
   ENEMY AI
========================================================= */

let missionKills=0;


function killEnemy(e){

 if(e.userData.dead)
  return;


 e.userData.dead=true;

 money+=100;

 missionKills++;


 e.traverse(
  o=>{

   if(o.isMesh)
    o.material.color.set(
     0x111111
    );
  }
 );


 setTimeout(
  ()=>{

   scene.remove(e);

   let i=
    enemies.indexOf(e);

   if(i>=0)
    enemies.splice(i,1);

  },
  400
 );


 checkMission("enemy");
}


function updateEnemies(){

 for(
  let e of enemies
 ){

  if(e.userData.dead)
   continue;


  let d=
   dist(player,e);


  if(d<35){

   let dx=
    player.position.x-
    e.position.x;


   let dz=
    player.position.z-
    e.position.z;


   let len=
    Math.hypot(
     dx,dz
    );


   if(len>5){

    e.position.x+=
     dx/len*.035;

    e.position.z+=
     dz/len*.035;
   }


   e.userData.cool--;


   if(
    d<6 &&
    e.userData.cool<=0
   ){

    hp-=8;

    e.userData.cool=60;
   }
  }
 }
}


/* =========================================================
   POLICE
========================================================= */

function updatePolice(){

 if(wanted<=0){

  for(
   let p of police
  ){

   scene.remove(
    p.car
   );

   scene.remove(
    p.officer
   );
  }


  police.length=0;

  return;
 }


 while(
  police.length<wanted
 ){

  spawnPolice();
 }


 for(
  let p of police
 ){

  let c=
   p.car;


  let dx=
   player.position.x-
   c.position.x;


  let dz=
   player.position.z-
   c.position.z;


  let d=
   Math.hypot(
    dx,dz
   );


  let target=
   Math.atan2(
    dx,dz
   );


  let diff=
   Math.atan2(
    Math.sin(
     target-c.rotation.y
    ),
    Math.cos(
     target-c.rotation.y
    )
   );


  c.rotation.y+=
   Math.max(
    -.035,
    Math.min(
     .035,
     diff
    )
   );


  c.userData.speed+=
   .008;

  c.userData.speed*=.99;


  c.userData.speed=
   Math.min(
    .32,
    c.userData.speed
   );


  c.position.x+=
   Math.sin(c.rotation.y)*
   c.userData.speed;


  c.position.z+=
   Math.cos(c.rotation.y)*
   c.userData.speed;


  p.officer.position.set(
   c.position.x,
   0,
   c.position.z
  );


  p.officer.userData.cool--;


  if(
   d<12 &&
   p.officer.userData.cool<=0
  ){

   hp-=5;

   p.officer.userData.cool=45;


   if(hp<=0){

    hp=100;

    wanted=0;

    player.position.set(
     0,0,10
    );

    showMsg(
     "BUSTED"
    );
   }
  }
 }
}


/* =========================================================
   HELICOPTER
========================================================= */

function updateHelicopters(){

 if(wanted>=4)
  spawnHelicopter();


 if(wanted<4){

  for(
   let h of helicopters
  )
   scene.remove(h);


  helicopters.length=0;

  return;
 }


 for(
  let h of helicopters
 ){

  let dx=
   player.position.x-
   h.position.x;


  let dz=
   player.position.z-
   h.position.z;


  h.position.x+=
   dx*.008;


  h.position.z+=
   dz*.008;


  h.userData.rotor.rotation.y+=
   .4;


  h.userData.cool--;


  if(
   Math.hypot(dx,dz)<25 &&
   h.userData.cool<=0
  ){

   hp-=10;

   h.userData.cool=80;
  }
 }
}


/* =========================================================
   MISSIONS
========================================================= */

let missionIndex=0;


const missions=[
 "Reach the blue marker",
 "Steal a car",
 "Defeat 3 enemies",
 "Escape the police",
 "Reach the green marker"
];


const marker=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   3,3,.3,24
  ),
  new THREE.MeshStandardMaterial({
   color:0x0088ff
  })
 );


marker.position.set(
 55,.2,55
);

scene.add(marker);


function checkMission(type){

 if(
  missionIndex===1 &&
  type==="car"
 ){

  money+=300;

  missionIndex++;

  showMsg(
   "MISSION COMPLETE<br>+$300"
  );
 }


 if(
  missionIndex===2 &&
  type==="enemy" &&
  missionKills>=3
 ){

  money+=500;

  missionIndex++;

  missionKills=0;

  showMsg(
   "MISSION COMPLETE<br>+$500"
  );
 }


 if(
  missionIndex===3 &&
  type==="escape"
 ){

  money+=750;

  missionIndex++;

  marker.position.set(
   -55,.2,-55
  );

  marker.material.color.set(
   0x00ff55
  );

  showMsg(
   "MISSION COMPLETE<br>+$750"
  );
 }
}


function updateMission(){

 if(missionIndex===0){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Reach blue marker";


  if(
   dist(
    player,
    marker
   )<6
  ){

   money+=250;

   missionIndex++;

   showMsg(
    "MISSION COMPLETE<br>+$250"
   );
  }
 }


 else if(missionIndex===1){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Steal a car";
 }


 else if(missionIndex===2){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Defeat 3 enemies ("+
   missionKills+
   "/3)";
 }


 else if(missionIndex===3){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Escape police";


  if(
   wanted===0 &&
   missionKills===0
  ){

   missionKills=999;

   checkMission(
    "escape"
   );
  }
 }


 else if(missionIndex===4){

  document.getElementById(
   "mission"
  ).textContent=
   "MISSION: Reach green marker";


  if(
   dist(
    player,
    marker
   )<6
  ){

   money+=1500;

   missionIndex=0;

   missionKills=0;


   marker.position.set(
    (Math.random()-.5)*120,
    .2,
    (Math.random()-.5)*120
   );


   marker.material.color.set(
    0x0088ff
   );


   showMsg(
    "MISSION COMPLETE<br>+$1500"
   );
  }
 }
}

   WEAPON SHOP

function buyRifle(){

 if(weaponIndex===1){

  showMsg(
   "RIFLE EQUIPPED"
  );

  return;
 }


 if(money<1000){

  showMsg(
   "NEED $1000"
  );

  return;
 }


 money-=1000;

 weaponIndex=1;

 updateWeapon();


 showMsg(
  "RIFLE PURCHASED"
 );
}


/* =========================================================
   DAY NIGHT
========================================================= */

let gameTime=8;


function updateDayNight(){

 gameTime+=.002;


 if(gameTime>=24)
  gameTime=0;


 let daylight=
  Math.max(
   0,
   Math.sin(
    (gameTime-6)*
    Math.PI/12
   )
  );


 sun.intensity=
  .35+
  daylight*1.7;


 hemi.intensity=
  .4+
  daylight*1.3;


 let r=
  Math.floor(
   25+daylight*100
  );


 let g=
  Math.floor(
   45+daylight*140
  );


 let b=
  Math.floor(
   65+daylight*150
  );


 scene.background.setRGB(
  r/255,
  g/255,
  b/255
 );


 scene.fog.color.copy(
  scene.background
 );


 let hour=
  Math.floor(gameTime);


 let min=
  Math.floor(
   (gameTime-hour)*60
  );


 document.getElementById(
  "clock"
 ).textContent=
  String(hour).padStart(2,"0")+
  ":"+
  String(min).padStart(2,"0");
}


/* =========================================================
   SAVE LOAD
========================================================= */

function saveGame(){

 const save={
  hp:hp,
  money:money,
  wanted:wanted,
  weaponIndex:weaponIndex,
  ammo:weapons.map(
   w=>w.ammo
  ),
  missionIndex:missionIndex,
  missionKills:missionKills,
  playerX:player.position.x,
  playerZ:player.position.z,
  gameTime:gameTime
 };


 localStorage.setItem(
  "openCityV6Fixed",
  JSON.stringify(save)
 );


 showMsg(
  "GAME SAVED"
 );
}


function loadGame(){

 let raw=
  localStorage.getItem(
   "openCityV6Fixed"
  );


 if(!raw){

  showMsg(
   "NO SAVE FOUND"
  );

  return;
 }


 let s=
  JSON.parse(raw);


 hp=
  s.hp ?? 100;

 money=
  s.money ?? 500;

 wanted=
  s.wanted ?? 0;

 weaponIndex=
  s.weaponIndex ?? 0;


 if(s.ammo){

  for(
   let i=0;
   i<s.ammo.length;
   i++
  ){

   if(weapons[i])
    weapons[i].ammo=
     s.ammo[i];
  }
 }


 missionIndex=
  s.missionIndex ?? 0;

 missionKills=
  s.missionKills ?? 0;


 player.position.x=
  s.playerX ?? 0;


 player.position.z=
  s.playerZ ?? 10;


 gameTime=
  s.gameTime ?? 8;


 updateWeapon();


 showMsg(
  "GAME LOADED"
 );
}


document.getElementById(
 "save"
).addEventListener(
 "pointerdown",
 saveGame
);


document.getElementById(
 "load"
).addEventListener(
 "pointerdown",
 loadGame
);


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

 if(
  driving &&
  currentCar
 ){

  const c=
   currentCar;


  camera.position.x=
   c.position.x-
   Math.sin(camAngle)*9;


  camera.position.y=
   5.5;


  camera.position.z=
   c.position.z-
   Math.cos(camAngle)*9;


  camera.lookAt(
   c.position.x,
   1.3,
   c.position.z
  );

 }else{

  camera.position.x=
   player.position.x-
   Math.sin(camAngle)*9;


  camera.position.y=
   player.position.y+5.5;


  camera.position.z=
   player.position.z-
   Math.cos(camAngle)*9;


  camera.lookAt(
   player.position.x,
   player.position.y+2,
   player.position.z
  );
 }
}


/* =========================================================
   MINIMAP
========================================================= */

const map=
 document.getElementById("map");

const ctx=
 map.getContext("2d");


function drawMap(){

 ctx.clearRect(
  0,0,120,120
 );


 ctx.fillStyle=
  "#172017";


 ctx.fillRect(
  0,0,120,120
 );


 ctx.strokeStyle=
  "#555";


 ctx.lineWidth=4;


 for(
  let x=-100;
  x<=100;
  x+=40
 ){

  let px=
   60+x/3;


  ctx.beginPath();

  ctx.moveTo(px,0);

  ctx.lineTo(px,120);

  ctx.stroke();
 }


 for(
  let z=-100;
  z<=100;
  z+=40
 ){

  let py=
   60+z/3;


  ctx.beginPath();

  ctx.moveTo(0,py);

  ctx.lineTo(120,py);

  ctx.stroke();
 }


 /* PLAYER */

 ctx.fillStyle=
  "#00ffff";


 let px=
  60+player.position.x/3;


 let py=
  60+player.position.z/3;


 ctx.beginPath();

 ctx.arc(
  px,py,4,0,Math.PI*2
 );

 ctx.fill();


 /* ENEMIES */

 ctx.fillStyle=
  "#ff3333";


 for(
  let e of enemies
 ){

  if(e.userData.dead)
   continue;


  let x=
   60+e.position.x/3;


  let y=
   60+e.position.z/3;


  ctx.beginPath();

  ctx.arc(
   x,y,3,0,Math.PI*2
  );

  ctx.fill();
 }


 /* POLICE */

 ctx.fillStyle=
  "#ffffff";


 for(
  let p of police
 ){

  let x=
   60+p.car.position.x/3;


  let y=
   60+p.car.position.z/3;


  ctx.beginPath();

  ctx.arc(
   x,y,3,0,Math.PI*2
  );

  ctx.fill();
 }


 /* PEDESTRIANS */

 ctx.fillStyle=
  "#ffaa00";


 for(
  let p of pedestrians
 ){

  let x=
   60+p.position.x/3;


  let y=
   60+p.position.z/3;


  ctx.fillRect(
   x-1,
   y-1,
   2,
   2
  );
 }


 /* MISSION */

 ctx.fillStyle=
  "#00ff55";


 let mx=
  60+marker.position.x/3;


 let my=
  60+marker.position.z/3;


 ctx.beginPath();

 ctx.arc(
  mx,my,4,0,Math.PI*2
 );

 ctx.fill();
}

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
 "keydown",
 e=>{

  keys[
   e.key.toLowerCase()
  ]=true;


  if(
   e.key===" " &&
   !driving &&
   onGround
  ){

   velocityY=.25;

   onGround=false;
  }


  if(
   e.key.toLowerCase()==="e"
  ){

   if(driving)
    exitCar();
   else
    enterCar();
  }


  if(
   e.key.toLowerCase()==="f"
  )
   shoot();


  if(
   e.key==="1"
  ){

   weaponIndex=0;

   updateWeapon();
  }


  if(
   e.key==="2"
  )
   buyRifle();


  if(
   e.key.toLowerCase()==="p"
  )
   saveGame();
 }
);


addEventListener(
 "keyup",
 e=>{

  keys[
   e.key.toLowerCase()
  ]=false;
 }
);


/* =========================================================
   WANTED SYSTEM
========================================================= */

let wantedTimer=0;


function wantedSystem(){

 if(wanted>0){

  wantedTimer++;


  if(
   wantedTimer>1200 &&
   police.length===0
  ){

   wanted--;

   wantedTimer=0;


   if(wanted===0){

    checkMission(
     "escape"
    );
   }
  }

 }else{

  wantedTimer=0;
 }
}
