<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>OPEN CITY V10 LITE</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#080b10;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:22px;
}

#loading small{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}

#stats{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,.65);
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  line-height:1.55;
}

#mission{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:270px;
  padding:7px;
  border-radius:10px;
  text-align:center;
  background:rgba(0,0,0,.65);
  font-size:12px;
}

#message{
  position:absolute;
  top:78px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  padding:9px 14px;
  border-radius:9px;
  opacity:0;
  transition:.15s;
  font-weight:bold;
  white-space:nowrap;
}

#wanted{
  color:#ffd400;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:18px;
  height:2px;
  top:8px;
}

#crosshair:after{
  width:2px;
  height:18px;
  left:8px;
}

#map{
  position:absolute;
  right:8px;
  bottom:8px;
  width:115px;
  height:115px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.65);
  background:#111;
}

#mapCanvas{
  width:100%;
  height:100%;
}

#joystick{
  position:absolute;
  left:14px;
  bottom:14px;
  width:118px;
  height:118px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.27);
  border:2px solid rgba(255,255,255,.4);
}

.btn{
  position:absolute;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(10,15,22,.78);
  border:2px solid rgba(255,255,255,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  font-size:10px;
  text-align:center;
  pointer-events:auto;
  touch-action:none;
}

.btn:active{
  background:rgba(90,100,110,.8);
}

#fire{
  right:18px;
  bottom:100px;
  width:72px;
  height:72px;
  background:rgba(160,30,25,.72);
}

#enter{
  right:92px;
  bottom:28px;
}

#use{
  right:18px;
  bottom:28px;
}

#weapon{
  right:92px;
  bottom:100px;
}

#brake{
  right:166px;
  bottom:28px;
}

#save{
  left:8px;
  top:125px;
  width:48px;
  height:34px;
  border-radius:8px;
}

#load{
  left:62px;
  top:125px;
  width:48px;
  height:34px;
  border-radius:8px;
}

#help{
  position:absolute;
  left:10px;
  bottom:140px;
  font-size:9px;
  color:#aaa;
}

@media(min-width:800px){
  #joystick,
  .btn{
    opacity:.7;
  }
}
</style>
</head>

<body>

<div id="loading">
  <b>OPEN CITY V10 LITE</b>
  <small>Starting low-performance mode...</small>
</div>

<div id="ui">

  <div id="stats">
    ❤️ <span id="health">100</span>
    &nbsp; 💰 $<span id="money">500</span><br>
    🔫 <span id="weaponText">PISTOL</span>
    &nbsp; <span id="ammo">12</span><br>
    🚗 <span id="speed">0</span> km/h<br>
    ⭐ <span id="wanted">☆☆☆☆☆</span>
  </div>

  <div id="mission">
    <b id="missionTitle">MISSION</b><br>
    <span id="missionText">Loading...</span>
  </div>

  <div id="message"></div>

  <div id="crosshair"></div>

  <div id="map">
    <canvas id="mapCanvas" width="115" height="115"></canvas>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="help">
    JOYSTICK = MOVE / DRIVE<br>
    FIRE = SHOOT<br>
    SWIPE = CAMERA
  </div>

  <div class="btn" id="fire">FIRE</div>
  <div class="btn" id="enter">ENTER</div>
  <div class="btn" id="use">USE</div>
  <div class="btn" id="weapon">WEAPON</div>
  <div class="btn" id="brake">BRAKE</div>
  <div class="btn" id="save">SAVE</div>
  <div class="btn" id="load">LOAD</div>

</div>


<script>

/* =========================================================
   THREE.JS
========================================================= */

(function(){

  const urls=[
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
    "https://unpkg.com/three@0.160.0/build/three.min.js"
  ];

  let i=0;

  function load(){

    if(i>=urls.length){

      document.getElementById("loading").innerHTML=
        "<b>THREE.JS FAILED</b>" +
        "<small>Check internet and reload the page.</small>";

      return;
    }

    const s=document.createElement("script");

    s.src=urls[i++];

    s.onload=function(){

      if(window.THREE){
        startGame();
      }else{
        load();
      }

    };

    s.onerror=function(){
      s.remove();
      load();
    };

    document.head.appendChild(s);
  }

  load();

})();


/* =========================================================
   GAME
========================================================= */

function startGame(){

const THREE=window.THREE;

document.getElementById("loading").style.display="none";


/* =========================================================
   RENDERER
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x75a9d4);

scene.fog=new THREE.Fog(
  0x75a9d4,
  75,
  260
);

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  450
);

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1)
);

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

renderer.toneMapping=
  THREE.NoToneMapping;

document.body.appendChild(
  renderer.domElement
);


/* =========================================================
   LIGHTS
========================================================= */

const hemi=new THREE.HemisphereLight(
  0xbfe5ff,
  0x34402b,
  1.4
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  1.5
);

sun.position.set(
  80,
  120,
  60
);

scene.add(sun);


/* =========================================================
   ARRAYS
========================================================= */

const obstacles=[];
const vehicles=[];
const traffic=[];
const pedestrians=[];
const enemies=[];
const police=[];
const effects=[];
const locations=[];

let currentCar=null;

let health=100;
let money=500;

let wanted=0;
let wantedTimer=0;

let rifleOwned=false;
let weaponIndex=0;
let ammo=12;

let mission=0;
let kills=0;

let gameTime=12;

let dead=false;

let joystickX=0;
let joystickY=0;

let firePressed=false;
let brakePressed=false;

let cameraYaw=0;
let cameraPitch=.2;

let messageTimer=0;

let lastShot=0;


/* =========================================================
   MATERIALS
========================================================= */

const grassMat=new THREE.MeshBasicMaterial({
  color:0x3f7137
});

const roadMat=new THREE.MeshBasicMaterial({
  color:0x292b2d
});

const sidewalkMat=new THREE.MeshBasicMaterial({
  color:0x888888
});

const buildingMats=[
  new THREE.MeshLambertMaterial({color:0x68747b}),
  new THREE.MeshLambertMaterial({color:0x806e5d}),
  new THREE.MeshLambertMaterial({color:0x536b78}),
  new THREE.MeshLambertMaterial({color:0x71697b}),
  new THREE.MeshLambertMaterial({color:0x77756e})
];

const blackMat=new THREE.MeshBasicMaterial({
  color:0x111111
});

const glassMat=new THREE.MeshBasicMaterial({
  color:0x35566b
});

const treeMat=new THREE.MeshBasicMaterial({
  color:0x286633
});

const trunkMat=new THREE.MeshBasicMaterial({
  color:0x65472d
});

const playerMat=new THREE.MeshBasicMaterial({
  color:0x2f75bd
});

const skinMat=new THREE.MeshBasicMaterial({
  color:0xb87958
});

const redMat=new THREE.MeshBasicMaterial({
  color:0xc52e2e
});

const policeMat=new THREE.MeshBasicMaterial({
  color:0x202832
});


/* =========================================================
   HELPERS
========================================================= */

function box(
  w,h,d,
  material,
  x=0,
  y=0,
  z=0
){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  m.position.set(x,y,z);

  scene.add(m);

  return m;
}


function sphere(
  r,
  material,
  x=0,
  y=0,
  z=0
){

  const m=new THREE.Mesh(
    new THREE.SphereGeometry(
      r,
      8,
      6
    ),
    material
  );

  m.position.set(x,y,z);

  scene.add(m);

  return m;
}


function distance(a,b){

  const dx=a.x-b.x;
  const dz=a.z-b.z;

  return Math.sqrt(
    dx*dx+dz*dz
  );
}


function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );
}


/* =========================================================
   GROUND
========================================================= */

box(
  500,
  .4,
  500,
  grassMat,
  0,
  -.25,
  0
);


/* =========================================================
   ROADS
========================================================= */

const roads=[];

for(let p=-200;p<=200;p+=50){

  roads.push(p);

  box(
    500,
    .06,
    13,
    roadMat,
    0,
    0,
    p
  );

  box(
    13,
    .06,
    500,
    roadMat,
    p,
    0,
    0
  );

  box(
    500,
    .08,
    2,
    sidewalkMat,
    0,
    .03,
    p-8
  );

  box(
    500,
    .08,
    2,
    sidewalkMat,
    0,
    .03,
    p+8
  );

  box(
    2,
    .08,
    500,
    sidewalkMat,
    p-8,
    .03,
    0
  );

  box(
    2,
    .08,
    500,
    sidewalkMat,
    p+8,
    .03,
    0
  );
}


/* =========================================================
   SIMPLE ROAD LINES
========================================================= */

const lineMat=new THREE.MeshBasicMaterial({
  color:0xd9bd36
});

for(let p=-200;p<=200;p+=50){

  for(let x=-230;x<230;x+=25){

    box(
      8,
      .025,
      .25,
      lineMat,
      x,
      .05,
      p
    );

  }

  for(let z=-230;z<230;z+=25){

    box(
      .25,
      .025,
      8,
      lineMat,
      p,
      .05,
      z
    );

  }
}


/* =========================================================
   BUILDINGS
========================================================= */

function addBuilding(
  x,z,w,d,h
){

  const material=
    buildingMats[
      Math.floor(
        Math.random()*buildingMats.length
      )
    ];

  box(
    w,
    h,
    d,
    material,
    x,
    h/2,
    z
  );

  obstacles.push({
    x:x,
    z:z,
    w:w,
    d:d
  });
}


/*
   Much smaller city:
   only a few buildings per block.
*/

for(let x=-175;x<=175;x+=50){

  for(let z=-175;z<=175;z+=50){

    if(
      Math.abs(x)<35 &&
      Math.abs(z)<35
    )
      continue;

    if(Math.random()<.22)
      continue;

    const w=
      14+Math.random()*8;

    const d=
      14+Math.random()*8;

    const h=
      8+Math.random()*20;

    addBuilding(
      x+(Math.random()-.5)*10,
      z+(Math.random()-.5)*10,
      w,d,h
    );
  }
}


/* =========================================================
   TREES
========================================================= */

function makeTree(x,z){

  box(
    .5,
    3,
    .5,
    trunkMat,
    x,
    1.5,
    z
  );

  sphere(
    2.2,
    treeMat,
    x,
    4,
    z
  );
}


for(let i=0;i<18;i++){

  const x=
    (Math.random()-.5)*400;

  const z=
    (Math.random()-.5)*400;

  makeTree(x,z);
}


/* =========================================================
   SPECIAL BUILDINGS
========================================================= */

function location(
  name,
  x,
  z,
  color
){

  box(
    14,
    7,
    12,
    new THREE.MeshBasicMaterial({
      color:color
    }),
    x,
    3.5,
    z
  );

  obstacles.push({
    x:x,
    z:z,
    w:14,
    d:12
  });

  locations.push({
    name:name,
    x:x,
    z:z
  });
}

location(
  "GARAGE",
  -50,
  -50,
  0x49545b
);

location(
  "HOSPITAL",
  50,
  -50,
  0xd3d3d3
);

location(
  "POLICE",
  50,
  50,
  0x3e5875
);

location(
  "SHOP",
  -50,
  50,
  0x714838
);


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Group();

scene.add(player);

const playerBody=box(
  1.4,
  1.8,
  .8,
  playerMat
);

playerBody.position.y=1.9;
player.remove(playerBody);
player.add(playerBody);

const playerHead=sphere(
  .55,
  skinMat
);

playerHead.position.y=3.2;

player.add(playerHead);

const legA=box(
  .35,
  1.3,
  .4,
  blackMat
);

legA.position.set(
  -.32,
  .65,
  0
);

player.add(legA);

const legB=legA.clone();

legB.position.x=.32;

player.add(legB);

player.position.set(
  0,
  0,
  0
);


/* =========================================================
   GUN
========================================================= */

const gun=new THREE.Group();

const gunBody=box(
  .18,
  .18,
  1,
  blackMat
);

gunBody.position.z=-.55;

gun.add(gunBody);

const muzzle=sphere(
  .12,
  new THREE.MeshBasicMaterial({
    color:0xffb52e
  })
);

muzzle.position.z=-1.1;

muzzle.visible=false;

gun.add(muzzle);

gun.position.set(
  .8,
  2.2,
  -.2
);

player.add(gun);


/* =========================================================
   RIFLE
========================================================= */

const rifle=new THREE.Group();

const rifleBody=box(
  .2,
  .22,
  1.7,
  blackMat
);

rifleBody.position.z=-.8;

rifle.add(rifleBody);

rifle.position.set(
  .8,
  2.2,
  -.2
);

rifle.visible=false;

player.add(rifle);


/* =========================================================
   CARS
========================================================= */

const carColors=[
  0xe03b32,
  0x2868a8,
  0xcdb72f,
  0x70407f,
  0x4d565c
];


function createCar(
  x,
  z,
  rotation=0,
  trafficCar=false,
  policeCar=false
){

  const car=new THREE.Group();

  car.position.set(
    x,
    0,
    z
  );

  car.rotation.y=rotation;


  const color=
    policeCar
      ? 0x20262e
      : carColors[
          Math.floor(
            Math.random()*carColors.length
          )
        ];


  const bodyMat=
    policeCar
      ? policeMat
      : new THREE.MeshBasicMaterial({
          color:color
        });


  const body=box(
    3.2,
    .8,
    5.5,
    bodyMat
  );

  body.position.y=1;

  car.remove(body);
  car.add(body);


  const roof=box(
    2.5,
    1.05,
    2.7,
    glassMat
  );

  roof.position.set(
    0,
    1.7,
    .2
  );

  car.remove(roof);
  car.add(roof);


  const wheelGeo=
    new THREE.CylinderGeometry(
      .55,
      .55,
      .35,
      8
    );

  const wheels=[];

  [
    [-1.55,.6,-1.7],
    [1.55,.6,-1.7],
    [-1.55,.6,1.7],
    [1.55,.6,1.7]
  ].forEach(p=>{

    const w=new THREE.Mesh(
      wheelGeo,
      blackMat
    );

    w.rotation.z=Math.PI/2;

    w.position.set(
      p[0],
      p[1],
      p[2]
    );

    car.add(w);

    wheels.push(w);

  });


  if(policeCar){

    const red=new THREE.Mesh(
      new THREE.BoxGeometry(
        .55,.18,.55
      ),
      new THREE.MeshBasicMaterial({
        color:0xff2222
      })
    );

    red.position.set(
      -.4,
      2.35,
      0
    );

    car.add(red);


    const blue=new THREE.Mesh(
      new THREE.BoxGeometry(
        .55,.18,.55
      ),
      new THREE.MeshBasicMaterial({
        color:0x2266ff
      })
    );

    blue.position.set(
      .4,
      2.35,
      0
    );

    car.add(blue);

  }


  car.userData={
    speed:0,
    maxSpeed:trafficCar?15:34,
    health:100,
    traffic:trafficCar,
    police:policeCar,
    wheels:wheels,
    destroyed:false
  };


  scene.add(car);

  if(policeCar){

    police.push(car);

  }else{

    vehicles.push(car);

    if(trafficCar)
      traffic.push(car);

  }

  return car;
}


/* parked cars */

for(let i=0;i<8;i++){

  const horizontal=
    Math.random()<.5;

  const road=
    roads[
      Math.floor(
        Math.random()*roads.length
      )
    ];

  let x,z,r;

  if(horizontal){

    x=(Math.random()-.5)*400;

    z=
      road+
      (Math.random()<.5?-5:5);

    r=
      Math.random()<.5
        ?0
        :Math.PI;

  }else{

    x=
      road+
      (Math.random()<.5?-5:5);

    z=(Math.random()-.5)*400;

    r=
      Math.random()<.5
        ?Math.PI/2
        :-Math.PI/2;
  }

  createCar(
    x,z,r,false,false
  );
}


/* traffic cars */

for(let i=0;i<8;i++){

  const horizontal=
    Math.random()<.5;

  const road=
    roads[
      Math.floor(
        Math.random()*roads.length
      )
    ];

  let x,z,r;

  if(horizontal){

    x=(Math.random()-.5)*400;

    z=road-3;

    r=0;

  }else{

    x=road+3;

    z=(Math.random()-.5)*400;

    r=Math.PI/2;

  }

  createCar(
    x,z,r,true,false
  );
}


/* =========================================================
   PEDESTRIANS
========================================================= */

function createPed(){

  const p=new THREE.Group();

  const b=box(
    .55,
    1.2,
    .4,
    new THREE.MeshBasicMaterial({
      color:
        Math.random()<.5
          ?0x3d70a0
          :0x9c4848
    })
  );

  b.position.y=1.55;

  p.remove(b);
  p.add(b);


  const h=sphere(
    .32,
    skinMat
  );

  h.position.y=2.45;

  p.add(h);


  p.position.set(
    (Math.random()-.5)*380,
    0,
    (Math.random()-.5)*380
  );


  p.userData={
    vx:(Math.random()-.5)*1.5,
    vz:(Math.random()-.5)*1.5,
    flee:0
  };


  scene.add(p);

  pedestrians.push(p);
}


for(let i=0;i<12;i++)
  createPed();


/* =========================================================
   ENEMIES
========================================================= */

function createEnemy(x,z){

  const e=new THREE.Group();

  const b=box(
    .75,
    1.5,
    .5,
    redMat
  );

  b.position.y=1.7;

  e.remove(b);
  e.add(b);


  const h=sphere(
    .38,
    skinMat
  );

  h.position.y=2.75;

  e.add(h);


  e.position.set(
    x,
    0,
    z
  );

  e.userData={
    health:100,
    dead:false,
    timer:0
  };

  scene.add(e);

  enemies.push(e);
}


createEnemy(55,55);
createEnemy(-55,55);
createEnemy(55,-55);
createEnemy(-55,-55);


/* =========================================================
   COLLISION
========================================================= */

function blocked(
  x,
  z,
  radius
){

  for(
    let i=0;
    i<obstacles.length;
    i++
  ){

    const o=obstacles[i];

    if(
      Math.abs(x-o.x)
        <=o.w/2+radius &&
      Math.abs(z-o.z)
        <=o.d/2+radius
    ){

      return true;
    }
  }

  return false;
}


function movePlayer(
  dx,
  dz
){

  const nx=
    player.position.x+dx;

  const nz=
    player.position.z+dz;


  if(
    !blocked(
      nx,
      player.position.z,
      .7
    )
  ){

    player.position.x=
      clamp(nx,-235,235);

  }


  if(
    !blocked(
      player.position.x,
      nz,
      .7
    )
  ){

    player.position.z=
      clamp(nz,-235,235);

  }
}


/* =========================================================
   CAR ENTER / EXIT
========================================================= */

function nearestCar(){

  let best=null;
  let bestD=8;

  for(
    let i=0;
    i<vehicles.length;
    i++
  ){

    const v=vehicles[i];

    if(v.userData.destroyed)
      continue;

    const d=
      distance(
        player.position,
        v.position
      );

    if(d<bestD){

      bestD=d;
      best=v;

    }
  }

  return best;
}


function enterExit(){

  if(dead){

    respawn();

    return;
  }


  if(currentCar){

    player.visible=true;

    player.position.copy(
      currentCar.position
    );

    player.position.x+=4;

    currentCar.userData.speed=0;

    currentCar=null;

    showMessage(
      "LEFT VEHICLE"
    );

    return;
  }


  const car=nearestCar();

  if(!car){

    showMessage(
      "NO VEHICLE NEARBY"
    );

    return;
  }


  currentCar=car;

  player.visible=false;

  wanted=
    Math.max(
      wanted,
      1
    );

  showMessage(
    "VEHICLE STOLEN"
  );
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(dead)
    return;

  const now=
    performance.now();

  const cooldown=
    weaponIndex===0
      ?300
      :150;

  if(
    now-lastShot<
    cooldown
  )
    return;

  lastShot=now;


  if(ammo<=0){

    showMessage(
      "NO AMMO"
    );

    return;
  }


  ammo--;


  if(weaponIndex===0){

    muzzle.visible=true;

    setTimeout(
      ()=>{
        muzzle.visible=false;
      },
      50
    );

  }


  const origin=
    new THREE.Vector3();

  camera.getWorldPosition(
    origin
  );


  const direction=
    new THREE.Vector3();

  camera.getWorldDirection(
    direction
  );


  const ray=
    new THREE.Raycaster(
      origin,
      direction,
      0,
      100
    );


  const targets=[];

  for(
    let i=0;
    i<enemies.length;
    i++
  ){

    if(
      !enemies[i].userData.dead
    ){

      targets.push(
        enemies[i]
      );

    }
  }


  for(
    let i=0;
    i<police.length;
    i++
  ){

    targets.push(
      police[i]
    );

  }


  const hits=
    ray.intersectObjects(
      targets,
      true
    );


  if(hits.length){

    let obj=
      hits[0].object;

    while(
      obj.parent &&
      !obj.userData.health
    ){

      obj=obj.parent;

    }


    if(obj.userData.health){

      obj.userData.health-=
        weaponIndex===0
          ?40
          :70;


      wanted=
        Math.max(
          wanted,
          2
        );


      if(
        obj.userData.health<=0
      ){

        if(obj.userData.police){

          obj.userData.destroyed=true;

          scene.remove(obj);

          const index=
            police.indexOf(obj);

          if(index>=0)
            police.splice(
              index,
              1
            );

          money+=100;

        }else{

          obj.userData.dead=true;

          scene.remove(obj);

          kills++;

          money+=100;

        }

        showMessage(
          "+$100"
        );
      }
    }
  }


  /* simple tracer */

  const end=
    origin.clone().add(
      direction.clone()
        .multiplyScalar(60)
    );


  const geometry=
    new THREE.BufferGeometry()
      .setFromPoints([
        origin,
        end
      ]);


  const line=
    new THREE.Line(
      geometry,
      new THREE.LineBasicMaterial({
        color:0xffdd66
      })
    );


  scene.add(line);


  setTimeout(
    ()=>{
      scene.remove(line);
      geometry.dispose();
    },
    50
  );


  /* pedestrians flee */

  for(
    let i=0;
    i<pedestrians.length;
    i++
  ){

    if(
      distance(
        player,
        pedestrians[i]
      )<35
    ){

      pedestrians[i]
        .userData.flee=4;

    }
  }

  updateUI();
}

/* =========================================================
   WALK
========================================================= */

function updateWalking(dt){

  if(currentCar)
    return;

  const speed=7;

  const x=
    joystickX*
    speed*
    dt;

  const z=
    joystickY*
    speed*
    dt;


  if(
    Math.abs(x)+
    Math.abs(z)>.02
  ){

    player.rotation.y=
      Math.atan2(
        x,
        z
      );

  }


  movePlayer(
    x,
    z
  );
}


/* =========================================================
   DRIVING
========================================================= */

function updateDriving(dt){

  if(!currentCar)
    return;

  const c=currentCar;

  const throttle=
    -joystickY;


  if(throttle>0){

    c.userData.speed+=
      24*
      throttle*
      dt;

  }else{

    c.userData.speed=
      THREE.MathUtils.lerp(
        c.userData.speed,
        0,
        dt*1.4
      );

  }


  if(brakePressed){

    c.userData.speed=
      THREE.MathUtils.lerp(
        c.userData.speed,
        0,
        dt*7
      );

  }


  c.userData.speed=
    clamp(
      c.userData.speed,
      -8,
      c.userData.maxSpeed
    );


  const steer=joystickX;


  c.rotation.y+=
    steer*
    dt*
    2*
    Math.min(
      1,
      Math.abs(
        c.userData.speed
      )/8
    );


  const step=
    c.userData.speed*
    dt;


  const nx=
    c.position.x+
    Math.sin(c.rotation.y)*
    step;

  const nz=
    c.position.z+
    Math.cos(c.rotation.y)*
    step;


  if(
    !blocked(
      nx,
      nz,
      2.5
    ) &&
    Math.abs(nx)<238 &&
    Math.abs(nz)<238
  ){

    c.position.x=nx;
    c.position.z=nz;

  }else{

    c.userData.health-=
      Math.abs(
        c.userData.speed
      )*
      dt*
      2;

    c.userData.speed*=-
      .25;

  }


  for(
    let i=0;
    i<c.userData.wheels.length;
    i++
  ){

    c.userData.wheels[i]
      .rotation.x-=step*2;

  }


  if(
    c.userData.health<=0
  ){

    explodeCar(c);

  }
}


/* =========================================================
   TRAFFIC
========================================================= */

function updateTraffic(dt){

  for(
    let i=0;
    i<traffic.length;
    i++
  ){

    const car=traffic[i];

    if(car.userData.destroyed)
      continue;


    const step=
      car.userData.maxSpeed*
      dt;


    car.position.x+=
      Math.sin(
        car.rotation.y
      )*step;

    car.position.z+=
      Math.cos(
        car.rotation.y
      )*step;


    if(
      car.position.x>240
    )
      car.position.x=-240;

    if(
      car.position.x<-240
    )
      car.position.x=240;

    if(
      car.position.z>240
    )
      car.position.z=-240;

    if(
      car.position.z<-240
    )
      car.position.z=240;


    if(
      currentCar &&
      distance(
        car,
        currentCar
      )<5
    ){

      currentCar.userData.health-=
        dt*10;

    }

  }
}


/* =========================================================
   PEDESTRIANS
========================================================= */

function updatePedestrians(dt){

  const target=
    currentCar||player;


  for(
    let i=0;
    i<pedestrians.length;
    i++
  ){

    const p=
      pedestrians[i];


    if(
      p.userData.flee>0
    ){

      p.userData.flee-=dt;


      const dx=
        p.position.x-
        target.position.x;

      const dz=
        p.position.z-
        target.position.z;


      const len=
        Math.max(
          .1,
          Math.sqrt(
            dx*dx+
            dz*dz
          )
        );


      p.position.x+=
        dx/len*
        4*
        dt;

      p.position.z+=
        dz/len*
        4*
        dt;

    }else{

      p.position.x+=
        p.userData.vx*
        dt;

      p.position.z+=
        p.userData.vz*
        dt;

    }


    if(
      Math.abs(
        p.position.x
      )>225
    ){

      p.userData.vx*=-1;

    }


    if(
      Math.abs(
        p.position.z
      )>225
    ){

      p.userData.vz*=-1;

    }

  }
}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(dt){

  const target=
    currentCar||player;


  for(
    let i=0;
    i<enemies.length;
    i++
  ){

    const e=enemies[i];

    if(e.userData.dead)
      continue;


    const dx=
      target.position.x-
      e.position.x;

    const dz=
      target.position.z-
      e.position.z;


    const d=
      Math.sqrt(
        dx*dx+
        dz*dz
      );


    if(
      d<55
    ){

      e.rotation.y=
        Math.atan2(
          dx,
          dz
        );


      if(
        d>12
      ){

        e.position.x+=
          dx/d*
          2.4*
          dt;

        e.position.z+=
          dz/d*
          2.4*
          dt;

      }


      e.userData.timer-=dt;


      if(
        d<28 &&
        e.userData.timer<=0
      ){

        e.userData.timer=
          1.5;

        health-=8;

        if(
          health<=0
        ){

          die();

        }

      }
    }
  }
}


/* =========================================================
   POLICE
========================================================= */

function spawnPolice(){

  if(
    police.length>=
    Math.min(
      wanted,
      3
    )
  )
    return;


  const target=
    currentCar||player;


  const a=
    Math.random()*
    Math.PI*2;


  const d=
    45+
    Math.random()*20;


  const x=
    target.position.x+
    Math.cos(a)*d;

  const z=
    target.position.z+
    Math.sin(a)*d;


  createCar(
    x,
    z,
    Math.atan2(
      target.position.x-x,
      target.position.z-z
    ),
    false,
    true
  );
}


function updatePolice(dt){

  if(wanted<=0){

    clearPolice();

    return;
  }


  spawnPolice();


  const target=
    currentCar||player;


  for(
    let i=0;
    i<police.length;
    i++
  ){

    const p=police[i];

    const dx=
      target.position.x-
      p.position.x;

    const dz=
      target.position.z-
      p.position.z;


    const d=
      Math.max(
        .1,
        Math.sqrt(
          dx*dx+
          dz*dz
        )
      );


    p.rotation.y=
      Math.atan2(
        dx,
        dz
      );


    if(
      d>6
    ){

      const speed=
        18*dt;


      const nx=
        p.position.x+
        Math.sin(
          p.rotation.y
        )*speed;

      const nz=
        p.position.z+
        Math.cos(
          p.rotation.y
        )*speed;


      if(
        !blocked(
          nx,
          nz,
          2.5
        )
      ){

        p.position.x=nx;
        p.position.z=nz;

      }

    }else{

      health-=
        dt*
        3;

      if(
        health<=0
      ){

        die();

      }

    }
  }
}


function clearPolice(){

  while(
    police.length
  ){

    const p=
      police.pop();

    scene.remove(p);

  }
}


/* =========================================================
   WANTED
========================================================= */

function updateWanted(dt){

  if(wanted<=0)
    return;


  const target=
    currentCar||player;


  let near=false;


  for(
    let i=0;
    i<police.length;
    i++
  ){

    if(
      distance(
        police[i],
        target
      )<55
    ){

      near=true;
      break;

    }
  }


  if(!near){

    wantedTimer+=dt;


    if(
      wantedTimer>8
    ){

      wanted--;

      wantedTimer=0;

      if(wanted===0){

        showMessage(
          "YOU ESCAPED"
        );

      }else{

        showMessage(
          "WANTED LEVEL DOWN"
        );

      }

    }

  }else{

    wantedTimer=0;

  }
}


/* =========================================================
   EXPLOSION
========================================================= */

function explodeCar(car){

  if(
    car.userData.destroyed
  )
    return;


  car.userData.destroyed=true;
  car.userData.speed=0;
  car.visible=false;


  const boom=sphere(
    1,
    new THREE.MeshBasicMaterial({
      color:0xff7b00,
      transparent:true,
      opacity:1
    }),
    car.position.x,
    1.5,
    car.position.z
  );


  effects.push({
    mesh:boom,
    time:0
  });


  if(
    currentCar===car
  ){

    currentCar=null;

    player.visible=true;

    player.position.copy(
      car.position
    );

    player.position.x+=4;

  }


  money=
    Math.max(
      0,
      money-50
    );


  wanted=
    Math.min(
      5,
      wanted+2
    );


  showMessage(
    "CAR DESTROYED"
  );


  if(
    car.userData.traffic
  ){

    setTimeout(
      ()=>{

        car.position.set(
          (Math.random()-.5)*400,
          0,
          (Math.random()-.5)*400
        );

        car.userData.health=100;
        car.userData.destroyed=false;
        car.visible=true;

      },
      5000
    );

  }
}


function updateEffects(dt){

  for(
    let i=effects.length-1;
    i>=0;
    i--
  ){

    const e=effects[i];

    e.time+=dt;

    const t=
      e.time/.7;


    e.mesh.scale.setScalar(
      1+t*5
    );

    e.mesh.material.opacity=
      1-t;


    if(
      e.time>=.7
    ){

      scene.remove(
        e.mesh
      );

      effects.splice(
        i,
        1
      );

    }
  }
}

function nearestLocation(){

  const target=
    currentCar||player;

  let best=null;
  let bestDistance=12;


  for(
    let i=0;
    i<locations.length;
    i++
  ){

    const l=
      locations[i];


    const d=
      distance(
        target,
        l
      );


    if(
      d<bestDistance
    ){

      bestDistance=d;
      best=l;

    }
  }


  return best;
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  const target=
    currentCar||player;


  const distanceBack=
    currentCar
      ?11
      :9;


  const height=
    currentCar
      ?6
      :5;


  const angle=
    target.rotation.y+
    cameraYaw;


  const x=
    target.position.x+
    Math.sin(angle)*
    distanceBack;


  const z=
    target.position.z+
    Math.cos(angle)*
    distanceBack;


  const y=
    target.position.y+
    height+
    cameraPitch*3;


  camera.position.x=
    THREE.MathUtils.lerp(
      camera.position.x,
      x,
      dt*7
    );


  camera.position.y=
    THREE.MathUtils.lerp(
      camera.position.y,
      y,
      dt*7
    );


  camera.position.z=
    THREE.MathUtils.lerp(
      camera.position.z,
      z,
      dt*7
    );


  camera.lookAt(
    target.position.x,
    target.position.y+
      (currentCar?1.3:2),
    target.position.z
  );
}


/* =========================================================
   MINIMAP
========================================================= */

const mapCanvas=
  document.getElementById(
    "mapCanvas"
  );

const mapCtx=
  mapCanvas.getContext("2d");


let mapTimer=0;


function updateMap(dt){

  mapTimer-=dt;

  if(mapTimer>0)
    return;

  mapTimer=.25;


  const w=115;


  mapCtx.fillStyle="#0a1118";

  mapCtx.fillRect(
    0,0,w,w
  );


  mapCtx.strokeStyle="#444";

  mapCtx.lineWidth=3;


  for(
    let i=0;
    i<roads.length;
    i++
  ){

    const p=
      57.5+
      roads[i]/400*115;


    mapCtx.beginPath();

    mapCtx.moveTo(
      p,
      0
    );

    mapCtx.lineTo(
      p,
      115
    );

    mapCtx.stroke();


    mapCtx.beginPath();

    mapCtx.moveTo(
      0,
      p
    );

    mapCtx.lineTo(
      115,
      p
    );

    mapCtx.stroke();

  }


  const target=
    currentCar||player;


  const px=
    57.5+
    target.position.x/
    400*
    115;


  const py=
    57.5+
    target.position.z/
    400*
    115;


  mapCtx.fillStyle=
    "#ffffff";


  mapCtx.beginPath();

  mapCtx.arc(
    px,
    py,
    4,
    0,
    Math.PI*2
  );

  mapCtx.fill();


  if(marker.visible){

    const mx=
      57.5+
      marker.position.x/
      400*
      115;

    const my=
      57.5+
      marker.position.z/
      400*
      115;


    mapCtx.fillStyle=
      "#00eaff";


    mapCtx.beginPath();

    mapCtx.arc(
      mx,
      my,
      4,
      0,
      Math.PI*2
    );

    mapCtx.fill();

  }


  mapCtx.fillStyle=
    "#ff3030";


  for(
    let i=0;
    i<police.length;
    i++
  ){

    const p=
      police[i];


    const x=
      57.5+
      p.position.x/
      400*
      115;


    const y=
      57.5+
      p.position.z/
      400*
      115;


    mapCtx.fillRect(
      x-2,
      y-2,
      4,
      4
    );

  }
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById(
    "health"
  ).textContent=
    Math.max(
      0,
      Math.floor(health)
    );


  document.getElementById(
    "money"
  ).textContent=
    money;


  document.getElementById(
    "weaponText"
  ).textContent=
    weaponIndex===0
      ?"PISTOL"
      :"RIFLE";


  document.getElementById(
    "ammo"
  ).textContent=
    ammo;


  document.getElementById(
    "wanted"
  ).textContent=
    "★".repeat(wanted)+
    "☆".repeat(5-wanted);


  let speed=0;


  if(currentCar){

    speed=Math.round(
      Math.abs(
        currentCar.userData.speed
      )*3.6
    );

  }


  document.getElementById(
    "speed"
  ).textContent=
    speed;
}


function showMessage(text){

  const el=
    document.getElementById(
      "message"
    );


  el.textContent=text;

  el.style.opacity=1;

  messageTimer=2;
}


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

  const target=
    currentCar||player;


  const data={
    x:target.position.x,
    z:target.position.z,
    health:health,
    money:money,
    wanted:wanted,
    rifle:rifleOwned,
    weapon:weaponIndex,
    ammo:ammo,
    mission:mission,
    kills:kills,
    time:gameTime
  };


  localStorage.setItem(
    "OPEN_CITY_V10_LITE",
    JSON.stringify(data)
  );


  showMessage(
    "GAME SAVED"
  );
}


function loadGame(){

  const raw=
    localStorage.getItem(
      "OPEN_CITY_V10_LITE"
    );


  if(!raw){

    showMessage(
      "NO SAVE FOUND"
    );

    return;
  }


  try{

    const d=
      JSON.parse(raw);


    if(currentCar){

      currentCar.userData.speed=0;

      currentCar=null;

      player.visible=true;

    }


    player.position.set(
      d.x||0,
      0,
      d.z||0
    );


    health=
      d.health||
      100;


    money=
      d.money||
      500;


    wanted=
      d.wanted||
      0;


    rifleOwned=
      !!d.rifle;


    weaponIndex=
      d.weapon||
      0;


    ammo=
      d.ammo||
      12;


    mission=
      d.mission||
      0;


    kills=
      d.kills||
      0;


    gameTime=
      d.time||
      12;


    gun.visible=
      weaponIndex===0;


    rifle.visible=
      weaponIndex===1;


    clearPolice();

    updateMissionUI();
    updateUI();


    showMessage(
      "GAME LOADED"
    );


  }catch(e){

    showMessage(
      "LOAD ERROR"
    );

  }
}


/* =========================================================
   DEATH
========================================================= */

function die(){

  if(dead)
    return;


  dead=true;

  health=0;

  showMessage(
    "YOU DIED - PRESS ENTER"
  );
}


function respawn(){

  dead=false;

  health=100;

  wanted=0;

  clearPolice();


  if(currentCar){

    currentCar.userData.speed=0;

    currentCar=null;

  }


  player.visible=true;


  player.position.set(
    0,
    0,
    0
  );


  showMessage(
    "RESPAWNED"
  );


  updateUI();
}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );


let joyActive=false;


function setJoystick(
  x,
  y
){

  const r=
    joystick.getBoundingClientRect();


  const cx=
    r.left+
    r.width/2;


  const cy=
    r.top+
    r.height/2;


  let dx=x-cx;
  let dy=y-cy;


  const max=45;


  const len=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


  if(len>max){

    dx=
      dx/len*
      max;

    dy=
      dy/len*
      max;

  }


  joystickX=
    dx/max;


  joystickY=
    dy/max;


  stick.style.transform=
    "translate("+
    dx+
    "px,"+
    dy+
    "px)";
}


function resetJoystick(){

  joyActive=false;

  joystickX=0;
  joystickY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    joyActive=true;

    const t=
      e.touches[0];

    setJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();

    if(!joyActive)
      return;


    const t=
      e.touches[0];

    setJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  resetJoystick
);


/* =========================================================
   BUTTONS
========================================================= */

function button(
  id,
  down,
  up
){

  const el=
    document.getElementById(id);


  el.addEventListener(
    "touchstart",
    function(e){

      e.preventDefault();

      down();

    },
    {passive:false}
  );


  el.addEventListener(
    "touchend",
    function(e){

      e.preventDefault();

      if(up)
        up();

    },
    {passive:false}
  );


  el.addEventListener(
    "mousedown",
    function(e){

      e.preventDefault();

      down();

    }
  );


  el.addEventListener(
    "mouseup",
    function(e){

      e.preventDefault();

      if(up)
        up();

    }
  );
}


button(
  "fire",
  function(){

    firePressed=true;

    shoot();

  },
  function(){

    firePressed=false;

  }
);


button(
  "enter",
  enterExit
);


button(
  "use",
  useLocation
);


button(
  "weapon",
  switchWeapon
);


button(
  "brake",
  function(){

    brakePressed=true;

  },
  function(){

    brakePressed=false;

  }
);


document.getElementById(
  "save"
).addEventListener(
  "click",
  saveGame
);


document.getElementById(
  "load"
).addEventListener(
  "click",
  loadGame
);


/* =========================================================
   KEYBOARD
========================================================= */

const keys={};


addEventListener(
  "keydown",
  function(e){

    keys[
      e.key.toLowerCase()
    ]=true;


    if(e.key===" ")
      shoot();


    if(
      e.key.toLowerCase()==="e"
    )
      enterExit();


    if(
      e.key.toLowerCase()==="q"
    )
      switchWeapon();


    if(
      e.key.toLowerCase()==="f"
    )
      useLocation();


    if(
      e.key.toLowerCase()==="p"
    )
      saveGame();

  }
);


addEventListener(
  "keyup",
  function(e){

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


function keyboard(){

  if(joyActive)
    return;


  joystickX=0;
  joystickY=0;


  if(
    keys["a"]||
    keys["arrowleft"]
  )
    joystickX=-1;


  if(
    keys["d"]||
    keys["arrowright"]
  )
    joystickX=1;


  if(
    keys["w"]||
    keys["arrowup"]
  )
    joystickY=-1;


  if(
    keys["s"]||
    keys["arrowdown"]
  )
    joystickY=1;


  firePressed=
    !!keys[" "];


  brakePressed=
    !!keys["shift"];
}


/* =========================================================
   CAMERA SWIPE
========================================================= */

let swipeX=null;
let swipeY=null;


renderer.domElement.addEventListener(
  "touchstart",
  function(e){

    if(
      e.touches.length!==1
    )
      return;


    swipeX=
      e.touches[0].clientX;

    swipeY=
      e.touches[0].clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchmove",
  function(e){

    if(
      swipeX===null ||
      e.touches.length!==1
    )
      return;


    const x=
      e.touches[0].clientX;

    const y=
      e.touches[0].clientY;


    const dx=
      x-swipeX;

    const dy=
      y-swipeY;


    cameraYaw-=
      dx*.006;


    cameraPitch=
      clamp(
        cameraPitch-
        dy*.003,
        -.3,
        .6
      );


    swipeX=x;
    swipeY=y;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  function(){

    swipeX=null;
    swipeY=null;

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

let last=
  performance.now();


function loop(){

  requestAnimationFrame(
    loop
  );


  const now=
    performance.now();


  let dt=
    (now-last)/1000;


  last=now;


  /*
     Never allow a giant frame
     to freeze the game.
  */

  dt=
    Math.min(
      dt,
      .05
    );


  keyboard();


  if(!dead){

    if(currentCar)
      updateDriving(dt);
    else
      updateWalking(dt);


    if(firePressed)
      shoot();


    updateTraffic(dt);
    updatePedestrians(dt);
    updateEnemies(dt);
    updatePolice(dt);
    updateWanted(dt);


    checkMission();

  }


  updateEffects(dt);
  updateDayNight(dt);
  updateCamera(dt);
  updateMap(dt);
  updateUI();


  if(
    messageTimer>0
  ){

    messageTimer-=dt;


    if(
      messageTimer<=0
    ){

      document.getElementById(
        "message"
      ).style.opacity=0;

    }
  }


  marker.rotation.y+=
    dt*1.5;


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   START
========================================================= */

updateMissionUI();
updateUI();

player.position.set(
  0,
  0,
  0
);

camera.position.set(
  0,
  6,
  10
);

loop();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  function(){

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1
      )
    );

  }
);

}
