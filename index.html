<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V7</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{
 position:fixed;top:8px;left:8px;z-index:10;
 color:white;background:rgba(0,0,0,.55);padding:8px 10px;
 border-radius:10px;font-size:13px;line-height:1.45
}
#mission{
 position:fixed;top:8px;left:50%;transform:translateX(-50%);
 z-index:10;color:#fff;background:rgba(0,0,0,.6);
 padding:8px 14px;border-radius:12px;text-align:center;
 max-width:90%;font-size:13px
}
#buttons{
 position:fixed;right:8px;bottom:12px;z-index:20;
 display:grid;grid-template-columns:repeat(2,70px);gap:8px
}
button{
 border:0;border-radius:15px;background:rgba(20,20,20,.75);
 color:#fff;font-weight:bold;width:70px;height:48px;
 box-shadow:0 2px 6px #000;font-size:12px
}
button:active{transform:scale(.94);background:#444}
#drive{
 display:none;position:fixed;right:8px;bottom:12px;z-index:21;
 grid-template-columns:repeat(2,78px);gap:8px
}
#drive button{width:78px;height:55px}
#joy{
 position:fixed;left:20px;bottom:20px;width:135px;height:135px;
 z-index:20;border-radius:50%;background:rgba(255,255,255,.12);
 border:2px solid rgba(255,255,255,.25)
}
#stick{
 position:absolute;left:38px;top:38px;width:55px;height:55px;
 border-radius:50%;background:rgba(255,255,255,.35)
}
#look{
 position:fixed;right:0;top:0;width:55%;height:58%;z-index:5
}
#map{
 position:fixed;right:8px;top:8px;width:130px;height:130px;
 z-index:12;border:2px solid white;border-radius:10px;
 background:#182018;image-rendering:auto
}
#msg{
 position:fixed;bottom:160px;left:50%;transform:translateX(-50%);
 color:white;background:rgba(0,0,0,.7);padding:8px 15px;
 border-radius:10px;z-index:30;display:none
}
#error{
 position:fixed;inset:0;display:none;z-index:100;
 background:#111;color:#ff5555;padding:30px;font:16px Arial
}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
 ❤️ <span id="hp">100</span>
 💰 $<span id="money">500</span>
 ⭐ <span id="wanted">0</span>
 🔫 <span id="ammo">30</span>
 <div id="carInfo" style="display:none">
 🚗 <span id="carName">Car</span>
 ❤️ <span id="carHp">100</span>
 ⚡ <span id="speed">0</span>
 </div>
</div>

<div id="mission">Loading city...</div>

<canvas id="map" width="130" height="130"></canvas>

<div id="joy"><div id="stick"></div></div>
<div id="look"></div>

<div id="buttons">
 <button id="fire">FIRE</button>
 <button id="jump">JUMP</button>
 <button id="run">RUN</button>
 <button id="weapon">WEAPON</button>
 <button id="enter">ENTER</button>
 <button id="save">SAVE</button>
 <button id="load">LOAD</button>
</div>

<div id="drive">
 <button id="gas">GAS ▲</button>
 <button id="brake">BRAKE ▼</button>
 <button id="exit">EXIT</button>
 <button id="horn">HORN</button>
</div>

<div id="msg"></div>
<div id="error"></div>

<script>
/* =========================================================
   THREE.JS LOADER
========================================================= */
function loadThree(urls,i){
 const s=document.createElement("script");
 s.src=urls[i];
 s.onload=()=>startGame();
 s.onerror=()=>{
   if(i+1<urls.length) loadThree(urls,i+1);
   else{
    document.getElementById("error").style.display="block";
    document.getElementById("error").innerHTML=
      "<h2>Open City could not start</h2>"+
      "<p>Three.js could not be loaded.</p>"+
      "<p>Check your internet connection and reload the page.</p>";
   }
 };
 document.head.appendChild(s);
}
loadThree([
 "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
 "https://unpkg.com/three@0.160.0/build/three.min.js"
]);

/* =========================================================
   GAME
========================================================= */
function startGame(){

if(window.__OPEN_CITY_STARTED)return;
window.__OPEN_CITY_STARTED=true;

const THREE=window.THREE;

const game=document.getElementById("game");
const hpEl=document.getElementById("hp");
const moneyEl=document.getElementById("money");
const wantedEl=document.getElementById("wanted");
const ammoEl=document.getElementById("ammo");
const missionEl=document.getElementById("mission");
const carInfo=document.getElementById("carInfo");
const carName=document.getElementById("carName");
const carHpEl=document.getElementById("carHp");
const speedEl=document.getElementById("speed");
const msg=document.getElementById("msg");
const map=document.getElementById("map");
const ctx=map.getContext("2d");

/* ---------------- SCENE ---------------- */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b8e8);
scene.fog=new THREE.Fog(0x82b8e8,90,420);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,600
);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
game.appendChild(renderer.domElement);

const clock=new THREE.Clock();

const ambient=new THREE.HemisphereLight(0xffffff,0x445544,1.7);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(80,140,60);
scene.add(sun);

/* ---------------- HELPERS ---------------- */

function mat(c){
 return new THREE.MeshLambertMaterial({color:c});
}

function box(x,y,z,c){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(x,y,z),
  mat(c)
 );
 return m;
}

function cyl(r,h,c){
 return new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,h,10),
  mat(c)
 );
}

function dist(a,b){
 return Math.hypot(a.x-b.x,a.z-b.z);
}

function say(t,ms=1800){
 msg.textContent=t;
 msg.style.display="block";
 clearTimeout(say.timer);
 say.timer=setTimeout(()=>msg.style.display="none",ms);
}

/* ---------------- WORLD ---------------- */

const ground=box(500,.4,500,0x477447);
ground.position.y=-.2;
scene.add(ground);

function road(x,z,w,d){
 const r=box(w,.08,d,0x292929);
 r.position.set(x,.02,z);
 scene.add(r);

 const line=box(
  w>.1?Math.min(w*.025,2):2,
  .03,
  d>.1?Math.min(d*.025,2):2,
  0xe6d86b
 );
 line.position.set(x,.08,z);
 scene.add(line);
}

road(0,0,32,500);
road(0,0,500,32);
road(0,100,500,18);
road(0,-100,500,18);
road(100,0,18,500);
road(-100,0,18,500);

/* Buildings */

for(let x=-220;x<=220;x+=45){
 for(let z=-220;z<=220;z+=45){

  if(Math.abs(x)<28 || Math.abs(z)<28)continue;

  if(Math.random()<.72){

   const w=22+Math.random()*13;
   const d=22+Math.random()*13;
   const h=12+Math.random()*45;

   const b=box(w,h,d,
    new THREE.Color().setHSL(
     Math.random(),
     .25,
     .35+.12*Math.random()
    )
   );

   b.position.set(
    x+(Math.random()*8-4),
    h/2,
    z+(Math.random()*8-4)
   );

   scene.add(b);
  }
 }
}

/* Trees */

function tree(x,z){
 const g=new THREE.Group();

 const trunk=cyl(1.1,6,0x704628);
 trunk.position.y=3;
 g.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(4.5,8,6),
  mat(0x246b2d)
 );
 crown.position.y=7;
 g.add(crown);

 g.position.set(x,0,z);
 scene.add(g);
}

for(let i=0;i<90;i++){
 let x=(Math.random()*460)-230;
 let z=(Math.random()*460)-230;

 if(Math.abs(x)<22 || Math.abs(z)<22)continue;

 tree(x,z);
}

/* ---------------- PLAYER ---------------- */

const player=new THREE.Group();

const body=box(1.5,2.2,1,0x2455b8);
body.position.y=2.1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.65,10,8),
 mat(0xd39b72)
);
head.position.y=3.65;
player.add(head);

const leg1=box(.5,1.5,.55,0x202020);
const leg2=box(.5,1.5,.55,0x202020);

leg1.position.set(-.42,.75,0);
leg2.position.set(.42,.75,0);

player.add(leg1,leg2);

const arm1=box(.42,1.5,.42,0xd39b72);
const arm2=box(.42,1.5,.42,0xd39b72);

arm1.position.set(-1.05,2.15,0);
arm2.position.set(1.05,2.15,0);

player.add(arm1,arm2);

player.position.set(0,0,55);
scene.add(player);

/* ---------------- WEAPON ---------------- */

const gun=box(.25,.25,1.8,0x111111);
gun.position.set(.9,2.25,-.8);
gun.rotation.x=Math.PI/2;
player.add(gun);

let ammo=30;
let money=500;
let health=100;
let wanted=0;
let weapon=1;

/* ---------------- CARS ---------------- */

const cars=[];
const traffic=[];

const TYPES=[
 {name:"Coupe",color:0xd82d2d,max:150,acc:.08,turn:.035},
 {name:"Sport",color:0x287bd4,max:190,acc:.11,turn:.045},
 {name:"SUV",color:0x555555,max:125,acc:.065,turn:.025},
 {name:"Taxi",color:0xe4c928,max:140,acc:.075,turn:.03}
];

function makeCar(x,z,color,typeIndex=0,police=false){

 const t=TYPES[typeIndex%TYPES.length];

 const g=new THREE.Group();

 const main=box(2.5,.85,4.6,police?0xffffff:t.color);
 main.position.y=1;
 g.add(main);

 const roof=box(2.0,.65,2.2,police?0x222222:0x202020);
 roof.position.y=1.65;
 g.add(roof);

 const wheels=[];

 for(const sx of [-1,1]){
  for(const sz of [-1,1]){
   const w=cyl(.55,.35,0x111111);
   w.rotation.z=Math.PI/2;
   w.position.set(sx*1.35,.55,sz*1.55);
   g.add(w);
   wheels.push(w);
  }
 }

 if(police){
  const siren=box(.8,.25,.35,0xff2222);
  siren.position.y=2.1;
  g.add(siren);
 }

 g.position.set(x,0,z);

 g.userData={
  type:t.name,
  max:t.max,
  acc:t.acc,
  turn:t.turn,
  health:100,
  speed:0,
  police,
  parked:true,
  angle:0,
  dead:false
 };

 scene.add(g);

 if(!police)cars.push(g);

 return g;
}

/* parked cars */
for(let i=0;i<16;i++){
 const t=i%TYPES.length;
 const c=makeCar(
  -210+Math.random()*420,
  -210+Math.random()*420,
  TYPES[t].color,
  t
 );
 c.rotation.y=Math.random()*Math.PI*2;
}

/* Traffic */

for(let i=0;i<10;i++){

 const horizontal=i%2===0;

 const c=makeCar(
  horizontal?-220+Math.random()*440:-80+Math.random()*160,
  horizontal?-80+Math.random()*160:-220+Math.random()*440,
  TYPES[i%TYPES.length].color,
  i%TYPES.length
 );

 c.userData.parked=false;
 c.userData.speed=25+Math.random()*30;

 if(horizontal){
  c.rotation.y=Math.random()<.5?0:Math.PI;
 }else{
  c.rotation.y=Math.random()<.5?Math.PI/2:-Math.PI/2;
 }

 traffic.push(c);
}

/* Police */

const policeCars=[];

function spawnPolice(){

 if(policeCars.length>=4)return;

 const a=Math.random()*Math.PI*2;
 const r=35+Math.random()*35;

 const p=makeCar(
  player.position.x+Math.cos(a)*r,
  player.position.z+Math.sin(a)*r,
  0xffffff,
  0,
  true
 );

 p.userData.parked=false;
 p.userData.speed=0;
 policeCars.push(p);
}

/* ---------------- PEDestrians ---------------- */

const people=[];

function person(x,z){
 const g=new THREE.Group();

 const b=box(.7,1.5,.5,0x8844aa);
 b.position.y=1.2;
 g.add(b);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.35,8,6),
  mat(0xc98e67)
 );
 h.position.y=2.25;
 g.add(h);

 g.position.set(x,0,z);
 g.userData={
  hp:40,
  dead:false,
  speed:.015+Math.random()*.025,
  dx:Math.random()*2-1,
  dz:Math.random()*2-1
 };

 scene.add(g);
 people.push(g);
}

for(let i=0;i<24;i++){
 person(
  Math.random()*360-180,
  Math.random()*360-180
 );
}

/* ---------------- ENEMIES ---------------- */

const enemies=[];

function enemy(x,z){
 const g=new THREE.Group();

 const b=box(.9,1.9,.7,0x771d1d);
 b.position.y=1.5;
 g.add(b);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.4,8,6),
  mat(0xa96f52)
 );
 h.position.y=2.8;
 g.add(h);

 g.position.set(x,0,z);

 g.userData={
  hp:100,
  dead:false,
  cool:0
 };

 scene.add(g);
 enemies.push(g);
}

enemy(35,35);
enemy(-45,25);
enemy(60,-55);
enemy(-70,-60);
enemy(120,80);

/* ---------------- PLAYER STATE ---------------- */

let inCar=false;
let currentCar=null;

let yaw=0;
let pitch=.15;

let joyX=0;
let joyY=0;

let gas=false;
let brake=false;
let firing=false;
let running=false;

/* ---------------- ENTER / EXIT ---------------- */

function nearestCar(){

 let best=null;
 let bd=5;

 for(const c of cars){

  if(c.userData.dead)continue;

  const d=dist(player.position,c.position);

  if(d<bd){
   bd=d;
   best=c;
  }
 }

 return best;
}

function enterCar(){

 if(inCar)return;

 const c=nearestCar();

 if(!c){
  say("No car nearby");
  return;
 }

 currentCar=c;
 inCar=true;
 c.userData.parked=false;

 player.visible=false;

 carInfo.style.display="block";
 document.getElementById("buttons").style.display="none";
 document.getElementById("drive").style.display="grid";

 say("Entered "+c.userData.type);
}

function exitCar(){

 if(!inCar || !currentCar)return;

 player.visible=true;

 const c=currentCar;

 player.position.copy(c.position);

 const side=new THREE.Vector3(
  Math.cos(c.rotation.y),
  0,
  -Math.sin(c.rotation.y)
 );

 player.position.add(side.multiplyScalar(3));

 inCar=false;
 currentCar=null;

 carInfo.style.display="none";
 document.getElementById("buttons").style.display="grid";
 document.getElementById("drive").style.display="none";

 say("Exited car");
}

/* ---------------- SHOOTING ---------------- */

function shoot(){

 if(inCar)return;

 if(ammo<=0){
  say("Out of ammo");
  return;
 }

 ammo--;

 const origin=new THREE.Vector3();
 player.getWorldPosition(origin);

 const dir=new THREE.Vector3(
  Math.sin(yaw),
  0,
  -Math.cos(yaw)
 );

 /* enemy hit */

 let closest=null;
 let best=999;

 for(const e of enemies){

  if(e.userData.dead)continue;

  const dx=e.position.x-origin.x;
  const dz=e.position.z-origin.z;
  const d=Math.hypot(dx,dz);

  if(d>55)continue;

  const dot=(dx*dir.x+dz*dir.z)/Math.max(d,.001);

  if(dot>.94 && d<best){
   best=d;
   closest=e;
  }
 }

 if(closest){

  closest.userData.hp-=weapon===1?35:60;
  wanted=Math.min(5,wanted+1);

  if(closest.userData.hp<=0){
   closest.userData.dead=true;
   closest.visible=false;
   money+=100;
   say("+$100");
  }
 }

 /* car hit */

 for(const c of cars){

  if(c.userData.dead)continue;

  const dx=c.position.x-origin.x;
  const dz=c.position.z-origin.z;
  const d=Math.hypot(dx,dz);

  if(d<50){
   const dot=(dx*dir.x+dz*dir.z)/Math.max(d,.001);

   if(dot>.96){
    c.userData.health-=20;
    wanted=Math.min(5,wanted+1);

    if(c.userData.health<=0)explodeCar(c);
    break;
   }
  }
 }
}

/* ---------------- EXPLOSION ---------------- */

function explodeCar(c){

 if(c.userData.dead)return;

 c.userData.dead=true;

 const pos=c.position.clone();

 c.visible=false;

 const fire=new THREE.Mesh(
  new THREE.SphereGeometry(2.2,8,8),
  mat(0xff5a00)
 );

 fire.position.copy(pos);
 fire.position.y=2;
 scene.add(fire);

 const smoke=new THREE.Mesh(
  new THREE.SphereGeometry(2.8,8,8),
  mat(0x333333)
 );

 smoke.position.copy(pos);
 smoke.position.y=4;
 scene.add(smoke);

 say("CAR DESTROYED!",2200);

 setTimeout(()=>{
  scene.remove(fire);
  scene.remove(smoke);
 },900);

 if(dist(player.position,pos)<8){
  health-=35;
  wanted=Math.min(5,wanted+2);
 }
}

/* ---------------- CAR COLLISIONS ---------------- */

function carCollisions(){

 if(!inCar||!currentCar)return;

 const c=currentCar;

 for(const other of [...cars,...traffic,...policeCars]){

  if(other===c || other.userData.dead)continue;

  const d=dist(c.position,other.position);

  if(d<3.2){

   c.userData.health-=Math.max(
    2,
    Math.abs(c.userData.speed)*.06
   );

   c.userData.speed*=.55;

   other.userData.speed*=.7;

   if(c.userData.health<=0){
    explodeCar(c);
    exitCar();
    return;
   }
  }
 }
}

/* ---------------- GARAGE ---------------- */

const garage=box(18,3,18,0x315d89);
garage.position.set(-60,1.5,60);
scene.add(garage);

const garageText=box(10,.2,4,0xffcc00);
garageText.position.set(-60,3.1,60);
scene.add(garageText);

function garageService(){

 if(!inCar||!currentCar)return;

 if(dist(currentCar.position,garage.position)<13){

  if(wanted>0){
   say("Lose the cops first");
   return;
  }

  if(currentCar.userData.health<100){

   if(money>=100){

    money-=100;
    currentCar.userData.health=100;
    say("Car repaired - $100");

   }else say("Need $100");

  }else say("Car is already repaired");
 }
}

/* ---------------- POLICE ---------------- */

let policeTimer=0;

function updatePolice(dt){

 if(wanted<=0)return;

 policeTimer-=dt;

 if(policeTimer<=0){
  spawnPolice();
  policeTimer=4;
 }

 for(let i=policeCars.length-1;i>=0;i--){

  const p=policeCars[i];

  if(p.userData.dead){
   scene.remove(p);
   policeCars.splice(i,1);
   continue;
  }

  const dx=player.position.x-p.position.x;
  const dz=player.position.z-p.position.z;

  const target=Math.atan2(dx,dz);

  let diff=target-p.rotation.y;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  p.rotation.y+=Math.sign(diff)*.018;

  p.userData.speed=Math.min(
   75,
   p.userData.speed+.5
  );

  p.position.x+=Math.sin(p.rotation.y)*p.userData.speed*dt;
  p.position.z+=Math.cos(p.rotation.y)*p.userData.speed*dt;

  if(dist(p.position,player.position)<4){
   health-=12*dt;
  }
 }
}

/* ---------------- TRAFFIC ---------------- */

function updateTraffic(dt){

 for(const c of traffic){

  if(c.userData.dead)continue;

  c.position.x+=Math.sin(c.rotation.y)*c.userData.speed*dt;
  c.position.z+=Math.cos(c.rotation.y)*c.userData.speed*dt;

  if(c.position.x>250)c.position.x=-250;
  if(c.position.x<-250)c.position.x=250;
  if(c.position.z>250)c.position.z=-250;
  if(c.position.z<-250)c.position.z=250;
 }
}

/* ---------------- PLAYER MOVEMENT ---------------- */

function movePlayer(dt){

 if(inCar||health<=0)return;

 let sx=joyX;
 let sy=joyY;

 if(keys["w"]||keys["ArrowUp"])sy=-1;
 if(keys["s"]||keys["ArrowDown"])sy=1;
 if(keys["a"]||keys["ArrowLeft"])sx=-1;
 if(keys["d"]||keys["ArrowRight"])sx=1;

 const speed=running?11:6;

 const forward=new THREE.Vector3(
  Math.sin(yaw),0,-Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),0,Math.sin(yaw)
 );

 player.position.addScaledVector(forward,-sy*speed*dt);
 player.position.addScaledVector(right,sx*speed*dt);

 player.position.x=THREE.MathUtils.clamp(
  player.position.x,-240,240
 );

 player.position.z=THREE.MathUtils.clamp(
  player.position.z,-240,240
 );
}

/* ---------------- DRIVING ---------------- */

function driveCar(dt){

 if(!inCar||!currentCar)return;

 const c=currentCar;
 const u=c.userData;

 let steer=joyX;

 if(keys["a"]||keys["ArrowLeft"])steer=-1;
 if(keys["d"]||keys["ArrowRight"])steer=1;

 if(gas){
  u.speed+=u.acc*90*dt;
 }

 if(brake){
  u.speed-=u.acc*130*dt;
 }

 if(!gas&&!brake){
  u.speed*=Math.pow(.35,dt);
 }

 u.speed=THREE.MathUtils.clamp(
  u.speed,
  -35,
  u.max
 );

 c.rotation.y+=steer*u.turn*
   Math.max(1,Math.abs(u.speed))*dt;

 c.position.x+=Math.sin(c.rotation.y)*u.speed*dt;
 c.position.z+=Math.cos(c.rotation.y)*u.speed*dt;

 c.position.x=THREE.MathUtils.clamp(
  c.position.x,-245,245
 );

 c.position.z=THREE.MathUtils.clamp(
  c.position.z,-245,245
 );

 player.position.copy(c.position);

 carCollisions();
 garageService();
}

/* ---------------- ENEMIES ---------------- */

function updateEnemies(dt){

 if(inCar)return;

 for(const e of enemies){

  if(e.userData.dead)continue;

  const d=dist(e.position,player.position);

  if(d<35){

   const dx=player.position.x-e.position.x;
   const dz=player.position.z-e.position.z;

   const a=Math.atan2(dx,dz);

   e.rotation.y=a;

   if(d>7){
    e.position.x+=Math.sin(a)*.025;
    e.position.z+=Math.cos(a)*.025;
   }

   e.userData.cool-=dt;

   if(d<22 && e.userData.cool<=0){
    health-=8;
    e.userData.cool=1.2;
   }
  }
 }
}

/* ---------------- PEOPLE ---------------- */

function updatePeople(dt){

 for(const p of people){

  if(p.userData.dead)continue;

  p.position.x+=p.userData.dx*p.userData.speed*60*dt;
  p.position.z+=p.userData.dz*p.userData.speed*60*dt;

  if(Math.abs(p.position.x)>230)p.userData.dx*=-1;
  if(Math.abs(p.position.z)>230)p.userData.dz*=-1;

  if(dist(p.position,player.position)<2){
   p.userData.dx=Math.random()*2-1;
   p.userData.dz=Math.random()*2-1;
  }
 }
}

/* ---------------- MISSIONS ---------------- */

let mission=0;
let missionDone=false;

const missions=[
 "Mission 1: Reach the yellow garage",
 "Mission 2: Steal a car",
 "Mission 3: Get wanted and survive",
 "Mission 4: Destroy an enemy",
 "Mission 5: Repair your car"
];

function updateMission(){

 if(mission===0){
  missionEl.textContent=missions[0];

  if(dist(player.position,garage.position)<18){
   mission=1;
   money+=150;
   say("Mission complete +$150");
  }

 }else if(mission===1){

  missionEl.textContent=missions[1];

  if(inCar){
   mission=2;
   money+=200;
   say("Mission complete +$200");
  }

 }else if(mission===2){

  missionEl.textContent=missions[2];

  if(wanted>=2){
   mission=3;
   money+=250;
   say("Mission complete +$250");
  }

 }else if(mission===3){

  missionEl.textContent=missions[3];

  if(enemies.some(e=>e.userData.dead)){
   mission=4;
   money+=300;
   say("Mission complete +$300");
  }

 }else{

  missionEl.textContent=missions[4];

  if(inCar &&
     currentCar &&
     currentCar.userData.health===100){

   if(!missionDone){
    missionDone=true;
    money+=500;
    say("ALL MISSIONS COMPLETE +$500",3000);
    missionEl.textContent="🏆 CITY BOSS COMPLETE";
   }
  }
 }
}

/* ---------------- WANTED ---------------- */

let wantedCool=0;

function updateWanted(dt){

 if(wanted<=0)return;

 wantedCool+=dt;

 if(wantedCool>20){

  wanted=Math.max(0,wanted-1);
  wantedCool=0;

  if(wanted===0){
   policeCars.forEach(p=>scene.remove(p));
   policeCars.length=0;
   say("Police lost");
  }
 }
}

/* ---------------- DAY / NIGHT ---------------- */

let timeOfDay=0;

function updateDayNight(dt){

 timeOfDay+=dt*.008;

 const s=(Math.sin(timeOfDay)+1)/2;

 sun.intensity=.45+s*1.1;
 ambient.intensity=.65+s*1.1;

 const sky=new THREE.Color();

 sky.setHSL(
  .58,
  .35,
  .18+s*.48
 );

 scene.background=sky;
 scene.fog.color.copy(sky);
}

/* ---------------- CAMERA ---------------- */

function updateCamera(){

 let target;

 if(inCar&&currentCar){
  target=currentCar.position.clone();
  target.y+=3.5;

  const behind=new THREE.Vector3(
   -Math.sin(currentCar.rotation.y)*9,
   5,
   -Math.cos(currentCar.rotation.y)*9
  );

  camera.position.copy(target).add(behind);
  camera.lookAt(
   currentCar.position.x,
   1.5,
   currentCar.position.z
  );

 }else{

  target=player.position.clone();
  target.y+=2.2;

  const behind=new THREE.Vector3(
   -Math.sin(yaw)*7,
   3.7+pitch*3,
   Math.cos(yaw)*7
  );

  camera.position.copy(target).add(behind);
  camera.lookAt(
   player.position.x,
   1.7,
   player.position.z
  );
 }
}

/* ---------------- MINIMAP ---------------- */

function drawMap(){

 ctx.clearRect(0,0,130,130);

 ctx.fillStyle="#163516";
 ctx.fillRect(0,0,130,130);

 ctx.fillStyle="#444";
 ctx.fillRect(49,0,32,130);
 ctx.fillRect(0,49,130,32);

 function dot(x,z,color,r){

  const px=65+x/500*130;
  const py=65+z/500*130;

  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(px,py,r,0,Math.PI*2);
  ctx.fill();
 }

 const pos=inCar&&currentCar?
  currentCar.position:player.position;

 dot(pos.x,pos.z,"#00ff55",4);
 dot(garage.position.x,garage.position.z,"#ffff00",4);

 for(const p of policeCars){
  dot(p.position.x,p.position.z,"#ff2222",3);
 }
}

/* ---------------- SAVE / LOAD ---------------- */

function saveGame(){

 const data={
  x:player.position.x,
  z:player.position.z,
  hp:health,
  money,
  ammo,
  wanted,
  mission,
  weapon
 };

 localStorage.setItem(
  "openCityV7",
  JSON.stringify(data)
 );

 say("Game saved");
}

function loadGame(){

 const raw=localStorage.getItem("openCityV7");

 if(!raw){
  say("No V7 save found");
  return;
 }

 try{

  const d=JSON.parse(raw);

  player.position.x=d.x||0;
  player.position.z=d.z||55;
  health=d.hp??100;
  money=d.money??500;
  ammo=d.ammo??30;
  wanted=d.wanted??0;
  mission=d.mission??0;
  weapon=d.weapon??1;

  say("Game loaded");

 }catch(e){
  say("Save file damaged");
 }
}

/* ---------------- KEYBOARD ---------------- */

const keys={};

addEventListener("keydown",e=>{

 keys[e.key]=true;

 if(e.key.toLowerCase()==="e"){
  if(inCar)exitCar();
  else enterCar();
 }

 if(e.key.toLowerCase()==="f")shoot();

 if(e.key.toLowerCase()==="shift")running=true;

 if(e.key.toLowerCase()==="1")weapon=1;
 if(e.key.toLowerCase()==="2")weapon=2;
});

addEventListener("keyup",e=>{

 keys[e.key]=false;

 if(e.key.toLowerCase()==="shift")running=false;
});

/* ---------------- TOUCH BUTTONS ---------------- */

function holdButton(id,on,off){

 const b=document.getElementById(id);

 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  on();
 });

 b.addEventListener("pointerup",e=>{
  e.preventDefault();
  off&&off();
 });

 b.addEventListener("pointercancel",()=>{
  off&&off();
 });

 b.addEventListener("pointerleave",()=>{
  off&&off();
 });
}

holdButton("fire",()=>firing=true,()=>firing=false);

holdButton("gas",()=>gas=true,()=>gas=false);

holdButton("brake",()=>brake=true,()=>brake=false);

holdButton("run",()=>running=true,()=>running=false);

document.getElementById("enter").onclick=enterCar;
document.getElementById("exit").onclick=exitCar;
document.getElementById("save").onclick=saveGame;
document.getElementById("load").onclick=loadGame;
document.getElementById("jump").onclick=()=>{
 if(!inCar)player.position.y=.8;
};
document.getElementById("weapon").onclick=()=>{
 weapon=weapon===1?2:1;
 say(weapon===1?"Pistol":"Rifle");
};
document.getElementById("horn").onclick=()=>{
 wanted=Math.min(5,wanted+1);
 say("HONK!");
};

/* ---------------- JOYSTICK ---------------- */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyPointer=null;

function updateJoy(e){

 const r=joy.getBoundingClientRect();

 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);

 const max=48;
 const d=Math.hypot(x,y);

 if(d>max){
  x=x/d*max;
  y=y/d*max;
 }

 joyX=x/max;
 joyY=y/max;

 stick.style.left=(38+x)+"px";
 stick.style.top=(38+y)+"px";
}

joy.addEventListener("pointerdown",e=>{
 joyPointer=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 updateJoy(e);
});

joy.addEventListener("pointermove",e=>{
 if(e.pointerId===joyPointer)updateJoy(e);
});

joy.addEventListener("pointerup",()=>{
 joyPointer=null;
 joyX=0;
 joyY=0;
 stick.style.left="38px";
 stick.style.top="38px";
});

joy.addEventListener("pointercancel",()=>{
 joyPointer=null;
 joyX=0;
 joyY=0;
 stick.style.left="38px";
 stick.style.top="38px";
});

/* ---------------- LOOK ---------------- */

let lookPointer=null;
let lastLookX=0;
let lastLookY=0;

document.getElementById("look").addEventListener("pointerdown",e=>{
 lookPointer=e.pointerId;
 lastLookX=e.clientX;
 lastLookY=e.clientY;
});

document.getElementById("look").addEventListener("pointermove",e=>{

 if(e.pointerId!==lookPointer)return;

 const dx=e.clientX-lastLookX;
 const dy=e.clientY-lastLookY;

 lastLookX=e.clientX;
 lastLookY=e.clientY;

 if(!inCar){
  yaw-=dx*.008;
  pitch+=dy*.004;
  pitch=THREE.MathUtils.clamp(pitch,-.6,.8);
 }
});

document.getElementById("look").addEventListener("pointerup",()=>{
 lookPointer=null;
});

document.getElementById("look").addEventListener("pointercancel",()=>{
 lookPointer=null;
});

/* ---------------- RESIZE ---------------- */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

/* ---------------- HUD ---------------- */

function updateHUD(){

 hpEl.textContent=Math.max(0,Math.floor(health));
 moneyEl.textContent=Math.floor(money);
 wantedEl.textContent=wanted;
 ammoEl.textContent=ammo;

 if(inCar&&currentCar){

  carInfo.style.display="block";
  carName.textContent=currentCar.userData.type;
  carHpEl.textContent=Math.max(
   0,
   Math.floor(currentCar.userData.health)
  );

  speedEl.textContent=Math.floor(
   Math.abs(currentCar.userData.speed)
  );

 }else{
  carInfo.style.display="none";
 }

 if(health<=0){
  health=100;
  wanted=0;
  money=Math.max(0,money-200);

  if(inCar)exitCar();

  player.position.set(0,0,55);

  say("You were knocked out. -$200",2500);
 }
}

/* ---------------- GAME LOOP ---------------- */

let fireTimer=0;

function loop(){

 requestAnimationFrame(loop);

 const dt=Math.min(clock.getDelta(),.05);

 if(firing){

  fireTimer-=dt;

  if(fireTimer<=0){
   shoot();
   fireTimer=weapon===1?.35:.16;
  }
 }

 movePlayer(dt);
 driveCar(dt);
 updateTraffic(dt);
 updatePeople(dt);
 updateEnemies(dt);
 updatePolice(dt);
 updateWanted(dt);
 updateDayNight(dt);
 updateMission();
 updateCamera();
 updateHUD();
 drawMap();

 renderer.render(scene,camera);
}

missionEl.textContent=missions[0];
say("Welcome to Open City V7",2200);

loop();

}
</script>

 </html>
