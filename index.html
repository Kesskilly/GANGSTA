<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City V3.1</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#111;font-family:Arial,sans-serif;
 touch-action:none;
}
#game{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#loading{
 position:fixed;inset:0;background:#101010;color:white;
 z-index:50;display:flex;align-items:center;
 justify-content:center;flex-direction:column;font-size:24px
}
#loading small{font-size:14px;color:#aaa;margin-top:10px}
#hud{
 position:fixed;top:10px;left:10px;z-index:10;
 color:white;font-weight:bold;text-shadow:2px 2px #000;
 line-height:1.55;pointer-events:none
}
#mission{color:#63c8ff;max-width:310px}
#weapon{color:#ffd34d}
#wanted{color:#ff5555}
#health{color:#55ff88}
#help{
 position:fixed;right:10px;top:10px;z-index:10;
 color:white;text-align:right;font-size:12px;
 text-shadow:2px 2px #000;pointer-events:none
}
#cross{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 color:white;font-size:24px;text-shadow:0 0 5px #000;
 z-index:9;pointer-events:none
}
#map{
 position:fixed;right:10px;bottom:10px;
 width:130px;height:130px;background:#222;
 border:2px solid white;border-radius:8px;z-index:10
}
#controls{position:fixed;inset:0;z-index:11;pointer-events:none}
#joy{
 position:absolute;left:18px;bottom:25px;width:125px;height:125px;
 border:2px solid rgba(255,255,255,.4);border-radius:50%;
 background:rgba(255,255,255,.08);pointer-events:auto
}
#stick{
 position:absolute;left:33px;top:33px;width:55px;height:55px;
 border-radius:50%;background:rgba(255,255,255,.38)
}
.btn{
 position:absolute;width:60px;height:60px;border-radius:50%;
 border:2px solid rgba(255,255,255,.5);
 background:rgba(20,20,20,.65);color:white;
 font-size:11px;font-weight:bold;display:flex;
 align-items:center;justify-content:center;
 pointer-events:auto;user-select:none
}
#fire{right:20px;bottom:25px;background:rgba(180,30,30,.75)}
#jump{right:95px;bottom:100px}
#enter{right:20px;bottom:100px}
#swap{right:95px;bottom:25px}
#run{left:155px;bottom:32px;background:rgba(30,120,40,.7)}
#look{
 position:absolute;right:0;top:0;width:55%;height:65%;
 pointer-events:auto
}
#gas{right:165px;bottom:25px}
#brake{right:165px;bottom:92px}
</style>
</head>

<body>

<div id="loading">
 OPEN CITY V3.1
 <small>Building the city...</small>
</div>

<canvas id="game"></canvas>

<div id="hud">
 ❤️ Health: <span id="health">100</span><br>
 💰 $<span id="money">500</span><br>
 🔫 <span id="weapon">PISTOL</span><br>
 🔴 Wanted: <span id="wanted">0</span><br>
 <span id="mission">Mission 1: Reach the blue marker</span>
</div>

<div id="help">
WASD / JOYSTICK<br>
DRAG RIGHT SIDE = TURN<br>
SHIFT / RUN = SPRINT
</div>

<div id="cross">+</div>
<canvas id="map" width="130" height="130"></canvas>

<div id="controls">

 <div id="joy"><div id="stick"></div></div>
 <div id="look"></div>

 <div class="btn" id="fire">FIRE</div>
 <div class="btn" id="jump">JUMP</div>
 <div class="btn" id="enter">CAR</div>
 <div class="btn" id="swap">GUN</div>
 <div class="btn" id="run">RUN</div>
 <div class="btn" id="gas">GAS</div>
 <div class="btn" id="brake">STOP</div>

</div>

<script>

const script=document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js";

script.onload=startGame;

script.onerror=()=>{
 document.getElementById("loading").innerHTML=
 "<b>Three.js could not load.</b><small>Reload the page when you have internet.</small>";
};

document.head.appendChild(script);


/* =========================================================
   GAME
========================================================= */

function startGame(){

const T=THREE;

const canvas=document.getElementById("game");

const renderer=new T.WebGLRenderer({
 canvas:canvas,
 antialias:false,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=T.SRGBColorSpace;

const scene=new T.Scene();

scene.background=new T.Color(0x8bb9dc);
scene.fog=new T.Fog(0x8bb9dc,90,280);

const camera=new T.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 400
);

const clock=new T.Clock();


/* =========================================================
   LIGHT
========================================================= */

const hemi=new T.HemisphereLight(
 0xddeeff,
 0x555555,
 1.35
);

scene.add(hemi);

const sun=new T.DirectionalLight(
 0xffffff,
 1.15
);

sun.position.set(-80,120,60);
scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

const groundMat=new T.MeshLambertMaterial({
 color:0x507b4e
});

const roadMat=new T.MeshLambertMaterial({
 color:0x292b2d
});

const sidewalkMat=new T.MeshLambertMaterial({
 color:0x888886
});

const curbMat=new T.MeshLambertMaterial({
 color:0xb2b2aa
});

const windowMat=new T.MeshBasicMaterial({
 color:0x8fd4e8
});

const darkWindowMat=new T.MeshBasicMaterial({
 color:0x34515d
});

const skinMat=new T.MeshLambertMaterial({
 color:0xd59b70
});

const blackMat=new T.MeshLambertMaterial({
 color:0x151515
});


/* =========================================================
   GROUND
========================================================= */

const ground=new T.Mesh(
 new T.PlaneGeometry(340,340),
 groundMat
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);


/* =========================================================
   ROADS
========================================================= */

function road(x,z,w,d){

 const r=new T.Mesh(
  new T.BoxGeometry(w,.12,d),
  roadMat
 );

 r.position.set(x,.06,z);
 scene.add(r);

 /* sidewalks */

 if(w>d){

  const s1=new T.Mesh(
   new T.BoxGeometry(w,.16,4),
   sidewalkMat
  );

  const s2=s1.clone();

  s1.position.set(x,.08,z-d/2-2);
  s2.position.set(x,.08,z+d/2+2);

  scene.add(s1,s2);

 }else{

  const s1=new T.Mesh(
   new T.BoxGeometry(4,.16,d),
   sidewalkMat
  );

  const s2=s1.clone();

  s1.position.set(x-w/2-2,.08,z);
  s2.position.set(x+w/2+2,.08,z);

  scene.add(s1,s2);
 }
}

road(0,0,20,340);
road(0,0,340,20);

road(-80,0,14,340);
road(80,0,14,340);

road(0,-80,340,14);
road(0,80,340,14);


/* =========================================================
   ROAD MARKINGS
========================================================= */

function mark(x,z,w,d,color=0xf2c94c){

 const m=new T.Mesh(
  new T.BoxGeometry(w,.035,d),
  new T.MeshBasicMaterial({color})
 );

 m.position.set(x,.14,z);
 scene.add(m);
}

for(let z=-155;z<155;z+=12)
 mark(0,z,.25,5);

for(let x=-155;x<155;x+=12)
 mark(x,0,5,.25);

for(let z=-155;z<155;z+=12)
 mark(-80,z,.22,5);

for(let z=-155;z<155;z+=12)
 mark(80,z,.22,5);

for(let x=-155;x<155;x+=12)
 mark(x,-80,5,.22);

for(let x=-155;x<155;x+=12)
 mark(x,80,5,.22);


/* =========================================================
   BUILDINGS
========================================================= */

const buildings=[];

const buildingColors=[
 0x747b82,
 0x8b6d5b,
 0x657b89,
 0x806f82,
 0x77705f,
 0x666c70
];

function building(x,z,w,d,h,color){

 const group=new T.Group();

 const body=new T.Mesh(
  new T.BoxGeometry(w,h,d),
  new T.MeshLambertMaterial({color})
 );

 body.position.y=h/2;
 group.add(body);

 /* roof */

 const roof=new T.Mesh(
  new T.BoxGeometry(w+.5,.4,d+.5),
  new T.MeshLambertMaterial({color:0x303235})
 );

 roof.position.y=h+.2;
 group.add(roof);

 /* windows */

 const floors=Math.max(2,Math.floor(h/4));

 for(let floor=0;floor<floors;floor++){

  const y=2.2+floor*4;

  if(y>h-1)continue;

  for(let wx=-w/2+2;wx<w/2-1;wx+=3){

   const win=new T.Mesh(
    new T.BoxGeometry(.95,.95,.08),
    Math.random()>.15?windowMat:darkWindowMat
   );

   win.position.set(wx,y,d/2+.045);
   group.add(win);

   const win2=win.clone();
   win2.position.z=-d/2-.045;
   group.add(win2);
  }
 }

 /* side windows */

 for(let floor=0;floor<floors;floor++){

  const y=2.2+floor*4;

  if(y>h-1)continue;

  for(let wz=-d/2+2;wz<d/2-1;wz+=3){

   const win=new T.Mesh(
    new T.BoxGeometry(.08,.95,.95),
    windowMat
   );

   win.position.set(w/2+.045,y,wz);
   group.add(win);

   const win2=win.clone();
   win2.position.x=-w/2-.045;
   group.add(win2);
  }
 }

 group.position.set(x,0,z);

 scene.add(group);
 buildings.push(group);
}


/* city blocks */

for(let x=-140;x<=140;x+=35){

 for(let z=-140;z<=140;z+=35){

  if(Math.abs(x)<30 || Math.abs(z)<30)
   continue;

  const h=14+Math.random()*28;

  building(
   x+(Math.random()*5-2.5),
   z+(Math.random()*5-2.5),
   22,
   22,
   h,
   buildingColors[
    Math.floor(Math.random()*buildingColors.length)
   ]
  );
 }
}


/* =========================================================
   TREES
========================================================= */

function tree(x,z,scale=1){

 const g=new T.Group();

 const trunk=new T.Mesh(
  new T.CylinderGeometry(
   .25*scale,
   .4*scale,
   3*scale,
   7
  ),
  new T.MeshLambertMaterial({color:0x704523})
 );

 trunk.position.y=1.5*scale;

 const leaves=new T.Mesh(
  new T.SphereGeometry(2.1*scale,8,6),
  new T.MeshLambertMaterial({color:0x28763a})
 );

 leaves.position.y=4*scale;

 g.add(trunk,leaves);

 g.position.set(x,0,z);

 scene.add(g);
}

for(let i=0;i<90;i++){

 const x=(Math.random()-.5)*300;
 const z=(Math.random()-.5)*300;

 if(Math.abs(x)<17 || Math.abs(z)<17)
  continue;

 tree(x,z,.8+Math.random()*.5);
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function streetLight(x,z){

 const pole=new T.Mesh(
  new T.CylinderGeometry(.09,.13,5,6),
  new T.MeshLambertMaterial({color:0x333333})
 );

 pole.position.set(x,2.5,z);
 scene.add(pole);

 const arm=new T.Mesh(
  new T.BoxGeometry(1.1,.12,.12),
  new T.MeshLambertMaterial({color:0x333333})
 );

 arm.position.set(x+.5,5,z);
 scene.add(arm);

 const lamp=new T.Mesh(
  new T.SphereGeometry(.18,6,6),
  new T.MeshBasicMaterial({color:0xffe7a0})
 );

 lamp.position.set(x+1,4.85,z);
 scene.add(lamp);
}

for(let p=-150;p<=150;p+=30){

 streetLight(12,p);
 streetLight(-12,p);
 streetLight(p,12);
 streetLight(p,-12);
}


/* =========================================================
   HUMAN
========================================================= */

function human(color){

 const g=new T.Group();

 const body=new T.Mesh(
  new T.BoxGeometry(1.05,1.45,.62),
  new T.MeshLambertMaterial({color})
 );

 body.position.y=2.1;

 const head=new T.Mesh(
  new T.SphereGeometry(.42,10,8),
  skinMat
 );

 head.position.y=3.3;

 const armL=new T.Mesh(
  new T.BoxGeometry(.27,1.3,.27),
  new T.MeshLambertMaterial({color})
 );

 const armR=armL.clone();

 armL.position.set(-.72,2.1,0);
 armR.position.set(.72,2.1,0);

 const legL=new T.Mesh(
  new T.BoxGeometry(.32,1.25,.34),
  blackMat
 );

 const legR=legL.clone();

 legL.position.set(-.28,.72,0);
 legR.position.set(.28,.72,0);

 g.add(body,head,armL,armR,legL,legR);

 g.userData.armL=armL;
 g.userData.armR=armR;
 g.userData.legL=legL;
 g.userData.legR=legR;

 return g;
}


/* =========================================================
   PLAYER
========================================================= */

const player=new T.Group();

const playerModel=human(0x225dcc);

player.add(playerModel);

player.position.set(0,0,15);
player.rotation.y=0;

player.userData.health=100;
player.userData.money=500;
player.userData.walkTime=0;
player.userData.inCar=false;
player.userData.car=null;

scene.add(player);


/* =========================================================
   PEOPLE
========================================================= */

const people=[];

for(let i=0;i<16;i++){

 const p=human([
  0xcc4444,
  0x3d9b5d,
  0x8c58b8,
  0xd28b38
 ][i%4]);

 p.position.set(
  (Math.random()-.5)*180,
  0,
  (Math.random()-.5)*180
 );

 p.userData.dir=Math.random()*Math.PI*2;
 p.userData.walkTime=Math.random()*10;
 p.userData.health=100;

 scene.add(p);
 people.push(p);
}


/* =========================================================
   CARS
========================================================= */

const cars=[];

function createCar(x,z,color,police=false){

 const g=new T.Group();

 const body=new T.Mesh(
  new T.BoxGeometry(3.4,.9,6),
  new T.MeshLambertMaterial({
   color:police?0x1d3c8c:color
  })
 );

 body.position.y=1;

 const roof=new T.Mesh(
  new T.BoxGeometry(2.5,1,3),
  new T.MeshLambertMaterial({
   color:police?0x18234d:color
  })
 );

 roof.position.y=1.8;

 g.add(body,roof);

 const wheelMat=new T.MeshLambertMaterial({
  color:0x111111
 });

 for(const sx of[-1,1]){
  for(const sz of[-2,2]){

   const wheel=new T.Mesh(
    new T.CylinderGeometry(.55,.55,.35,10),
    wheelMat
   );

   wheel.rotation.z=Math.PI/2;

   wheel.position.set(
    sx*1.7,.55,sz
   );

   g.add(wheel);
  }
 }

 if(police){

  const light=new T.Mesh(
   new T.BoxGeometry(1.2,.25,.5),
   new T.MeshBasicMaterial({color:0xff2020})
  );

  light.position.y=2.45;
  g.add(light);
 }

 g.position.set(x,0,z);

 g.userData.health=100;
 g.userData.speed=0;
 g.userData.police=police;
 g.userData.traffic=false;

 scene.add(g);
 cars.push(g);

 return g;
}

const carColors=[
 0xcc2222,0x2266cc,0xe5e5e5,
 0x22a45c,0xdd9a22,0x863e9e
];

for(let i=0;i<8;i++){

 createCar(
  -8+(i%4)*5,
  -14-Math.floor(i/4)*7,
  carColors[i%carColors.length]
 );
}

for(let i=0;i<12;i++){

 const c=createCar(
  Math.random()<.5?-80:80,
  (Math.random()-.5)*290,
  carColors[i%carColors.length]
 );

 c.rotation.y=Math.PI/2;
 c.userData.traffic=true;
 c.userData.speed=3+Math.random()*3;
}


/* =========================================================
   WEAPONS
========================================================= */

const weapons=[
 {name:"PISTOL",damage:25,range:60,cooldown:350},
 {name:"RIFLE",damage:40,range:100,cooldown:180}
];

let weaponIndex=0;
let lastShot=0;

function switchWeapon(){

 weaponIndex=(weaponIndex+1)%weapons.length;

 document.getElementById("weapon").textContent=
  weapons[weaponIndex].name;
}


/* =========================================================
   WANTED
========================================================= */

let wanted=0;

function addWanted(n=1){

 wanted=Math.min(5,wanted+n);
 wantedTimer=0;
}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(amount){

 player.userData.health-=amount;

 if(player.userData.health<=0){

  player.userData.health=100;
  player.position.set(0,0,15);
  wanted=0;
  player.userData.money=
   Math.max(0,player.userData.money-100);
 }
}


/* =========================================================
   SHOOT
========================================================= */

const raycaster=new T.Raycaster();

function shoot(){

 const now=performance.now();
 const gun=weapons[weaponIndex];

 if(now-lastShot<gun.cooldown)return;

 lastShot=now;

 raycaster.setFromCamera(
  new T.Vector2(0,0),
  camera
 );

 const objects=[
  ...people,
  ...cars
 ];

 const hits=raycaster.intersectObjects(objects,true);

 if(!hits.length)return;

 let obj=hits[0].object;

 while(
  obj.parent &&
  !people.includes(obj) &&
  !cars.includes(obj)
 ){
  obj=obj.parent;
 }

 const person=people.find(p=>p===obj);

 if(person){

  person.userData.health-=gun.damage;

  addWanted();

  if(person.userData.health<=0){

   scene.remove(person);

   const i=people.indexOf(person);

   if(i>=0)people.splice(i,1);

   player.userData.money+=50;
   kills++;
  }
 }

 const car=cars.find(c=>c===obj);

 if(car){

  car.userData.health-=gun.damage;
  addWanted();

  if(car.userData.health<=0){

   scene.remove(car);

   const i=cars.indexOf(car);

   if(i>=0)cars.splice(i,1);
  }
 }
}


/* =========================================================
   MISSIONS
========================================================= */

let mission=0;
let kills=0;

const marker=new T.Mesh(
 new T.CylinderGeometry(3,3,.2,32),
 new T.MeshBasicMaterial({
  color:0x00aaff,
  transparent:true,
  opacity:.65
 })
);

marker.position.set(35,.15,-35);
scene.add(marker);

const missionText=[
 "Mission 1: Reach the blue marker",
 "Mission 2: Steal a car",
 "Mission 3: Defeat 3 enemies",
 "Mission 4: Escape the police",
 "Mission complete! Free roam"
];

function dist(a,b){
 return a.position.distanceTo(b.position);
}

function updateMission(){

 if(mission===0 &&
    dist(player,marker)<6){

  mission=1;
  marker.position.set(-12,.15,-12);
 }

 if(mission===1 &&
    player.userData.inCar){

  mission=2;
  marker.position.set(45,.15,45);
 }

 if(mission===2 &&
    kills>=3){

  mission=3;
  marker.position.set(0,.15,0);
 }

 if(mission===3 &&
    wanted===0){

  mission=4;
  marker.visible=false;
 }

 document.getElementById("mission").textContent=
  missionText[mission];
}


/* =========================================================
   CAR ENTRY
========================================================= */

function nearestCar(){

 let best=null;
 let bestD=8;

 for(const c of cars){

  if(c.userData.police)continue;

  const d=player.position.distanceTo(c.position);

  if(d<bestD){

   bestD=d;
   best=c;
  }
 }

 return best;
}

function enterCar(){

 if(player.userData.inCar){
  exitCar();
  return;
 }

 const c=nearestCar();

 if(!c)return;

 player.userData.inCar=true;
 player.userData.car=c;

 player.visible=false;

 addWanted();
}

function exitCar(){

 if(!player.userData.inCar)return;

 const c=player.userData.car;

 player.userData.inCar=false;
 player.userData.car=null;

 player.visible=true;

 player.position.copy(c.position);
 player.position.x+=3;
}


/* =========================================================
   POLICE
========================================================= */

const policeCars=[];

function spawnPolice(){

 if(policeCars.length>=wanted)return;

 const a=Math.random()*Math.PI*2;

 const p=createCar(
  player.position.x+Math.cos(a)*50,
  player.position.z+Math.sin(a)*50,
  0x1111aa,
  true
 );

 policeCars.push(p);
}

function updatePolice(dt){

 if(wanted===0)return;

 while(policeCars.length<wanted)
  spawnPolice();

 for(const p of policeCars){

  if(!p.parent)continue;

  const dx=player.position.x-p.position.x;
  const dz=player.position.z-p.position.z;

  const d=Math.hypot(dx,dz);

  const a=Math.atan2(dx,dz);

  p.rotation.y=a;

  if(d>3){

   p.position.x+=Math.sin(a)*dt*(6+wanted);
   p.position.z+=Math.cos(a)*dt*(6+wanted);
  }

  if(d<5)
   damagePlayer(10*dt);
 }
}


/* =========================================================
   KEYBOARD
========================================================= */

const keys={};

addEventListener("keydown",e=>{

 keys[e.key.toLowerCase()]=true;

 if(e.key.toLowerCase()==="r")
  switchWeapon();

});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});


/* =========================================================
   JOYSTICK
========================================================= */

let joyX=0;
let joyY=0;
let joyActive=false;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function moveJoy(x,y){

 const r=joy.getBoundingClientRect();

 let dx=x-(r.left+r.width/2);
 let dy=y-(r.top+r.height/2);

 const max=45;

 const len=Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
 `translate(${dx}px,${dy}px)`;
}

joy.addEventListener("pointerdown",e=>{

 joyActive=true;
 joy.setPointerCapture(e.pointerId);

 moveJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{

 if(joyActive)
  moveJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointerup",()=>{

 joyActive=false;
 joyX=0;
 joyY=0;

 stick.style.transform="";
});


/* =========================================================
   LOOK / TURN
========================================================= */

let lookActive=false;
let lastLookX=0;

const look=document.getElementById("look");

look.addEventListener("pointerdown",e=>{

 lookActive=true;
 lastLookX=e.clientX;

 look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",e=>{

 if(!lookActive)return;

 const dx=e.clientX-lastLookX;

 /* direct character turning */

 player.rotation.y-=dx*.012;

 lastLookX=e.clientX;
});

look.addEventListener("pointerup",()=>{
 lookActive=false;
});

/* =========================================================
   JUMP
========================================================= */

let velocityY=0;
let onGround=true;

function jump(){

 if(!onGround)return;

 velocityY=9;
 onGround=false;
}


/* =========================================================
   HUMAN ANIMATION
========================================================= */

function animateHuman(g,t){

 const s=Math.sin(t*10)*.55;

 g.userData.armL.rotation.x=s;
 g.userData.armR.rotation.x=-s;

 g.userData.legL.rotation.x=-s;
 g.userData.legR.rotation.x=s;
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

 /* CAR MODE */

 if(player.userData.inCar){

  const c=player.userData.car;

  if(!c || !c.parent){

   player.userData.inCar=false;
   player.userData.car=null;
   player.visible=true;

  }else{

   let throttle=0;

   if(gas||keys["w"])
    throttle=1;

   if(brake||keys["s"])
    throttle=-1;

   c.userData.speed+=throttle*dt*14;

   c.userData.speed*=.97;

   c.userData.speed=
    Math.max(-6,Math.min(20,c.userData.speed));

   if(keys["a"])
    c.rotation.y+=dt*1.8;

   if(keys["d"])
    c.rotation.y-=dt*1.8;

   c.position.x+=
    Math.sin(c.rotation.y)*
    c.userData.speed*dt;

   c.position.z+=
    Math.cos(c.rotation.y)*
    c.userData.speed*dt;

   player.position.copy(c.position);
  }

  return;
 }


 /* WALK MODE */

 let forward=-joyY;
 let side=joyX;

 if(keys["w"])forward+=1;
 if(keys["s"])forward-=1;
 if(keys["d"])side+=1;
 if(keys["a"])side-=1;

 let length=Math.hypot(forward,side);

 if(length>1){

  forward/=length;
  side/=length;
 }

 const isRunning=
  running ||
  keys["shift"];

 const speed=isRunning?15:7;

 if(Math.abs(forward)+Math.abs(side)>.1){

  /* movement is based on player's actual facing */

  const sin=Math.sin(player.rotation.y);
  const cos=Math.cos(player.rotation.y);

  player.position.x+=
   sin*forward*speed*dt+
   cos*side*speed*dt;

  player.position.z+=
   cos*forward*speed*dt-
   sin*side*speed*dt;

  player.userData.walkTime+=dt;

  animateHuman(
   playerModel,
   player.userData.walkTime
  );
 }


 /* jump */

 velocityY-=22*dt;

 player.position.y+=velocityY*dt;

 if(player.position.y<=0){

  player.position.y=0;
  velocityY=0;
  onGround=true;
 }
}


/* =========================================================
   PEOPLE
========================================================= */

function updatePeople(dt){

 for(const p of people){

  p.userData.walkTime+=dt;

  p.position.x+=
   Math.sin(p.userData.dir)*1.1*dt;

  p.position.z+=
   Math.cos(p.userData.dir)*1.1*dt;

  animateHuman(
   p,
   p.userData.walkTime
  );

  if(Math.abs(p.position.x)>150 ||
     Math.abs(p.position.z)>150){

   p.userData.dir+=Math.PI;
  }
 }
}


/* =========================================================
   TRAFFIC
========================================================= */

function updateTraffic(dt){

 for(const c of cars){

  if(!c.userData.traffic)continue;

  c.position.z+=c.userData.speed*dt;

  if(c.position.z>165)
   c.position.z=-165;
 }
}


/* =========================================================
   WANTED TIMER
========================================================= */

let wantedTimer=0;

function updateWanted(dt){

 if(wanted<=0)return;

 wantedTimer+=dt;

 if(wantedTimer>15){

  const nearby=policeCars.some(
   p=>p.parent &&
   p.position.distanceTo(player.position)<50
  );

  if(!nearby){

   wanted=Math.max(0,wanted-1);
   wantedTimer=0;
  }
 }
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let worldTime=12;

function updateTime(dt){

 worldTime+=dt*.12;

 if(worldTime>=24)
  worldTime=0;

 const daylight=
  Math.max(
   .12,
   Math.sin((worldTime-6)/24*Math.PI*2)*.5+.5
  );

 sun.intensity=.3+daylight*1.0;
 hemi.intensity=.4+daylight;

 if(daylight<.32){

  scene.background.set(0x11182c);
  scene.fog.color.set(0x11182c);

 }else{

  scene.background.set(0x8bb9dc);
  scene.fog.color.set(0x8bb9dc);
 }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

 let target=player.position.clone();

 target.y+=2.3;

 const distance=
  player.userData.inCar?11:8;

 /* camera follows player's heading */

 const angle=player.rotation.y;

 const desired=new T.Vector3(
  target.x-Math.sin(angle)*distance,
  target.y+2.5,
  target.z-Math.cos(angle)*distance
 );

 camera.position.lerp(desired,.12);

 camera.lookAt(target);
}


/* =========================================================
   MAP
========================================================= */

const map=document.getElementById("map");
const ctx=map.getContext("2d");

function mapDot(x,z,color,size){

 const scale=.30;

 const px=65+x*scale;
 const pz=65+z*scale;

 ctx.fillStyle=color;

 ctx.beginPath();
 ctx.arc(px,pz,size,0,Math.PI*2);
 ctx.fill();
}

function drawMap(){

 ctx.fillStyle="#202020";
 ctx.fillRect(0,0,130,130);

 ctx.fillStyle="#555";

 ctx.fillRect(58,0,14,130);
 ctx.fillRect(0,58,130,14);

 mapDot(
  player.position.x,
  player.position.z,
  "#00ff66",
  4
 );

 if(marker.visible)
  mapDot(
   marker.position.x,
   marker.position.z,
   "#00aaff",
   4
  );

 for(const p of policeCars){

  if(p.parent)
   mapDot(
    p.position.x,
    p.position.z,
    "#ff2222",
    3
   );
 }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

 document.getElementById("health").textContent=
  Math.floor(Math.max(0,player.userData.health));

 document.getElementById("money").textContent=
  Math.floor(player.userData.money);

 document.getElementById("wanted").textContent=
  wanted;
}

   FIRE
========================================================= */

function updateFire(){

 if(firing)
  shoot();
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight,
  false
 );
});


/* =========================================================
   START
========================================================= */

document.getElementById("loading").style.display="none";

camera.position.set(0,5,23);

renderer.render(scene,camera);


/* =========================================================
   LOOP
========================================================= */

function loop(){

 requestAnimationFrame(loop);

 const dt=Math.min(clock.getDelta(),.05);

 updatePlayer(dt);
 updatePeople(dt);
 updateTraffic(dt);
 updatePolice(dt);
 updateWanted(dt);
 updateTime(dt);
 updateMission();
 updateFire();
 updateCamera();
 updateHUD();
 drawMap();

 renderer.render(scene,camera);
}

loop();

}
