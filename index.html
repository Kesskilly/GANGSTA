<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Open City V7</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#82b5d4;
 font-family:Arial;
 touch-action:none
}

canvas{display:block}

#hud{
 position:fixed;
 top:8px;
 left:8px;
 color:white;
 text-shadow:2px 2px 3px #000;
 z-index:100;
 font-size:13px;
 pointer-events:none
}

#hud b{font-size:19px}

#cross{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:white;
 font-size:24px;
 z-index:120;
 pointer-events:none
}

#map{
 position:fixed;
 right:8px;
 top:8px;
 width:120px;
 height:120px;
 background:#172017;
 border:2px solid white;
 border-radius:8px;
 z-index:110
}

#msg{
 position:fixed;
 left:50%;
 top:43%;
 transform:translate(-50%,-50%);
 color:white;
 font-size:23px;
 font-weight:bold;
 text-align:center;
 text-shadow:2px 2px 5px #000;
 z-index:200;
 display:none;
 pointer-events:none
}

#joy{
 position:fixed;
 left:16px;
 bottom:16px;
 width:125px;
 height:125px;
 border:3px solid #ffffff88;
 border-radius:50%;
 background:#0004;
 z-index:150
}

#stick{
 position:absolute;
 width:52px;
 height:52px;
 left:33px;
 top:33px;
 border-radius:50%;
 background:#fff9
}

#look{
 position:fixed;
 right:0;
 top:0;
 width:58%;
 height:65%;
 z-index:90
}

#buttons,#drive{
 position:fixed;
 right:10px;
 bottom:12px;
 z-index:160;
 width:235px;
 display:flex;
 gap:6px;
 flex-wrap:wrap
}

#drive{display:none}

button{
 width:61px;
 height:61px;
 border:2px solid #fff9;
 border-radius:50%;
 background:#0009;
 color:#fff;
 font-weight:bold;
 font-size:10px
}

button:active{
 transform:scale(.94)
}

#fire{background:#a00000dd}
#enter{display:none;background:#087cdd}

#save,#load{
 position:fixed;
 left:8px;
 z-index:170;
 width:70px;
 height:35px;
 border-radius:8px;
 font-size:10px
}

#save{bottom:150px}
#load{bottom:108px}
</style>
</head>

<body>

<div id="hud">
<b>OPEN CITY V7</b><br>
❤️ <span id="hp">100</span>
&nbsp; 🔫 <span id="ammo">30</span>
&nbsp; 💵 $<span id="money">500</span><br>

⭐ <span id="wanted">0</span>
&nbsp; 🚓 <span id="police">0</span>
&nbsp; 🚗 <span id="carhp">100</span><br>

🕐 <span id="clock">08:00</span>
&nbsp; 🔫 <span id="weapon">PISTOL</span><br>

<div id="mission">MISSION: Reach blue marker</div>
</div>

<canvas id="map" width="120" height="120"></canvas>

<div id="cross">+</div>
<div id="msg"></div>

<button id="save">SAVE</button>
<button id="load">LOAD</button>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="look"></div>

<div id="buttons">
 <button id="fire">FIRE</button>
 <button id="jump">JUMP</button>
 <button id="run">RUN</button>
 <button id="weaponBtn">WEAPON</button>
 <button id="enter">ENTER</button>
</div>

<div id="drive">
 <button id="gas">GAS</button>
 <button id="brake">BRAKE</button>
 <button id="exit">EXIT</button>
</div>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"
onerror="this.onerror=null;this.src='https://unpkg.com/three@0.160.0/build/three.min.js">
</script>

<script>

/* ===============================
   ENGINE
================================ */

if(!window.THREE){

 document.getElementById("msg").innerHTML=
 "3D ENGINE FAILED<br>CHECK INTERNET";

 document.getElementById("msg").style.display="block";

 throw new Error("Three.js failed");
}

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x82b5d4);

scene.fog=new THREE.Fog(
 0x82b5d4,
 70,
 300
);

const camera=new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 500
);

let renderer;

try{

 renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
 });

}catch(e){

 document.getElementById("msg").innerHTML=
 "WEBGL NOT AVAILABLE";

 document.getElementById("msg").style.display="block";

 throw e;
}

renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);

renderer.domElement.style.position="fixed";
renderer.domElement.style.left="0";
renderer.domElement.style.top="0";
renderer.domElement.style.zIndex="1";

document.body.insertBefore(
 renderer.domElement,
 document.body.firstChild
);

const hemi=new THREE.HemisphereLight(
 0xffffff,
 0x405040,
 1.5
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
 0xffffff,
 1.8
);

sun.position.set(80,120,50);
scene.add(sun);


/* ===============================
   HELPERS
================================ */

function cube(w,h,d,color,x,y,z,parent=scene){

 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:color
  })
 );

 m.position.set(x,y,z);
 parent.add(m);

 return m;
}

function dist(a,b){

 return Math.hypot(
  a.position.x-b.position.x,
  a.position.z-b.position.z
 );
}


/* ===============================
   GROUND
================================ */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(400,400),
 new THREE.MeshStandardMaterial({
  color:0x39783c
 })
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* ===============================
   ROADS
================================ */

for(let x=-80;x<=80;x+=40){

 cube(12,.12,200,0x303236,x,.05,0);

 cube(1,.13,200,0xaaaaaa,x-6,.08,0);

 cube(1,.13,200,0xaaaaaa,x+6,.08,0);
}

for(let z=-80;z<=80;z+=40){

 cube(200,.12,12,0x303236,0,.05,z);

 cube(200,.13,1,0xaaaaaa,0,.08,z-6);

 cube(200,.13,1,0xaaaaaa,0,.08,z+6);
}


/* ===============================
   BUILDINGS
================================ */

let seed=8;

function rnd(){

 seed=(seed*9301+49297)%233280;

 return seed/233280;
}

const buildingColors=[
 0x70777d,
 0x8a7567,
 0x526878,
 0x806d80,
 0x68765e
];

for(let x=-80;x<=80;x+=40){

 for(let z=-80;z<=80;z+=40){

  if(Math.abs(x)<20&&Math.abs(z)<20)
   continue;

  for(let a of[-12,12]){

   for(let b of[-12,12]){

    let h=8+rnd()*22;

    cube(
     10+rnd()*5,
     h,
     10+rnd()*5,
     buildingColors[
      Math.floor(
       rnd()*buildingColors.length
      )
     ],
     x+a,
     h/2,
     z+b
    );
   }
  }
 }
}


/* ===============================
   TREES
================================ */

function tree(x,z){

 cube(.8,4,.8,0x654321,x,2,z);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(3,8,8),
  new THREE.MeshStandardMaterial({
   color:0x246b32
  })
 );

 crown.position.set(x,6,z);

 scene.add(crown);
}

for(let i=0;i<35;i++){

 tree(
  (rnd()-.5)*170,
  (rnd()-.5)*170
 );
}


/* ===============================
   PLAYER
================================ */

const player=new THREE.Group();

cube(
 1.4,2,.8,
 0x222222,
 0,2.1,0,
 player
);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.55,12,10),
 new THREE.MeshStandardMaterial({
  color:0xc98b63
 })
);

head.position.y=3.6;

player.add(head);

cube(
 .45,1.8,.55,
 0x1d3550,
 -.4,.8,0,
 player
);

cube(
 .45,1.8,.55,
 0x1d3550,
 .4,.8,0,
 player
);

cube(
 .4,1.6,.5,
 0xc98b63,
 -.9,2.1,0,
 player
);

cube(
 .4,1.6,.5,
 0xc98b63,
 .9,2.1,0,
 player
);

const gun=cube(
 .25,.25,1.2,
 0x111111,
 .75,2.2,-.65,
 player
);

player.position.set(0,0,10);

scene.add(player);


/* ===============================
   WEAPONS
================================ */

const weapons=[

 {
  name:"PISTOL",
  damage:50,
  ammo:30,
  price:0,
  color:0x111111
 },

 {
  name:"RIFLE",
  damage:85,
  ammo:60,
  price:1000,
  color:0x444444
 }
];

let weaponIndex=0;

function currentWeapon(){

 return weapons[weaponIndex];
}

function updateWeapon(){

 const w=currentWeapon();

 gun.material.color.set(w.color);

 document.getElementById("weapon").textContent=w.name;

 document.getElementById("ammo").textContent=w.ammo;
}


/* ===============================
   CAR SYSTEM
================================ */

let cars=[];
let traffic=[];
let police=[];
let currentCar=null;
let driving=false;

function makeCar(
 x,z,
 color,
 rot=0,
 isPolice=false,
 isTraffic=false
){

 const g=new THREE.Group();

 g.position.set(x,0,z);
 g.rotation.y=rot;

 g.userData.speed=0;
 g.userData.used=false;
 g.userData.health=100;
 g.userData.police=isPolice;
 g.userData.traffic=isTraffic;

 cube(
  4.4,1.1,7,
  isPolice?0xffffff:color,
  0,1,0,
  g
 );

 cube(
  3.1,1,3,
  0x20252b,
  0,1.8,0,
  g
 );

 const wheelGeo=
  new THREE.CylinderGeometry(
   .7,.7,.45,12
  );

 for(let a of[-2.1,2.1]){

  for(let b of[-2.2,2.2]){

   const w=new THREE.Mesh(
    wheelGeo,
    new THREE.MeshStandardMaterial({
     color:0x111111
    })
   );

   w.rotation.z=Math.PI/2;

   w.position.set(a,.7,b);

   g.add(w);
  }
 }

 if(isPolice){

  cube(
   .7,.25,1,
   0xff0000,
   -.5,2.5,0,
   g
  );

  cube(
   .7,.25,1,
   0x0000ff,
   .5,2.5,0,
   g
  );
 }

 scene.add(g);

 if(!isPolice&&!isTraffic)
  cars.push(g);

 if(isTraffic)
  traffic.push(g);

 return g;
}


/* parked cars */

makeCar(
 18,8,
 0xc63333,
 Math.PI/2
);

makeCar(
 -20,-30,
 0x2865c9,
 Math.PI/2
);

makeCar(
 45,45,
 0xd3a527
);

makeCar(
 -50,20,
 0xffffff,
 Math.PI/2
);


/* traffic */

const trafficColors=[
 0xff3333,
 0x3366ff,
 0xffff33,
 0xffffff,
 0x33aa66
];

for(let i=0;i<12;i++){

 const horizontal=i%2===0;

 const road=
  Math.floor(
   Math.random()*5-2
  )*40;

 const c=makeCar(
  horizontal?
   (Math.random()-.5)*180:
   road,

  horizontal?
   road:
   (Math.random()-.5)*180,

  trafficColors[
   Math.floor(
    Math.random()*trafficColors.length
   )
  ],

  horizontal?Math.PI/2:0,
  false,
  true
 );

 c.userData.speed=
  .05+Math.random()*.04;
}


/* ===============================
   TRAFFIC
================================ */

function updateTraffic(){

 for(const c of traffic){

  if(c.userData.used)
   continue;

  if(c.rotation.y===0){

   c.position.z+=c.userData.speed;

   if(c.position.z>150)
    c.position.z=-150;

  }else{

   c.position.x+=c.userData.speed;

   if(c.position.x>150)
    c.position.x=-150;
  }
 }
}


/* ===============================
   PEDESTRIANS
================================ */

let pedestrians=[];

function makePed(x,z){

 const p=new THREE.Group();

 p.position.set(x,0,z);

 cube(
  .8,1.7,.6,
  0x3366aa,
  0,1.7,0,
  p
 );

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.38,8,8),
  new THREE.MeshStandardMaterial({
   color:0xc98b63
  })
 );

 h.position.y=2.8;

 p.add(h);

 p.userData.dx=
  (Math.random()-.5)*.025;

 p.userData.dz=
  (Math.random()-.5)*.025;

 scene.add(p);

 pedestrians.push(p);
}

for(let i=0;i<25;i++){

 makePed(
  (Math.random()-.5)*160,
  (Math.random()-.5)*160
 );
}

function updatePeds(){

 for(const p of pedestrians){

  p.position.x+=p.userData.dx;
  p.position.z+=p.userData.dz;

  if(Math.abs(p.position.x)>150)
   p.userData.dx*=-1;

  if(Math.abs(p.position.z)>150)
   p.userData.dz*=-1;
 }
}


/* ===============================
   ENEMIES
================================ */

let enemies=[];

function makeEnemy(x,z){

 const e=new THREE.Group();

 e.position.set(x,0,z);

 cube(
  1.3,2,.8,
  0x741515,
  0,2,0,
  e
 );

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.55,10,8),
  new THREE.MeshStandardMaterial({
   color:0xb87955
  })
 );

 h.position.y=3.5;

 e.add(h);

 e.userData.hp=100;
 e.userData.dead=false;
 e.userData.cool=0;
 e.userData.enemyRoot=true;

 scene.add(e);

 enemies.push(e);
}

makeEnemy(35,15);
makeEnemy(-35,-10);
makeEnemy(55,-35);
makeEnemy(-55,45);
makeEnemy(65,65);


/* ===============================
   GAME STATE
================================ */

let hp=100;
let money=500;
let wanted=0;

let joyX=0;
let joyY=0;
let joyActive=false;

let camAngle=0;

let velocityY=0;
let onGround=true;

let running=false;
let gas=false;
let brake=false;

let keys={};


/* ===============================
   JOYSTICK
================================ */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function setJoy(x,y){

 const r=joy.getBoundingClientRect();

 let dx=x-r.left-r.width/2;
 let dy=y-r.top-r.height/2;

 const max=43;

 const len=Math.hypot(dx,dy);

 if(len>max){

  dx=dx/len*max;
  dy=dy/len*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
  "translate("+dx+"px,"+dy+"px)";
}

function resetJoy(){

 joyActive=false;
 joyX=0;
 joyY=0;

 stick.style.transform=
  "translate(0,0)";
}

joy.addEventListener(
 "pointerdown",
 e=>{

  joyActive=true;

  joy.setPointerCapture(e.pointerId);

  setJoy(e.clientX,e.clientY);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(joyActive)
   setJoy(e.clientX,e.clientY);
 }
);

joy.addEventListener(
 "pointerup",
 resetJoy
);

joy.addEventListener(
 "pointercancel",
 resetJoy
);


/* ===============================
   LOOK
================================ */

const look=document.getElementById("look");

let looking=false;
let lastX=0;

look.addEventListener(
 "pointerdown",
 e=>{

  looking=true;
  lastX=e.clientX;

  look.setPointerCapture(
   e.pointerId
  );
 }
);

look.addEventListener(
 "pointermove",
 e=>{

  if(!looking)
   return;

  camAngle-=
   (e.clientX-lastX)*.008;

  lastX=e.clientX;
 }
);

look.addEventListener(
 "pointerup",
 ()=>looking=false
);

look.addEventListener(
 "pointercancel",
 ()=>looking=false
);


/* ===============================
   WALK
================================ */

function walk(){

 if(driving)
  return;

 let f=-joyY;
 let s=joyX;

 if(keys.w)f=1;
 if(keys.s)f=-1;
 if(keys.a)s=-1;
 if(keys.d)s=1;

 let x=
  Math.sin(camAngle)*f+
  Math.cos(camAngle)*s;

 let z=
  Math.cos(camAngle)*f-
  Math.sin(camAngle)*s;

 let len=Math.hypot(x,z);

 if(len>1){

  x/=len;
  z/=len;
 }

 const speed=
  running||keys.shift
   ? .18
   : .1;

 player.position.x+=x*speed;
 player.position.z+=z*speed;

 if(len>.1)
  player.rotation.y=
   Math.atan2(x,z);

 velocityY-=.012;

 player.position.y+=velocityY;

 if(player.position.y<=0){

  player.position.y=0;
  velocityY=0;
  onGround=true;
 }
}


/* ===============================
   NEAREST CAR
================================ */

function nearestCar(){

 let best=null;
 let bestDistance=999;

 for(const c of cars){

  if(c.userData.used)
   continue;

  const d=dist(player,c);

  if(d<bestDistance){

   bestDistance=d;
   best=c;
  }
 }

 return best;
}


/* ===============================
   ENTER CAR
================================ */

function enterCar(){

 const c=nearestCar();

 if(!c)
  return;

 currentCar=c;
 driving=true;

 c.userData.used=true;
 c.userData.health=100;

 player.visible=false;

 wanted=Math.min(
  5,
  wanted+1
 );

 document.getElementById(
  "buttons"
 ).style.display="none";

 document.getElementById(
  "drive"
 ).style.display="flex";

 showMsg(
  "CAR STOLEN<br>WANTED +1"
 );
}


/* ===============================
   EXIT CAR
================================ */

function exitCar(){

 if(!currentCar)
  return;

 const c=currentCar;

 c.userData.used=false;

 player.position.set(
  c.position.x+
   Math.cos(c.rotation.y)*5,
  0,
  c.position.z-
   Math.sin(c.rotation.y)*5
 );

 player.visible=true;

 currentCar=null;
 driving=false;

 document.getElementById(
  "drive"
 ).style.display="none";

 document.getElementById(
  "buttons"
 ).style.display="flex";
}


/* ===============================
   DRIVE
================================ */

function drive(){

 if(!driving||!currentCar)
  return;

 const c=currentCar;

 let throttle=0;

 if(gas||keys.w)
  throttle=1;

 if(brake||keys.s)
  throttle=-1;

 c.userData.speed+=
  throttle*.012;

 c.userData.speed*=.985;

 c.userData.speed=
  Math.max(
   -.18,
   Math.min(
    .42,
    c.userData.speed
   )
  );

 let steer=joyX;

 if(keys.a)
  steer=-1;

 if(keys.d)
  steer=1;

 if(
  Math.abs(c.userData.speed)>.005
 ){

  c.rotation.y+=
   steer*.035*
   Math.min(
    1,
    Math.abs(c.userData.speed)*4
   )*
   Math.sign(c.userData.speed);
 }

 c.position.x+=
  Math.sin(c.rotation.y)*
  c.userData.speed;

 c.position.z+=
  Math.cos(c.rotation.y)*
  c.userData.speed;

 c.position.x=
  Math.max(
   -190,
   Math.min(
    190,
    c.position.x
   )
  );

 c.position.z=
  Math.max(
   -190,
   Math.min(
    190,
    c.position.z
   )
  );

 /* car damage from high speed */

 if(Math.abs(c.userData.speed)>.35){

  for(const e of enemies){

   if(dist(c,e)<3){

    c.userData.health-=.5;
    e.userData.hp-=20;
   }
  }
 }

 if(c.userData.health<=0){

  c.userData.health=0;

  showMsg(
   "CAR DESTROYED"
  );

  exitCar();
 }
}


/* ===============================
   POLICE
================================ */

function spawnPolice(){

 if(police.length>=wanted)
  return;

 const a=Math.random()*Math.PI*2;
 const d=35+Math.random()*20;

 const x=
  player.position.x+
  Math.sin(a)*d;

 const z=
  player.position.z+
  Math.cos(a)*d;

 const car=makeCar(
  x,z,
  0xffffff,
  a,
  true,
  false
 );

 police.push({
  car:car,
  cooldown:0
 });
}

function updatePolice(){

 if(wanted<=0){

  for(const p of police)
   scene.remove(p.car);

  police.length=0;

  return;
 }

 while(police.length<wanted)
  spawnPolice();

 for(const p of police){

  const c=p.car;

  let targetX=player.position.x;
  let targetZ=player.position.z;

  if(driving&&currentCar){

   targetX=currentCar.position.x;
   targetZ=currentCar.position.z;
  }

  const dx=
   targetX-c.position.x;

  const dz=
   targetZ-c.position.z;

  const d=Math.hypot(dx,dz);

  const targetAngle=
   Math.atan2(dx,dz);

  let diff=
   Math.atan2(
    Math.sin(targetAngle-c.rotation.y),
    Math.cos(targetAngle-c.rotation.y)
   );

  c.rotation.y+=
   Math.max(
    -.04,
    Math.min(.04,diff)
   );

  c.userData.speed+=.009;

  c.userData.speed*=.99;

  c.userData.speed=
   Math.min(.34,c.userData.speed);

  c.position.x+=
   Math.sin(c.rotation.y)*
   c.userData.speed;

  c.position.z+=
   Math.cos(c.rotation.y)*
   c.userData.speed;

  p.cooldown--;

  if(d<5&&p.cooldown<=0){

   if(driving&&currentCar){

    currentCar.userData.health-=12;

    showMsg(
     "POLICE HIT!"
    );

   }else{

    hp-=10;
   }

   p.cooldown=45;
  }
 }
}


/* ===============================
   WANTED SYSTEM
================================ */

let wantedTimer=0;

function wantedSystem(){

 if(wanted<=0){

  wantedTimer=0;
  return;
 }

 wantedTimer++;

 /* lose wanted level after 20 seconds */

 if(
  wantedTimer>1200 &&
  police.length===0
 ){

  wanted--;

  wantedTimer=0;
 }
}


/* ===============================
   SHOOTING
================================ */

const raycaster=
 new THREE.Raycaster();

function shoot(){

 if(driving)
  return;

 const w=currentWeapon();

 if(w.ammo<=0){

  showMsg(
   "OUT OF AMMO"
  );

  return;
 }

 w.ammo--;

 wanted=Math.min(
  5,
  wanted+1
 );

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 const targets=
  enemies.filter(
   e=>!e.userData.dead
  );

 const hits=
  raycaster.intersectObjects(
   targets,
   true
  );

 if(hits.length){

  let obj=hits[0].object;

  while(
   obj.parent &&
   !obj.userData.enemyRoot
  )
   obj=obj.parent;

  if(obj.userData.enemyRoot){

   obj.userData.hp-=w.damage;

   if(obj.userData.hp<=0)
    killEnemy(obj);
  }
 }

 updateWeapon();
}


/* ===============================
   KILL ENEMY
================================ */

function killEnemy(e){

 if(e.userData.dead)
  return;

 e.userData.dead=true;

 money+=100;

 e.traverse(o=>{

  if(o.isMesh)
   o.material.color.set(0x111111);
 });

 setTimeout(
  ()=>{

   scene.remove(e);

   const i=enemies.indexOf(e);

   if(i>=0)
    enemies.splice(i,1);

  },
  400
 );
}


/* ===============================
   ENEMY AI
================================ */

function updateEnemies(){

 for(const e of enemies){

  if(e.userData.dead)
   continue;

  const d=dist(player,e);

  if(d<35){

   const dx=
    player.position.x-
    e.position.x;

   const dz=
    player.position.z-
    e.position.z;

   const len=Math.hypot(dx,dz);

   if(len>5){

    e.position.x+=dx/len*.035;
    e.position.z+=dz/len*.035;
   }

   e.userData.cool--;

   if(
    d<6 &&
    e.userData.cool<=0
   ){

    hp-=8;

    e.userData.cool=60;
   }
  }
 }
}

/* ===============================
   DAY NIGHT
================================ */

let gameTime=8;

function updateDayNight(){

 gameTime+=.002;

 if(gameTime>=24)
  gameTime=0;

 const daylight=
  Math.max(
   0,
   Math.sin(
    (gameTime-6)*Math.PI/12
   )
  );

 sun.intensity=
  .35+daylight*1.7;

 hemi.intensity=
  .4+daylight*1.3;

 const r=
  Math.floor(25+daylight*100);

 const g=
  Math.floor(45+daylight*140);

 const b=
  Math.floor(65+daylight*150);

 scene.background.setRGB(
  r/255,
  g/255,
  b/255
 );

 scene.fog.color.copy(
  scene.background
 );

 const hour=Math.floor(gameTime);

 const min=Math.floor(
  (gameTime-hour)*60
 );

 document.getElementById(
  "clock"
 ).textContent=
  String(hour).padStart(2,"0")+
  ":"+
  String(min).padStart(2,"0");
}


/* ===============================
   CAMERA
================================ */

function updateCamera(){

 if(driving&&currentCar){

  const c=currentCar;

  camera.position.x=
   c.position.x-
   Math.sin(camAngle)*10;

  camera.position.y=5.5;

  camera.position.z=
   c.position.z-
   Math.cos(camAngle)*10;

  camera.lookAt(
   c.position.x,
   1.5,
   c.position.z
  );

 }else{

  camera.position.x=
   player.position.x-
   Math.sin(camAngle)*9;

  camera.position.y=
   player.position.y+5.5;

  camera.position.z=
   player.position.z-
   Math.cos(camAngle)*9;

  camera.lookAt(
   player.position.x,
   player.position.y+2,
   player.position.z
  );
 }
}


/* ===============================
   MINIMAP
================================ */

const map=
 document.getElementById("map");

const ctx=
 map.getContext("2d");

function drawMap(){

 ctx.fillStyle="#172017";
 ctx.fillRect(0,0,120,120);

 ctx.strokeStyle="#555";
 ctx.lineWidth=4;

 for(let x=-100;x<=100;x+=40){

  const px=60+x/3;

  ctx.beginPath();
  ctx.moveTo(px,0);
  ctx.lineTo(px,120);
  ctx.stroke();
 }

 for(let z=-100;z<=100;z+=40){

  const py=60+z/3;

  ctx.beginPath();
  ctx.moveTo(0,py);
  ctx.lineTo(120,py);
  ctx.stroke();
 }

 /* player */

 ctx.fillStyle="#00ffff";

 ctx.beginPath();

 ctx.arc(
  60+player.position.x/3,
  60+player.position.z/3,
  4,0,Math.PI*2
 );

 ctx.fill();


 /* cars */

 ctx.fillStyle="#00aaff";

 for(const c of cars){

  ctx.fillRect(
   59+c.position.x/3,
   59+c.position.z/3,
   3,3
  );
 }


 /* police */

 ctx.fillStyle="#ffffff";

 for(const p of police){

  ctx.beginPath();

  ctx.arc(
   60+p.car.position.x/3,
   60+p.car.position.z/3,
   3,0,Math.PI*2
  );

  ctx.fill();
 }


 /* enemies */

 ctx.fillStyle="#ff3333";

 for(const e of enemies){

  if(e.userData.dead)
   continue;

  ctx.beginPath();

  ctx.arc(
   60+e.position.x/3,
   60+e.position.z/3,
   3,0,Math.PI*2
  );

  ctx.fill();
 }


 /* mission */

 ctx.fillStyle="#00ff55";

 ctx.beginPath();

 ctx.arc(
  60+marker.position.x/3,
  60+marker.position.z/3,
  4,0,Math.PI*2
 );

 ctx.fill();
}

/* ===============================
   SAVE / LOAD
================================ */

function saveGame(){

 localStorage.setItem(
  "openCityV7",
  JSON.stringify({

   hp:hp,
   money:money,
   wanted:wanted,

   weaponIndex:weaponIndex,

   ammo:weapons.map(
    w=>w.ammo
   ),

   mission:mission,

   playerX:player.position.x,
   playerZ:player.position.z,

   gameTime:gameTime
  })
 );

 showMsg("GAME SAVED");
}


function loadGame(){

 const raw=
  localStorage.getItem(
   "openCityV7"
  );

 if(!raw){

  showMsg(
   "NO SAVE FOUND"
  );

  return;
 }

 const s=JSON.parse(raw);

 hp=s.hp??100;
 money=s.money??500;
 wanted=s.wanted??0;

 weaponIndex=s.weaponIndex??0;

 if(s.ammo){

  for(
   let i=0;
   i<s.ammo.length;
   i++
  ){

   if(weapons[i])
    weapons[i].ammo=s.ammo[i];
  }
 }

 mission=s.mission??0;

 player.position.x=
  s.playerX??0;

 player.position.z=
  s.playerZ??10;

 gameTime=
  s.gameTime??8;

 updateWeapon();

 showMsg(
  "GAME LOADED"
 );
}


document.getElementById(
 "save"

 saveGame
);


document.getElementById(
 "load"

 "pointerdown",

);


/* ===============================
   KEYBOARD
================================ */

addEventListener(
 "keydown",
 e=>{

  keys[
   e.key.toLowerCase()
  ]=true;

  if(
   e.key===" " &&
   !driving &&
   onGround
  ){

   velocityY=.25;
   onGround=false;
  }

  if(
   e.key.toLowerCase()==="e"
  ){

   if(driving)
    exitCar();
   else
    enterCar();
  }

  if(
   e.key.toLowerCase()==="f"
  )
   shoot();

  if(e.key==="1"){

   weaponIndex=0;
   updateWeapon();
  }

  if(e.key==="2")
   buyRifle();

  if(
   e.key.toLowerCase()==="p"
  )
   saveGame();
 }
);


addEventListener(
 "keyup",
 e=>{

  keys[
   e.key.toLowerCase()
  ]=false;
 }
);

);
